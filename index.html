    <svg id="arrowCanvas">

    <pre id="errorResult" style="color: red; margin-top: 10px; font-size: 13px;"></pre>

    <script>
        // Toggle state for 命宮
        let isMinggongActive = false; 
        let isHeHuaEnabled = false; 

        // --- ADD THESE NEW VARIABLES AND FUNCTIONS FOR 胎元 ---
        let isTaiyuanActive = false;
        let taiyuanBarVisible = false;

        function calculateTaiyuan() {  
            if (!currentBaziData) return null;

            const monthStem = currentBaziData.C;
            const monthBranch = currentBaziData.D;

            // Return null if month data is somehow missing
            if (!monthStem || !monthBranch) return null;

            const stemIdx = tenkan_order.indexOf(monthStem);
            const branchIdx = deizi_order.indexOf(monthBranch);

            if (stemIdx === -1 || branchIdx === -1) return null;

            // Heavenly Stem + 1, Earthly Branch + 3
            const tStem = tenkan_order[(stemIdx + 1) % 10];
            const tBranch = deizi_order[(branchIdx + 3) % 12];

            return { stem: tStem, branch: tBranch };
        }

        function removeTaiyuan() {
            isTaiyuanActive = false;
            renderTaiyuanBar();
            renderGrid();
        }

        function renderTaiyuanBar() {
            const bar = document.getElementById('taiyuanBar');
            if (!bar) return;

            if (!taiyuanBarVisible) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML = '';

            const ty = calculateTaiyuan();
            if (!ty) {
                bar.innerHTML = '<div style="padding: 6px; color: var(--sub-text-color);">無胎元資料</div>';
                return;
            }

            const card = document.createElement('div');
            card.className = `dayun-card ${isTaiyuanActive ? 'selected-taiyuan' : ''}`; 
            card.onclick = () => {
                isTaiyuanActive = !isTaiyuanActive;
                renderTaiyuanBar();
                renderGrid();
            };

            const header = document.createElement('div');
            header.className = 'dayun-year';
            header.innerText = '胎元';

            const stemSquare = document.createElement('div');
            stemSquare.className = 'dayun-square';
            stemSquare.style.color = getElementColor(ty.stem);
            stemSquare.style.backgroundColor = getBgColor(ty.stem);
            stemSquare.innerText = ty.stem;

            const branchSquare = document.createElement('div');
            branchSquare.className = 'dayun-square';
            branchSquare.style.color = getElementColor(ty.branch);
            branchSquare.style.backgroundColor = getBgColor(ty.branch);
            branchSquare.innerText = ty.branch;

            card.appendChild(header);
            card.appendChild(stemSquare);
            card.appendChild(branchSquare);
            bar.appendChild(card);
        }
        // --- END NEW 胎元 CODE ---

        //
        let isTaixiActive = false;
        let taixiBarVisible = false;

        function calculateTaixi() {
            if (!currentBaziData) return null;

            const dayStem = currentBaziData.E;
            const dayBranch = currentBaziData.F;

            if (!dayStem || !dayBranch) return null;

            const taixiStemMap = {
                '甲': '己', '己': '甲',
                '乙': '庚', '庚': '乙',
                '丙': '辛', '辛': '丙',
                '丁': '壬', '壬': '丁',
                '戊': '癸', '癸': '戊'
            };
            
            const taixiBranchMap = {
                '子': '丑', '丑': '子',
                '寅': '亥', '亥': '寅',
                '卯': '戌', '戌': '卯',
                '辰': '酉', '酉': '辰',
                '巳': '申', '申': '巳',
                '午': '未', '未': '午'
            };

            return { stem: taixiStemMap[dayStem], branch: taixiBranchMap[dayBranch] };
        } 

        function removeTaixi() {
            isTaixiActive = false;
            renderTaixiBar();
            renderGrid();
        }

        function renderTaixiBar() {
            const bar = document.getElementById('taixiBar');
            if (!bar) return;

            if (!taixiBarVisible) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML = '';

            const ty = calculateTaixi();
            if (!ty) {
                bar.innerHTML = '<div style="padding: 6px; color: var(--sub-text-color);">無胎元資料</div>';
                return;
            }

            const card = document.createElement('div');
            card.className = `dayun-card ${isTaixiActive ? 'selected-taixi' : ''}`; 
            card.onclick = () => {
                isTaixiActive = !isTaixiActive;
                renderTaixiBar();
                renderGrid();
            };

            const header = document.createElement('div');
            header.className = 'dayun-year';
            header.innerText = '胎息';

            const stemSquare = document.createElement('div');
            stemSquare.className = 'dayun-square';
            stemSquare.style.color = getElementColor(ty.stem);
            stemSquare.style.backgroundColor = getBgColor(ty.stem);
            stemSquare.innerText = ty.stem;

            const branchSquare = document.createElement('div');
            branchSquare.className = 'dayun-square';
            branchSquare.style.color = getElementColor(ty.branch);
            branchSquare.style.backgroundColor = getBgColor(ty.branch);
            branchSquare.innerText = ty.branch;

            card.appendChild(header);
            card.appendChild(stemSquare);
            card.appendChild(branchSquare);
            bar.appendChild(card);
        }
        //

        //
        let isShengongActive = false;
        let shengongBarVisible = false;

        function calculateShengong(bazi) { 
            let yearStem, monthBranch, hourBranch;

            // 1. Extract values from passed array or global currentBaziData
            if (Array.isArray(bazi) && bazi.length >= 8) {
                yearStem = bazi[0];
                monthBranch = bazi[3];
                hourBranch = bazi[7];
            } else if (typeof currentBaziData !== 'undefined' && currentBaziData) {
                yearStem = currentBaziData.A;
                monthBranch = currentBaziData.D;
                hourBranch = currentBaziData.H;
            } else {
                return null;
            }

            if (!yearStem || !monthBranch || !hourBranch) return null;

            const monthBranchIdx = deizi_order.indexOf(monthBranch);
            const hourBranchIdx = deizi_order.indexOf(hourBranch);

            if (monthBranchIdx === -1 || hourBranchIdx === -1) return null;

            // 2. Find corresponding month palace (子上起正月: 寅 -> 子, 卯 -> 丑, 辰 -> 寅... i.e. index - 2)
            let currMonthIdx = (monthBranchIdx - 2 + 12) % 12;

            // 3. Dynamically find '酉' index and step until hour reaches '酉'
            const youIdx = deizi_order.indexOf("酉");
            let currHourIdx = hourBranchIdx;


            // Step hour forward (+1) and corresponding month backward (-1) until hour reaches '酉'
            while (currHourIdx !== youIdx) {
                currHourIdx = (currHourIdx + 1) % 12;
                currMonthIdx = (currMonthIdx - 1 + 12) % 12;
            }

            const calculatedWord = deizi_order[currMonthIdx];

            // 4. Derive Heavenly Stem using 五虎遁歌訣
            let calculatedStem = null;
            if (typeof 五虎遁歌訣 !== 'undefined' && 五虎遁歌訣[yearStem]) {
                calculatedStem = 五虎遁歌訣[yearStem][calculatedWord] || null;
            }

            return { stem: calculatedStem, branch: calculatedWord };
        }

        function removeShengong() {
            isShengongActive = false;
            renderShengongBar();
            renderGrid();
        }

        function renderShengongBar() {
            const bar = document.getElementById('shengongBar');
            if (!bar) return;

            if (!shengongBarVisible) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML = '';

            const ty = calculateShengong();
            if (!ty) {
                bar.innerHTML = '<div style="padding: 6px; color: var(--sub-text-color);">無胎元資料</div>';
                return;
            }

            const card = document.createElement('div');
            card.className = `dayun-card ${isShengongActive ? 'selected-shengong' : ''}`; 
            card.onclick = () => {
                isShengongActive = !isShengongActive;
                renderShengongBar();
                renderGrid();
            };

            const header = document.createElement('div');
            header.className = 'dayun-year';
            header.innerText = '身宮';

            const stemSquare = document.createElement('div');
            stemSquare.className = 'dayun-square'; 
            stemSquare.style.color = getElementColor(ty.stem);
            stemSquare.style.backgroundColor = getBgColor(ty.stem);
            stemSquare.innerText = ty.stem;

            const branchSquare = document.createElement('div');
            branchSquare.className = 'dayun-square';
            branchSquare.style.color = getElementColor(ty.branch);
            branchSquare.style.backgroundColor = getBgColor(ty.branch);
            branchSquare.innerText = ty.branch;

            card.appendChild(header);
            card.appendChild(stemSquare);
            card.appendChild(branchSquare);
            bar.appendChild(card);
        }
        // 

        function calculateMinggong() {  
            if (!currentBaziData) return null;

            const bazi = currentBaziData.bazi || [
                currentBaziData.A, currentBaziData.B, // Year Stem, Branch 
                currentBaziData.C, currentBaziData.D, // Month Stem, Branch
                currentBaziData.E, currentBaziData.F, // Day Stem, Branch
                currentBaziData.G, currentBaziData.H  // Hour Stem, Branch
            ];

            const yearStem = bazi[0];
            const monthBranch = bazi[3];
            const hourBranch = bazi[7];

            // If time is disabled or hourBranch is missing, return null
            if (!yearStem || !monthBranch || !hourBranch) {
                return null;
            }

            const monthIdx = deizi_order.indexOf(monthBranch);
            const hourIdx = deizi_order.indexOf(hourBranch);

            if (monthIdx === -1 || hourIdx === -1) return null;

            // Formula: (5 - monthIdx - hourIdx + 24) % 12
            const branchIdx = (5 - monthIdx - hourIdx + 24) % 12;
            const Y = deizi_order[branchIdx];
            const X = 五虎遁歌訣[yearStem] ? 五虎遁歌訣[yearStem][Y] : null;

            if (!X || !Y) return null;

            return { stem: X, branch: Y };
        }

        function isDarkMode() {
            return document.body.getAttribute('data-theme') === 'dark';
        }

        function getOrdinalDay(day) {
            let s = ["th", "st", "nd", "rd"];
            let v = day % 100;
            return day + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        let currentBaziData = null; 
        let isTimeDisabled = false; 
        
        // State tracker for collapsible relationship containers (true = collapsed initially)
        let relContainerStates = {
            'stemRelContainer': true,
            'invisibleStemRelContainer': true,
            'invisibleBranchRelContainer': true,
            'relContainer': true
        };

        function calculateLifeStage(branchChar, stemChar) {
            const stemEl = getElement(stemChar);
            if (!stemEl) return "";
            const branchIdx = deizi_order.indexOf(branchChar);
            if (branchIdx === -1) return "";
            return tenkan_deizi_rel[stemEl][branchIdx] || "";
        }

        // --- INVISIBLE HEAVENLY STEM RELATIONSHIPS (盲派 暗天干) ---
        function findInvisibleStemRelationships(stems) {  
            const results = [];
            const N = stems.length;
            const seen = new Set();

            const stemHeYinMap = {
                "甲_己": "己", "己_甲": "己",
                "乙_庚": "辛", "庚_乙": "辛",
                "丙_辛": "癸", "辛_丙": "癸",
                "丁_壬": "乙", "壬_丁": "乙",
                "戊_癸": "丁", "癸_戊": "丁"
            };

            const stemChongMap = {
                "甲": "庚", "乙": "辛", "丙": "壬", "丁": "癸", "戊": "甲",
                "己": "乙", "庚": "丙", "辛": "丁", "壬": "戊", "癸": "己"
            };

            // Dynamically build a map for 合 partners from tenkan_relationships["合"]
            const stemHePartnerMap = {};
            if (typeof tenkan_relationships !== "undefined" && tenkan_relationships["合"]) {
                for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                    stemHePartnerMap[pair[0]] = pair[1];
                    stemHePartnerMap[pair[1]] = pair[0];
                }
            }

            // 1. Check adjacent/neighboring stems (distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const s1 = stems[i];
                const s2 = stems[j];
                const idx1 = tenkan_order.indexOf(s1);
                const idx2 = tenkan_order.indexOf(s2);

                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 10) % 10 === 1 || (idx1 - idx2 + 10) % 10 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenStem: null
                            });
                        }
                    }
                }
            }

            // 2. Check pairs of stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const s1 = stems[i];
                    const s2 = stems[j];

                    // Rule: Two identical Heavenly Stems spawn their 合 partner
                    if (s1 === s2 && stemHePartnerMap[s1]) {
                        const partnerStem = stemHePartnerMap[s1];
                        const key = `two_same_${i}_${j}_${partnerStem}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'two_same',
                                indices: [i, j],
                                hiddenStem: partnerStem
                            });
                        }
                    }

                    const idx1 = tenkan_order.indexOf(s1);
                    const idx2 = tenkan_order.indexOf(s2);

                    if (idx1 !== -1 && idx2 !== -1) {
                        // Missing stem in sequence (distance 2)
                        let missingStem = null;
                        if ((idx2 - idx1 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx1 + 1) % 10];
                        } else if ((idx1 - idx2 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx2 + 1) % 10];
                        }

                        if (missingStem) {
                            const key = `missing_${i}_${j}_${missingStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'missing_one',
                                    indices: [i, j],
                                    hiddenStem: missingStem
                                });
                            }
                        }

                        // He-Yin (合化引出) stems
                        const comboKey = `${s1}_${s2}`;
                        if (stemHeYinMap[comboKey]) {
                            const yinStem = stemHeYinMap[comboKey];
                            const key = `he_yin_${i}_${j}_${yinStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'he_yin',
                                    indices: [i, j],
                                    hiddenStem: yinStem
                                });
                            }
                        }
                    }
                }
            }

            // 3. Check three identical stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        const s3 = stems[k];

                        if (s1 === s2 && s2 === s3 && stemChongMap[s1]) {
                            const qishaStem = stemChongMap[s1];
                            const key = `three_same_${i}_${j}_${k}_${qishaStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'three_same',
                                    indices: [i, j, k],
                                    hiddenStem: qishaStem
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

        function renderInvisibleStemRelationships(stems, headers) {
            const container = document.getElementById('invisibleStemRelContainer');
            if (!container) return; 

            let rels = findInvisibleStemRelationships(stems);

            // Filter out any invisible stem relationship involving 命宮
            if (headers) {
                rels = rels.filter(rel => !rel.indices.some(idx => headers[idx] === "命宮" || headers[idx] === "胎元" || headers[idx] === "胎息" || headers[idx] === "身宮"));
            }

            if (isSplitMode && headers) {
                const groupA = ["命宮", "胎元", "胎息", "身宮", "時", "日", "月", "年", "元運"];
                const groupB = ["大運", "流年", "流月", "流日", "流時"]; 
                rels = rels.filter(rel => {
                    const hasA = rel.indices.some(idx => groupA.includes(headers[idx]));
                    const hasB = rel.indices.some(idx => groupB.includes(headers[idx]));
                    return !(hasA && hasB);
                });
            }

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'block';

            const N = stems.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 45;
            const totalHeight = rels.length * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            // --- NEW SEPARATOR LOGIC ---
            if (isSplitMode && headers) {
                let targetIdx = headers.indexOf("元運");
                if (targetIdx === -1) {
                    targetIdx = headers.indexOf("年");
                }
                if (targetIdx !== -1 && targetIdx < N - 1) { 
                    // 49 is exactly half the distance between elements (98 / 2)
                    const splitX = xCoords[targetIdx] + 49; 
                    const lineColor = isDarkMode() ? "#666" : "#aaa";
                    svgHtml += `<line x1="${splitX}" y1="0" x2="${splitX}" y2="${totalHeight}" stroke="${lineColor}" stroke-width="1.5" stroke-dasharray="4,4" />`;
                }
            }
            // ---------------------------

            rels.forEach((rel, k) => {
                const yTop = k * layerHeight + 6;
                const yBar = yTop + 14;
                const yBottom = yTop + 38;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const minX = xCoords[sortedIndices[0]];
                const maxX = xCoords[sortedIndices[sortedIndices.length - 1]];
                const midX = (minX + maxX) / 2;

                const leftStem = stems[sortedIndices[0]];
                const rightStem = stems[sortedIndices[sortedIndices.length - 1]];

                const cLeft = getRelColor(getElementColor(leftStem));
                const cRight = getRelColor(getElementColor(rightStem));

                const gradId = `invStemGrad_${k}`;

                svgHtml += `
                    <defs>
                        <linearGradient id="${gradId}" x1="${minX}" y1="0" x2="${maxX}" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cRight}" />
                            <stop offset="100%" stop-color="${cRight}" />
                        </linearGradient>
                    </defs>
                `;

                const strokeColor = `url(#${gradId})`;
                const hasHiddenStem = Boolean(rel.hiddenStem && rel.type !== 'neighbor' && rel.type !== 'bond');

                const strokeWidth = hasHiddenStem ? 2 : 3.5;
                const dotRadius = hasHiddenStem ? 3 : 5;

                if (!hasHiddenStem) {
                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;

                    sortedIndices.forEach(idx => {
                        const x = xCoords[idx];
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
                    });
                } else {
                    const boxSize = 26;
                    const boxX = midX - boxSize / 2;
                    const boxY = yBar - boxSize / 2;

        // --- INVISIBLE EARTHLY BRANCH RELATIONSHIPS (盲派 暗拱/暗夾) ---
        function findInvisibleBranchRelationships(branches) {
            const results = [];
            const N = branches.length;
            const seen = new Set();

            const sanHeGong = {
                "子": ["申", "辰"],
                "酉": ["巳", "丑"],
                "午": ["寅", "戌"],
                "卯": ["亥", "未"]
            };

            const sixRelPairs = [
                ["子", "丑"], ["寅", "亥"], ["卯", "戌"],
                ["酉", "辰"], ["巳", "申"], ["午", "未"]
            ];
            function getSixRelPartner(b) {
                for (const pair of sixRelPairs) {
                    if (pair[0] === b) return pair[1];
                    if (pair[1] === b) return pair[0];
                }
                return null;
            }

            const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    for (const [targetHidden, pair] of Object.entries(sanHeGong)) {
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }

                    if (b1 === b2) {
                        const partner = getSixRelPartner(b1);
                        if (partner) {
                            const key = `${i}_${j}_${partner}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: partner,
                                    color: getElementColor(partner)
                                });
                            }
                        }
                    }

                    const idx1 = zhiOrder.indexOf(b1);
                    const idx2 = zhiOrder.indexOf(b2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        if ((idx2 - idx1 + 12) % 12 === 2) {
                            const hiddenIdx = (idx1 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        } else if ((idx1 - idx2 + 12) % 12 === 2) {
                            const hiddenIdx = (idx2 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

        function renderInvisibleBranchRelationships(branches, headers) {
            const container = document.getElementById('invisibleBranchRelContainer');
            if (!container) return;

            let rels = findInvisibleBranchRelationships(branches);

            // Filter out any invisible branch relationship involving 命宮
            if (headers) {
                rels = rels.filter(rel => !rel.indices.some(idx => headers[idx] === "命宮" || headers[idx] === "胎元" || headers[idx] === "胎息" || headers[idx] === "身宮"));
            }

            if (isSplitMode && headers) {
                const groupA = ["命宮", "胎元", "胎息", "身宮", "時", "日", "月", "年", "元運"];
                const groupB = ["大運", "流年", "流月", "流日", "流時"];
                rels = rels.filter(rel => {
                    const hasA = rel.indices.some(idx => groupA.includes(headers[idx]));
                    const hasB = rel.indices.some(idx => groupB.includes(headers[idx]));
                    return !(hasA && hasB);
                });
            }

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            } 

            container.style.display = 'block';

            const N = branches.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 45;
            const totalHeight = rels.length * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            // --- NEW SEPARATOR LOGIC ---
            if (isSplitMode && headers) {
                let targetIdx = headers.indexOf("元運");
                if (targetIdx === -1) {
                    targetIdx = headers.indexOf("年");
                }
                if (targetIdx !== -1 && targetIdx < N - 1) {

            rels.forEach((rel, k) => {
                const yTop = k * layerHeight + 6;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);

                const midX = (minX + maxX) / 2;

                let strokeColor = getRelColor(rel.color);
                const boxSize = 26;
                const boxX = midX - boxSize / 2;
                const boxY = yBar - boxSize / 2;

                svgHtml += `<circle cx="${minX}" cy="${yTop + 2}" r="3" fill="${strokeColor}" />`;
                svgHtml += `<circle cx="${maxX}" cy="${yTop + 2}" r="3" fill="${strokeColor}" />`;

                svgHtml += `<line x1="${minX}" y1="${yTop + 2}" x2="${minX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="2" />`;
                svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${boxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="2" />`;
                svgHtml += `<line x1="${boxX + boxSize}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="2" />`;
                svgHtml += `<line x1="${maxX}" y1="${yBar}" x2="${maxX}" y2="${yTop + 2}" stroke="${strokeColor}" stroke-width="2" />`;

                svgHtml += `<rect x="${boxX}" y="${boxY}" width="${boxSize}" height="${boxSize}" rx="4" ry="4" fill="var(--card-bg)" stroke="${strokeColor}" stroke-width="2" />`;

                svgHtml += `<text class="spawned-branch" x="${midX}" y="${yBar + 6}" font-size="16" font-weight="700" text-anchor="middle" fill="${strokeColor}" onclick="event.stopPropagation(); triggerDizhiArrows(this, '${rel.hiddenBranch}'); drawXingArrows(this, '${rel.hiddenBranch}');">${rel.hiddenBranch}</text>`;

        // BaZi Earthly Branch Six Clashes (地支六沖)
        const chongDict = {

            '寅': '申', '申': '寅',

        function createArrow(fromElem, toElem, color, markerId, isBiDirectional = false) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return false;

            // Prevent any arrow from pointing to or originating from "合"
            if ((fromElem && fromElem.textContent.trim() === '合') || (toElem && toElem.textContent.trim() === '合')) {
                return false;
            }

            const startRect = fromElem.getBoundingClientRect();
            const endRect = toElem.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0 || endRect.width === 0 || endRect.height === 0) return false;

            const startX = startRect.left + (startRect.width / 2);
            const startY = startRect.top + (startRect.height / 2);
            const endX = endRect.left + (endRect.width / 2);
            const endY = endRect.top + (endRect.height / 2);

            const isMainBranch = fromElem.classList.contains('main-pillar-branch') || fromElem.classList.contains('main-pillar-stem');
            const startOffsetRadius = isMainBranch ? 35 : 12;
            const endOffsetRadius = toElem.classList.contains('main-pillar-branch') || toElem.classList.contains('main-pillar-stem') ? 35 : 12;

            const dx = endX - startX;
            const dy = endY - startY;
            const distance = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            if (distance <= (startOffsetRadius + endOffsetRadius)) return false;

            const adjustedStartX = startX + Math.cos(angle) * startOffsetRadius;
            const adjustedStartY = startY + Math.sin(angle) * startOffsetRadius;
            const adjustedEndX = endX - Math.cos(angle) * endOffsetRadius;
            const adjustedEndY = endY - Math.sin(angle) * endOffsetRadius;

            const adjustedDistance = Math.hypot(adjustedEndX - adjustedStartX, adjustedEndY - adjustedStartY);

            // 1. Wrap in a <g> container
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", adjustedStartX);
            line.setAttribute("y1", adjustedStartY);
            line.setAttribute("x2", adjustedEndX);
            line.setAttribute("y2", adjustedEndY);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "2.5");
            
            line.style.strokeDasharray = adjustedDistance;
            line.style.strokeDashoffset = adjustedDistance;

            group.appendChild(line);
            canvas.appendChild(group);

            // 2. Animate line drawing
            const drawAnim = line.animate([
                { strokeDashoffset: adjustedDistance },
                { strokeDashoffset: 0 }
            ], { duration: 600, easing: 'ease-out', fill: 'forwards' });

            // 3. Dynamically attach arrowhead once draw finishes
            drawAnim.onfinish = () => {
                line.setAttribute("marker-end", `url(#${markerId})`);
                if (isBiDirectional) {
                    line.setAttribute("marker-start", `url(#${markerId})`);
                }
            };

            // 4. Animate opacity on the GROUP (<g>) so line and marker fade out together
            group.animate([
                { opacity: 1 },
                { opacity: 0 }
            ], { duration: 500, delay: 1500, easing: 'ease-out', fill: 'forwards' });

            // 5. Remove the entire group node from DOM
            setTimeout(() => group.remove(), 2100);
            return true;
        } 

        function drawXingArrows(sourceElement, char) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            // 1. Find elements that the clicked character punishes (Outgoing)
            const targets = xingMap[char] || [];
            
            // 2. Find elements that punish the clicked character (Incoming)
            const sources = Object.keys(xingMap).filter(key => xingMap[key].includes(char));

            // Exit if the character doesn't trigger any 刑 relationship
            if (targets.length === 0 && sources.length === 0) { 
                return;
            }

            // Target elements in the Bazi grid and toggled SVG sections
            const querySelectors = '.bazi-square, .bazi-rect, .stem-char, text.spawned-branch, text.spawned-stem, .main-pillar-branch, .time-pillar-branch';
            const allNodes = document.querySelectorAll(querySelectors);
            
            let arrowsDrawnCount = 0;

            allNodes.forEach(node => {
                // Prevent drawing an arrow to the exact same element clicked
                if (node === sourceElement) return; 
                
                const textContent = (node.textContent || node.innerText).trim();
                
                // Outgoing Relationship: Draw arrow from clicked element to node
                if (targets.some(t => textContent.includes(t))) {
                    if (createArrow(sourceElement, node, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }

                // Incoming Relationship: Draw arrow from node to clicked element
                if (sources.some(s => textContent.includes(s))) {
                    if (createArrow(node, sourceElement, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }
            });
        } // ok 

        function triggerDizhiArrows(clickedElement, sourceChar) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            const targetChongChar = chongDict[sourceChar];
            
            // Select all Earthly Branch elements (main pillars + spawned/time pillars)
            const possibleTargets = document.querySelectorAll('.main-pillar-branch, #invisibleBranchRelContainer text.spawned-branch, .time-pillar-branch');
            let arrowsDrawnCount = 0;

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();

                // 沖 (Clash): Draw a bidirectional orange arrow between source and target
                if (targetChongChar && targetText === targetChongChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-chong", true)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // Draw X animation if no clash partner exists on screen
            if (arrowsDrawnCount === 0) {
                drawXAnimation(clickedElement);
            }
        }

        function triggerArrows(clickedElement, sourceChar) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            // Do nothing if the clicked element itself is "合"
            if (clickedElement && clickedElement.textContent.trim() === '合') {
                return;
            }

            const targetPianCaiChar = pianCaiDict[sourceChar];
            const sourceQiShaChar = qiShaDict[sourceChar];

            const possibleTargets = document.querySelectorAll('.main-pillar-stem, #invisibleStemRelContainer text.spawned-stem');
            let arrowsDrawnCount = 0;

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();

                // Skip any target displaying "合"
                if (targetText === '合') return;

                // 1. 偏財: Clicked stem -> 偏財 stem (Orange arrow)
                if (targetPianCaiChar && targetText === targetPianCaiChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-piancai")) {
                        arrowsDrawnCount++;
                    }
                }

                // 2. 七殺: 七殺 stem -> Clicked stem (Greenish-Yellow arrow)
                if (sourceQiShaChar && targetText === sourceQiShaChar) {
                    if (createArrow(target, clickedElement, "#adff2f", "arrowhead-qisha")) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // 3. If neither 偏財 nor 七殺 is present on screen, show X animation
            if (arrowsDrawnCount === 0) {
                drawXAnimation(clickedElement);
            }
        }

                    html += `<div class="bazi-rect bazi-rect-hidden" id="rect_h_r${row}_c${idx}" style="${extraStyle}"${clickAttr}></div>`;
                });
            }

            baziGrid.innerHTML = html;

            hiddenStemsData.forEach((item, idx) => {
                const el1 = document.getElementById(`rect_h_r1_c${idx}`);
                const el2 = document.getElementById(`rect_h_r2_c${idx}`);
                const hStems = deizi_hidden_tenkan[item.branch] || [];  

                if (hStems.length === 0) {
                    if (el1) el1.style.visibility = "hidden";
                    if (el2) el2.style.visibility = "hidden";
                } else {
                    if (el1) {
                        el1.innerHTML = formatHiddenStemLine(hStems[0], item.dm);
                        el1.style.visibility = "visible";
                    }
                    if (el2) {
                        if (hStems.length === 1) {
                            el2.style.visibility = "hidden";
                        } else if (hStems.length === 2) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm);
                            el2.style.visibility = "visible";
                        } else if (hStems.length >= 3) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm) + formatHiddenStemLine(hStems[2], item.dm);
                            el2.style.visibility = "visible";
                        }
                    }
                }
            });

            renderStemRelationships(stems);
            renderInvisibleStemRelationships(stems, headers);
            renderInvisibleBranchRelationships(branches, headers); 
            renderRelationships(branches);

            document.querySelectorAll('.main-pillar-branch, .time-pillar-branch, text.spawned-branch').forEach(branchElem => {
                branchElem.onclick = function(event) {
                    event.stopPropagation();
                    const branchChar = this.textContent.trim();
                    triggerDizhiArrows(this, branchChar);
                    drawXingArrows(this, branchChar); 
                };
            }); 
        } 

        document.addEventListener("DOMContentLoaded", () => {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const hourSelect = document.getElementById('hourSelect');
            const sexSelect = document.getElementById('sexSelect');
            const splitBtn = document.getElementById('splitBtn'); 

            disableTimeBtn.addEventListener('click', () => {
                isTimeDisabled = !isTimeDisabled;
                disableTimeBtn.textContent = isTimeDisabled ? 'Enable Time' : 'Disable Time';
                
                // Optional: Add a visual highlight to the button when time is disabled
                if (isTimeDisabled) {
                    disableTimeBtn.style.backgroundColor = 'var(--card-hover)';
                    disableTimeBtn.style.borderColor = 'gray'; 
                } else {
                    disableTimeBtn.style.backgroundColor = '';
                    disableTimeBtn.style.borderColor = '';
                }
                
                renderGrid();
            });

            // Bind all input selectors to trigger grid & 命宮 recalculation
            ['yearSelect', 'monthSelect', 'daySelect', 'hourSelect', 'sexSelect'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => {
                        // Update currentBaziData here via paipan calculation logic
                        renderGrid();
                    });
                }
            });

            // Bind 命宮 Toggle Button
            const minggongBtn = document.getElementById('minggongBtn');
            if (minggongBtn) {
                minggongBtn.addEventListener('click', () => {
                    minggongBarVisible = !minggongBarVisible;
                    renderMinggongBar();
                    renderGrid();
                });
            }

            const taiyuanBtn = document.getElementById('taiyuanBtn');
            if (taiyuanBtn) {
                taiyuanBtn.addEventListener('click', () => {
                    taiyuanBarVisible = !taiyuanBarVisible;
                    renderTaiyuanBar();
                    renderGrid();
                }); 
            } 

            const taixiBtn = document.getElementById('taixiBtn');
            if (taixiBtn) {
                taixiBtn.addEventListener('click', () => {
                    taixiBarVisible = !taixiBarVisible;
                    renderTaixiBar();
                    renderGrid();
                });  
            } 

            const shengongBtn = document.getElementById('shengongBtn'); 
            if (shengongBtn) {
                shengongBtn.addEventListener('click', () => {
                    shengongBarVisible = !shengongBarVisible;
                    renderShengongBar();
                    renderGrid();
                }); 
            }

            document.getElementById('hehuaBtn').addEventListener('click', function() {
                isHeHuaEnabled = !isHeHuaEnabled;
                this.innerText = isHeHuaEnabled ? "Disable 合化" : "Enable 合化";
                renderGrid(); 
            });

            const yuanyunBtn = document.getElementById('yuanyunBtn');
            const dayunBtn = document.getElementById('dayunBtn');
            const liunianBtn = document.getElementById('liunianBtn');
            const liuyueBtn = document.getElementById('liuyueBtn');
            const liuriBtn = document.getElementById('liuriBtn');
            const liushiBtn = document.getElementById('liushiBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const nowBtn = document.getElementById('nowBtn');
            const errorResult = document.getElementById('errorResult');

            function setTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.textContent = '🌙';
                } else {
                    themeToggleBtn.textContent = '☀️';
                }
                localStorage.setItem('theme', theme);
                renderYuanyunBar();
                renderDayunBar();
                renderLiunianBar();
                renderLiuyueBar();
                renderLiuriBar();
                renderLiushiBar();
                renderGrid();
            }

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
            });

            splitBtn.addEventListener('click', () => {
                isSplitMode = !isSplitMode;
                splitBtn.textContent = isSplitMode ? 'Combine' : 'Split';
                renderGrid();
            });

            nowBtn.addEventListener('click', selectNow);

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentDate = now.getDate();
            const currentHour = now.getHours();

            const savedTheme = localStorage.getItem('theme');
            if (currentHour >= 23) {
                setTheme('dark');
            } else if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme('light');
            }

            for (let y = 1600; y <= 2100; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            } 

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            for (let h = 0; h < 24; h++) {
                let opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h < 10 ? '0' + h : h;
                if (h === currentHour) opt.selected = true;
                hourSelect.appendChild(opt);
            }

            sexSelect.value = "0";

            function calculate() {
                try {
                    errorResult.textContent = "";
                    selectedYuanyun = null;
                    selectedDayun = null;   
                    selectedLiunian = null; 
                    selectedLiuyue = null;  
                    selectedLiuri = null;   
                    selectedLiushi = null;  
                    yuanyunBarVisible = false;
                    liunianBarVisible = false;
                    liuyueBarVisible = false;
                    liuriBarVisible = false;
                    liushiBarVisible = false;
                    liunianBtn.style.display = 'none';
                    liuyueBtn.style.display = 'none';
                    liuriBtn.style.display = 'none';
                    liushiBtn.style.display = 'none';

                    var p = new paipan();
                    p.zwz = false;
                    
                    const yr = parseInt(yearSelect.value, 10);
                    const mth = parseInt(monthSelect.value, 10);
                    const dy = parseInt(daySelect.value, 10);
                    const hr = parseInt(hourSelect.value, 10);
                    var sex = parseInt(sexSelect.value, 10); 

                    var ans = p.GetInfo(sex, yr, mth, dy, hr, 0, 0); 
                    console.log(ans); 
                    
                    if (ans && ans.bazi && ans.bazi.length >= 8) {
                        const bigList = [];
                        if (ans.big) {
                            const times = ans.big_start_time || [];
                            for (let i = 0; i < ans.big.length; i += 2) {
                                const idx = i / 2;
                                const stem = ans.big[i];
                                const branch = ans.big[i + 1];
                                let year = "";
                                if (times[idx] && times[idx].length > 0) {
                                    year = times[idx][0];
                                }
                                bigList.push({ stem, branch, year });
                            }
                        }

                        currentBaziData = {
                            A: ans.bazi[0],
                            B: ans.bazi[1],
                            C: ans.bazi[2],
                            D: ans.bazi[3],
                            E: ans.bazi[4],
                            F: ans.bazi[5],
                            G: ans.bazi[6],
                            H: ans.bazi[7],
                            bigList: bigList,
                            big_start_time: ans.big_start_time
                        };

                        renderYuanyunBar();
                        renderDayunBar();
                        renderLiunianBar();
                        renderLiuyueBar();
                        renderLiuriBar();
                        renderLiushiBar();
                        renderGrid();
                    }
                } catch (e) {
                    console.error(e);
                    errorResult.textContent = "Error: " + e.message;
                }
            }

            function updateDays(targetDay) {
                const year = parseInt(yearSelect.value, 10);
                const month = parseInt(monthSelect.value, 10);
                const daysInMonth = new Date(year, month, 0).getDate();

                const currentDay = targetDay || parseInt(daySelect.value, 10) || currentDate;

                daySelect.innerHTML = '';
                for (let d = 1; d <= daysInMonth; d++) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    if (d === currentDay || (d === daysInMonth && currentDay > daysInMonth)) {
                        opt.selected = true;
                    }
                    daySelect.appendChild(opt);
                }
            }

            yearSelect.addEventListener('change', () => { updateDays(); calculate(); });
            monthSelect.addEventListener('change', () => { updateDays(); calculate(); });
            daySelect.addEventListener('change', calculate);
            hourSelect.addEventListener('change', calculate);
            sexSelect.addEventListener('change', calculate);

            yuanyunBtn.addEventListener('click', () => {
                yuanyunBarVisible = !yuanyunBarVisible;
                renderYuanyunBar(); 
            });

            dayunBtn.addEventListener('click', () => {
                dayunBarVisible = !dayunBarVisible;
                renderDayunBar();
            });

            liunianBtn.addEventListener('click', () => {
                liunianBarVisible = !liunianBarVisible;
                renderLiunianBar();
            });

            liuyueBtn.addEventListener('click', () => {
                liuyueBarVisible = !liuyueBarVisible;
                renderLiuyueBar();
            });

            liuriBtn.addEventListener('click', () => {
                liuriBarVisible = !liuriBarVisible;
                renderLiuriBar();
            });

            liushiBtn.addEventListener('click', () => {
                liushiBarVisible = !liushiBarVisible;
                renderLiushiBar();
            }); 

            updateDays(currentDate);
            calculate();
        }); 
    </script>
</body>
</html>
