    <script>
        /**
         * Step values with cascading calendar carries and borrows
         * @param {string} field - 'year' | 'month' | 'day' | 'hour' | 'sex'
         * @param {number} dir - (-1 for earlier, +1 for next)
         */
        function stepValue(field, dir) {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const hourSelect = document.getElementById('hourSelect');
            const sexSelect = document.getElementById('sexSelect');

            if (field === 'sex') {
                sexSelect.value = sexSelect.value === "0" ? "1" : "0";
                // Trigger change to recalculate
                sexSelect.dispatchEvent(new Event('change'));
                return;
            }

            let yr = parseInt(yearSelect.value, 10);
            let mth = parseInt(monthSelect.value, 10);
            let dy = parseInt(daySelect.value, 10);
            let hr = parseInt(hourSelect.value, 10);

            const getDaysInMonth = (y, m) => new Date(y, m, 0).getDate();

            // 1. Step Hour (-1: earlier, +1: next)
            if (field === 'hour') {
                hr += dir;
                if (hr < 0) {
                    hr = 23;
                    dy -= 1; // Borrow from day
                } else if (hr > 23) {
                    hr = 0;
                    dy += 1; // Carry to day
                }
            }

            // 2. Step Day (or cascade from hour)
            if (field === 'day' || field === 'hour') {
                if (field === 'day') dy += dir;

                // Handle Day Underflow (moving into previous months/years)
                while (dy < 1) {
                    mth -= 1;
                    if (mth < 1) {
                        mth = 12;
                        yr -= 1;
                    }
                    dy += getDaysInMonth(yr, mth);
                }

                // Handle Day Overflow (moving into next months/years)
                while (dy > getDaysInMonth(yr, mth)) {
                    dy -= getDaysInMonth(yr, mth);
                    mth += 1;
                    if (mth > 12) {
                        mth = 1;
                        yr += 1;
                    }
                }
            }

            // 3. Step Month
            if (field === 'month') {
                mth += dir;
                if (mth < 1) {
                    mth = 12;
                    yr -= 1;
                } else if (mth > 12) {
                    mth = 1;
                    yr += 1;
                }
                // Clamp day to valid days in the new month
                const maxD = getDaysInMonth(yr, mth);
                if (dy > maxD) dy = maxD;
            }

            // 4. Step Year
            if (field === 'year') {
                yr += dir;
                // Handle leap year adjustment (e.g. Feb 29 -> Feb 28)
                const maxD = getDaysInMonth(yr, mth);
                if (dy > maxD) dy = maxD;
            }

            // Keep year within the allowed range (1600 - 2100)
            yr = Math.max(1600, Math.min(2100, yr));

            // Apply values to UI
            yearSelect.value = yr;
            monthSelect.value = mth;
            
            // Re-populate and select proper day count 
            if (typeof updateDays === 'function') {
                updateDays(dy);
            }
            daySelect.value = dy;
            hourSelect.value = hr;

            // Recalculate BaZi
            daySelect.dispatchEvent(new Event('change'));
        }

        /**
         * Headlessly calculates and logs 24 Solar Terms and Moon Phases to Console
         * @param {number} targetYear 
         */ 
        function logSunAndMoonToConsole(targetYear) {
            if (typeof submitYear !== 'function') {
                console.warn("sunMoon_c.js is not loaded yet.");
                return;
            }

            const hiddenYearInput = document.getElementById('year');
            const yContent = document.getElementById('ycontent');
            if (!hiddenYearInput || !yContent) return;

            // 1. Set the year and trigger the astronomical calculator
            hiddenYearInput.value = targetYear;
            try {
                submitYear(2); // 2 = Simplified Chinese
            } catch (e) {
                console.error("Astronomical calculation error:", e);
                return;
            }

            // 2. Parse the generated tables from memory
            const tables = yContent.querySelectorAll('table');
            if (tables.length < 2) return;

            // --- Table 1: 月相 (Moon Phases) ---
            const moonPhases = [];
            const moonRows = tables[0].querySelectorAll('tr');
            const moonHeaders = ['朔 (新月)', '上弦', '望 (满月)', '下弦'];

            for (let i = 1; i < moonRows.length; i++) {
                const cells = moonRows[i].children;
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    // Skip empty/colspan placeholder cells
                    if (cell.hasAttribute('colspan')) continue;

                    const text = cell.innerText.trim();
                    if (text) {
                        const parts = text.split('\n');
                        moonPhases.push({
                            '月相': moonHeaders[c] || '月相',
                            '公历时刻': parts[0].replace(/,/g, ''),
                            '交食备注': parts[1] || '无'
                        });
                    }
                }
            }

            // --- Table 2: 二十四节气 (24 Solar Terms) ---
            const solarTerms = [];
            const solarRows = tables[1].querySelectorAll('tr');

            for (let i = 1; i < solarRows.length; i++) {
                const tds = solarRows[i].querySelectorAll('td');
                // Left Column: tds[0] = Name, tds[1] = Time
                if (tds[0] && tds[1] && tds[0].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[0].innerText.trim(),
                        '时刻 (UTC+8)': tds[1].innerText.trim()
                    });
                }
                // Right Column: tds[3] = Name, tds[4] = Time
                if (tds[3] && tds[4] && tds[3].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[3].innerText.trim(),
                        '时刻 (UTC+8)': tds[4].innerText.trim()
                    });
                }
            }

            // 3. Print out to DevTools Console
            console.group(`🌟 公元 ${targetYear} 年 月相与二十四节气时刻表`);
            
            console.log(`%c【二十四节气】 (${targetYear})`, "color: #2b8a3e; font-weight: bold; font-size: 13px;");
            console.table(solarTerms);

            console.log(`%c【月相与日月食】 (${targetYear})`, "color: #1971c2; font-weight: bold; font-size: 13px;");
            console.table(moonPhases);

            console.groupEnd();
        }

        let isRenyuanActive = false;
        // 全局存儲與 Console 輸出 100% 同步的 26 個節氣完整列表
        let verifiedSolarTermsList = [];   

        /**
         * 規範化節氣名稱（兼容繁簡體）
         */
        function normalizeJieqiName(name) {
            if (!name) return "";
            return name.trim()
                .replace('穀雨', '谷雨')
                .replace('小滿', '小满')
                .replace('芒種', '芒种')
                .replace('處暑', '处暑')
                .replace('驚蟄', '惊蛰');
        }

        /**
         * Headlessly calculates and logs 24 Solar Terms and Moon Phases to Console
         * 同時直接構建 人元司令 專用的節氣精準日程表
         */
        function logSunAndMoonToConsole(targetYear) {
            if (typeof submitYear !== 'function') {
                console.warn("sunMoon_c.js is not loaded yet.");
                return;
            }

            const hiddenYearInput = document.getElementById('year');
            const yContent = document.getElementById('ycontent');
            if (!hiddenYearInput || !yContent) return;

            hiddenYearInput.value = targetYear;
            try {
                submitYear(2); // 2 = Simplified Chinese
            } catch (e) {
                console.error("Astronomical calculation error:", e);
                return;
            }

            const tables = yContent.querySelectorAll('table');
            if (tables.length < 2) return;

            // --- Table 1: 月相 (Moon Phases) ---
            const moonPhases = [];
            const moonRows = tables[0].querySelectorAll('tr');
            const moonHeaders = ['朔 (新月)', '上弦', '望 (满月)', '下弦'];

            for (let i = 1; i < moonRows.length; i++) {
                const cells = moonRows[i].children;
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    if (cell.hasAttribute('colspan')) continue;
                    const text = cell.innerText.trim();
                    if (text) {
                        const parts = text.split('\n');
                        moonPhases.push({
                            '月相': moonHeaders[c] || '月相',
                            '公历时刻': parts[0].replace(/,/g, ''),
                            '交食备注': parts[1] || '无'
                        });
                    }
                }
            }

            // --- Table 2: 二十四节气 (24 Solar Terms) ---
            const solarTerms = [];
            const solarRows = tables[1].querySelectorAll('tr');

            for (let i = 1; i < solarRows.length; i++) {
                const tds = solarRows[i].querySelectorAll('td');
                if (tds[0] && tds[1] && tds[0].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[0].innerText.trim(),
                        '时刻 (UTC+8)': tds[1].innerText.trim()
                    });
                }
                if (tds[3] && tds[4] && tds[3].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[3].innerText.trim(),
                        '时刻 (UTC+8)': tds[4].innerText.trim()
                    });
                }
            }

            // 核心修正：直接將 Console 表精準轉換為時間戳列表 (共 26 個，0 到 25)
            verifiedSolarTermsList = [];
            for (let k = 0; k < solarTerms.length; k++) {
                const rawName = solarTerms[k]['节气'];
                const timeStr = solarTerms[k]['时刻 (UTC+8)'];
                const name = normalizeJieqiName(rawName);

                const match = timeStr.match(/(?:\((\d{4})\)\s*)?(\d{1,2})月(\d{1,2})日/);
                if (!match) continue;

                let y = match[1] ? parseInt(match[1], 10) : targetYear;
                // 若字串沒有括號年份：第 0 項必定為前一年冬至，第 25 項必定為次年小寒
                if (!match[1]) {
                    if (k === 0 && match[2] === '12') y = targetYear - 1;
                    else if (k >= 24 && match[2] === '1') y = targetYear + 1;
                }

                const m = parseInt(match[2], 10);
                const d = parseInt(match[3], 10);

                verifiedSolarTermsList.push({
                    name: name,
                    year: y,
                    month: m,
                    day: d,
                    date: new Date(y, m - 1, d), // 包含完整 Date 物件
                    dayUTC: Date.UTC(y, m - 1, d) // 節氣公曆日 00:00:00 UTC 毫秒數
                });
            }

            // 按時間嚴格排序
            verifiedSolarTermsList.sort((a, b) => a.dayUTC - b.dayUTC);

            // 輸出到 DevTools 控制台
            console.group(`🌟 公元 ${targetYear} 年 月相与二十四节气时刻表`);
            console.log(`%c【二十四节气】 (${targetYear})`, "color: #2b8a3e; font-weight: bold; font-size: 13px;");
            console.table(solarTerms);
            console.log(`%c【月相与日月食】 (${targetYear})`, "color: #1971c2; font-weight: bold; font-size: 13px;");
            console.table(moonPhases);
            console.groupEnd();
        }

        /**
         * 計算當前人元司令天干 (X)、當前節氣 (YY) 以及 第幾日 (Z)
         */
        function calculateRenyuanSiling() {
            const yr = parseInt(document.getElementById('yearSelect').value, 10);
            const mth = parseInt(document.getElementById('monthSelect').value, 10);
            const dy = parseInt(document.getElementById('daySelect').value, 10);
            const hr = parseInt(document.getElementById('hourSelect').value, 10);

            // 防禦保護：若尚未初始化則立即調用構建
            if (!verifiedSolarTermsList || verifiedSolarTermsList.length === 0) {
                logSunAndMoonToConsole(yr);
            }
            if (!verifiedSolarTermsList || verifiedSolarTermsList.length === 0) return null;

            // 1. 子時換日判定：>= 23:00 換入次日
            const isNextDayZiShi = (hr >= 23);
            const effDate = new Date(yr, mth - 1, dy + (isNextDayZiShi ? 1 : 0));
            const currentDayUTC = Date.UTC(effDate.getFullYear(), effDate.getMonth(), effDate.getDate());

            // 2. 在與 Console 完全相同的 26 個節氣列表中比對當前節氣
            let activeTerm = null;
            for (let i = 0; i < verifiedSolarTermsList.length; i++) {
                if (currentDayUTC >= verifiedSolarTermsList[i].dayUTC) {
                    activeTerm = verifiedSolarTermsList[i];
                } else {
                    break; // 超過當前日期即退出
                }
            }

            if (!activeTerm) {
                activeTerm = verifiedSolarTermsList[0];
            }

            // 3. 計算第 Z 日（直接用 UTC 毫秒數相減求天數差，無時區誤差）
            const dayDiff = Math.floor((currentDayUTC - activeTerm.dayUTC) / (24 * 60 * 60 * 1000));
            
            // Z 從 1 開始遞增
            let Z = dayDiff + 1;
            if (Z < 1) Z = 1;
            if (Z > 16) Z = 16; // 第16日同第15日歌訣

            // 4. 查表獲取司令天干 X（第16日按第15日歌訣用字）
            const YY = activeTerm.name;
            const pattern = renyuanDict[YY];
            let X = "";
            if (pattern) {
                const charIdx = Math.min(Z, 15) - 1;
                X = pattern[charIdx] || "";
            }

            return { X, YY, Z };
        }

        /**
         * Highlights all matching commanding heavenly stems (人元司令) in yellow.
         * Excludes selectable cards in dayun-scroll-containers.
         */ 
        function applyRenyuanHighlight() { 
            // 1. Remove previous highlights
            document.querySelectorAll('.renyuan-highlight-square').forEach(el => el.classList.remove('renyuan-highlight-square'));
            document.querySelectorAll('.renyuan-highlight-hidden').forEach(el => el.classList.remove('renyuan-highlight-hidden'));
            document.querySelectorAll('.renyuan-svg-rect-highlight').forEach(el => {
                el.classList.remove('renyuan-svg-rect-highlight');
                if (el.dataset.origStroke) el.setAttribute('stroke', el.dataset.origStroke);
                if (el.dataset.origWidth) el.setAttribute('stroke-width', el.dataset.origWidth);
            });

            // 2. If 人元司令 is not active, stop here
            if (!isRenyuanActive) return;

            const res = calculateRenyuanSiling();
            if (!res || !res.X) return;
            const targetStem = res.X; // e.g., "丙", "己", "甲"

            // --- Dynamic Color Assignment ---
            const highlightColor = getElementColor(targetStem);
            document.documentElement.style.setProperty('--renyuan-color', highlightColor);

            // 3. Highlight Main Pillar Heavenly Stems
            document.querySelectorAll('#baziGrid .bazi-square.main-pillar-stem').forEach(square => {
                if (square.textContent.trim() === targetStem) {
                    square.classList.add('renyuan-highlight-square');
                }
            });

            // 4. Highlight Hidden Stems in the bottom rows (本氣 / 中氣 / 餘氣)
            document.querySelectorAll('#baziGrid [id^="rect_h_r"] .stem-char').forEach(span => {
                if (span.textContent.trim() === targetStem) {
                    span.classList.add('renyuan-highlight-hidden');
                }
            });

            // 5. Highlight Spawned Invisible Stems in the SVG container
            document.querySelectorAll('#invisibleStemRelContainer text.spawned-stem').forEach(textElem => {
                if (textElem.textContent.trim() === targetStem) {
                    const prevRect = textElem.previousElementSibling;
                    if (prevRect && prevRect.tagName.toLowerCase() === 'rect') {
                        if (!prevRect.dataset.origStroke) {
                            prevRect.dataset.origStroke = prevRect.getAttribute('stroke') || '';
                            prevRect.dataset.origWidth = prevRect.getAttribute('stroke-width') || '';
                        }
                        prevRect.classList.add('renyuan-svg-rect-highlight');
                        prevRect.setAttribute('stroke', highlightColor); // Changed from '#ffd700' to dynamic color
                        prevRect.setAttribute('stroke-width', '3.5');
                    }
                }
            });

            // 6. Highlight any active popup stems (if opened)
            document.querySelectorAll('.branch-hidden-popup .popup-stem').forEach(span => {
                if (span.textContent.trim() === targetStem) {
                    span.classList.add('renyuan-highlight-hidden');
                }
            });
        }

        /**
         * 刷新按鈕文字
         */
        function updateRenyuanBtn() {
            const btn = document.getElementById('renyuanBtn');
            if (!btn) return;

            if (!isRenyuanActive) {
                btn.textContent = "人元司令";
                btn.style.color = "";
                btn.style.borderColor = "";
                return;
            }

            const res = calculateRenyuanSiling();
            if (res && res.X) {
                btn.textContent = `${res.X}當令 (${res.YY}第${res.Z}日)`;
                btn.style.color = getElementColor(res.X); // 自動套用該天干的五行色彩
                btn.style.borderColor = getElementColor(res.X);
            } else {
                btn.textContent = "人元司令";
            } 
        }

        // Toggle state for 命宮
        let isMinggongActive = false; 
        let isHeHuaEnabled = false; 

        // --- ADD THESE NEW VARIABLES AND FUNCTIONS FOR 胎元 ---
        let isTaiyuanActive = false;
        let taiyuanBarVisible = false;

        // Active popups map so we can reset timers if summoned repeatedly
        const activeBranchPopups = new Map();

        // Helper: Get ONLY the first (primary / 本氣) hidden stem of a branch
        function getBranchPrimaryStem(branchChar) {
            const stems = deizi_hidden_tenkan[branchChar];
            return (stems && stems.length > 0) ? stems[0] : null;
        } 

        function spawnBranchHiddenPopup(branchElem, branchChar) { 
            const primaryStem = getBranchPrimaryStem(branchChar);
            if (!branchElem || !primaryStem) return null;  

            const container = branchElem.closest('.bazi-rel-container');
            if (container && (container.classList.contains('collapsed') || container.style.display === 'none')) {
                return null;
            }

            const rect = branchElem.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) {
                return null;
            }

            if (activeBranchPopups.has(branchElem)) {
                const existing = activeBranchPopups.get(branchElem);
                clearTimeout(existing.timer);
                clearTimeout(existing.fadeTimer);
                existing.popup.classList.remove('fading');
                
                existing.fadeTimer = setTimeout(() => existing.popup.classList.add('fading'), 2600);
                existing.timer = setTimeout(() => {
                    existing.popup.remove();
                    activeBranchPopups.delete(branchElem);
                }, 3000);
                return existing;
            }

            // Measure relative to body's coordinate space
            const bodyRect = document.body.getBoundingClientRect();

            const popup = document.createElement('div');
            popup.className = 'branch-hidden-popup';
            popup.style.left = `${(rect.left - bodyRect.left) + rect.width / 2}px`;
            popup.style.top = `${(rect.bottom - bodyRect.top) + 6}px`;
            popup.style.transform = 'translateX(-50%)';

            const divider = document.createElement('div');
            divider.className = 'popup-divider';
            popup.appendChild(divider);

            const stemList = document.createElement('div');
            stemList.className = 'popup-stems';

            const stemElements = {};

            const span = document.createElement('span');
            span.className = 'stem-char popup-stem';
            span.style.color = getElementColor(primaryStem);
            span.textContent = primaryStem;

            if (isRenyuanActive) { 
                const res = calculateRenyuanSiling();
                if (res && res.X === primaryStem) {
                    span.classList.add('renyuan-highlight-hidden');
                }
            }

            span.onclick = function(e) {
                e.stopPropagation();
                triggerArrows(this, primaryStem, branchElem);
            };
            stemList.appendChild(span);
            stemElements[primaryStem] = span;

            popup.appendChild(stemList);
            document.body.appendChild(popup);

            const fadeTimer = setTimeout(() => popup.classList.add('fading'), 2600);
            const timer = setTimeout(() => {
                popup.remove();
                activeBranchPopups.delete(branchElem);
            }, 3000);

            const popupData = { popup, stemElements, primaryStem, timer, fadeTimer };
            activeBranchPopups.set(branchElem, popupData);

            return popupData;
        }

        function toggleBranchHiddenStems(branchElem, branchChar) {
            const invBranchContainer = document.getElementById('invisibleBranchRelContainer');
            if (invBranchContainer && (invBranchContainer.classList.contains('collapsed') || invBranchContainer.style.display === 'none')) {
                return 0;  
            }

            const popupData = spawnBranchHiddenPopup(branchElem, branchChar);
            if (!popupData) return 0; 

            const primaryStem = popupData.primaryStem;
            const hElem = popupData.stemElements[primaryStem];
            if (!hElem) return 0;

            const targetPianCai = pianCaiDict[primaryStem];
            const sourceQiSha = qiShaDict[primaryStem];
            let popupArrowsCount = 0;

            // 1. Search Bottom Tenkans (ONLY Row 1 / First-level tenkans, NEVER Row 2!)
            const bottomStems = document.querySelectorAll('[id^="rect_h_r1"] .stem-char');
            bottomStems.forEach(bElem => {
                const bChar = bElem.textContent.trim();
                if (bChar === '合') return;

                // 偏財: Popup stem -> Bottom Row 1 stem (Orange)
                if (targetPianCai && bChar === targetPianCai) {
                    if (createArrow(hElem, bElem, "orange", "arrowhead-piancai")) {
                        popupArrowsCount++;
                    }
                }
                // 七殺: Bottom Row 1 stem -> Popup stem (Greenish-Yellow)
                if (sourceQiSha && bChar === sourceQiSha) {
                    if (createArrow(bElem, hElem, "#adff2f", "arrowhead-qisha")) {
                        popupArrowsCount++;
                    }
                }
            });

            // 2. Search OTHER Invisible Branches (Popup <-> Popup interaction!)
            const allInvisibleBranches = document.querySelectorAll('#invisibleBranchRelContainer text.spawned-branch');
            allInvisibleBranches.forEach(otherBranchElem => {
                if (otherBranchElem === branchElem) return; // Don't self-connect

                const otherBChar = otherBranchElem.textContent.trim();
                const otherPrimaryStem = getBranchPrimaryStem(otherBChar);
                if (!otherPrimaryStem) return;

                const isPianCai = (targetPianCai && otherPrimaryStem === targetPianCai);
                const isQiSha = (sourceQiSha && otherPrimaryStem === sourceQiSha);

                if (isPianCai || isQiSha) {
                    // Summon the other popup!
                    const otherPopup = spawnBranchHiddenPopup(otherBranchElem, otherBChar);
                    if (otherPopup && otherPopup.stemElements[otherPrimaryStem]) {
                        const otherHElem = otherPopup.stemElements[otherPrimaryStem];

                        // 偏財: this popup -> other popup (Orange)
                        if (isPianCai) {
                            if (createArrow(hElem, otherHElem, "orange", "arrowhead-piancai")) {
                                popupArrowsCount++;
                            }
                        }
                        // 七殺: other popup -> this popup (Greenish-Yellow)
                        if (isQiSha) {
                            if (createArrow(otherHElem, hElem, "#adff2f", "arrowhead-qisha")) {
                                popupArrowsCount++;
                            }
                        }
                    }
                }
            });

            return popupArrowsCount;
        }

        function calculateShengong(bazi) { 
            let yearStem, monthBranch, hourBranch;

            if (Array.isArray(bazi) && bazi.length >= 8) {
                yearStem = bazi[0];
                monthBranch = bazi[3];
                hourBranch = bazi[7];
            } else if (typeof currentBaziData !== 'undefined' && currentBaziData) {
                yearStem = currentBaziData.A;
                monthBranch = currentBaziData.D;
                hourBranch = currentBaziData.H;
            } else {
                return null;
            } 

            // ✅ If time is disabled or hour branch is missing, return null
            if (!yearStem || !monthBranch || !hourBranch || isTimeDisabled) return null;

            const monthBranchIdx = deizi_order.indexOf(monthBranch);
            const hourBranchIdx = deizi_order.indexOf(hourBranch);

            if (monthBranchIdx === -1 || hourBranchIdx === -1) return null;

            // 2. Find corresponding month palace (子上起正月: 寅 -> 子, 卯 -> 丑, 辰 -> 寅... i.e. index - 2)
            let currMonthIdx = (monthBranchIdx - 2 + 12) % 12;

            // 3. Dynamically find '酉' index and step until hour reaches '酉'
            const youIdx = deizi_order.indexOf("酉");
            let currHourIdx = hourBranchIdx;


            // Step hour forward (+1) and corresponding month backward (-1) until hour reaches '酉'
            while (currHourIdx !== youIdx) {
                currHourIdx = (currHourIdx + 1) % 12;
                currMonthIdx = (currMonthIdx - 1 + 12) % 12;
            }

            const calculatedWord = deizi_order[currMonthIdx];

            // 4. Derive Heavenly Stem using 五虎遁歌訣
            let calculatedStem = null;
            if (typeof 五虎遁歌訣 !== 'undefined' && 五虎遁歌訣[yearStem]) {
                calculatedStem = 五虎遁歌訣[yearStem][calculatedWord] || null;
            }

            return { stem: calculatedStem, branch: calculatedWord };
        }

        /**
         * 解析時刻字串為 Date 物件
         */
        function parseSolarTermDate(timeStr, fallbackYear) {
            if (!timeStr) return null;
            const match = timeStr.match(/(?:\((\d{4})\)\s*)?(\d{1,2})月(\d{1,2})日(?:,\s*(\d{1,2}):(\d{1,2}))?/);
            if (!match) return null;
            const y = match[1] ? parseInt(match[1], 10) : fallbackYear;
            const m = parseInt(match[2], 10);
            const d = parseInt(match[3], 10);
            const hr = match[4] ? parseInt(match[4], 10) : 0;
            const min = match[5] ? parseInt(match[5], 10) : 0;
            return new Date(y, m - 1, d, hr, min);
        }

        /**
         * 根據實際出生的年月日時分，與 24 節氣對比：
         * 1. 判定處於哪兩個中氣之間 (區間)
         * 2. 判定是否已過該區間內的中間節氣 (Middle Qi)
         * 3. 查表得出地支 Y
         */
        function getMinggongBranchByZhongQi(year, month, day, hour, hourBranch) {
            const hourIdx = deizi_order.indexOf(hourBranch);
            if (hourIdx === -1) return null;

            const yContent = document.getElementById('ycontent');
            if (!yContent) return null;
            const tables = yContent.querySelectorAll('table');
            if (tables.length < 2) return null;

            const rows = tables[1].querySelectorAll('tr');
            if (rows.length < 13) return null;

            // 當前排盤時間
            const birthDate = new Date(year, month - 1, day, hour, 0);

            let selectedKey = "冬至_大寒";
            let hasPassedMiddleQi = false;
            let middleQiName = "小寒";

            // 構建 12 個區間的開始、中間(Middle Qi)、結束時間
            for (let i = 1; i <= 12; i++) {
                const curRowTds = rows[i].querySelectorAll('td');
                const nextRowTds = rows[i + 1] ? rows[i + 1].querySelectorAll('td') : null;

                const startDate = parseSolarTermDate(curRowTds[1].innerText.trim(), year);
                const middleDate = parseSolarTermDate(curRowTds[4].innerText.trim(), year);
                const midName = curRowTds[3].innerText.trim();
                const endDate = nextRowTds ? parseSolarTermDate(nextRowTds[1].innerText.trim(), year) : null;

                if (startDate && endDate && birthDate >= startDate && birthDate < endDate) {
                    selectedKey = zhongQiIntervalKeys[i - 1];
                    middleQiName = midName;
                    hasPassedMiddleQi = (birthDate >= middleDate);
                    break;
                } else if (i === 12 && endDate && birthDate >= endDate) {
                    // 已過當年冬至，進入次年冬至~大寒區間
                    selectedKey = "冬至_大寒";
                    const nextXiaoHanDate = parseSolarTermDate(rows[13].querySelectorAll('td')[4].innerText.trim(), year + 1);
                    middleQiName = "小寒";
                    hasPassedMiddleQi = nextXiaoHanDate ? (birthDate >= nextXiaoHanDate) : false;
                    break;
                }
            }

            // 依據是否過 Middle Qi 選擇字典
            const activeDict = hasPassedMiddleQi ? minggongBranchDictAfter : minggongBranchDictBefore;
            const Y = activeDict[selectedKey][hourIdx];

            console.log(`🧭 命宮判定: 處於【${selectedKey}】，中間節氣為【${middleQiName}】，判定【${hasPassedMiddleQi ? '已過 Middle Qi (進一位)' : '未過 Middle Qi (用原位)'}】$\rightarrow$ 命宮地支為【${Y}】`);

            return Y;
        }

        // --- INVISIBLE HEAVENLY STEM RELATIONSHIPS (盲派 暗天干) ---
        function findInvisibleStemRelationships(stems) {  
            const results = [];  
            const N = stems.length;
            const seen = new Set();

            const stemHeYinMap = {
                "甲_己": "己", "己_甲": "己",
                "乙_庚": "辛", "庚_乙": "辛",
                "丙_辛": "癸", "辛_丙": "癸",
                "丁_壬": "乙", "壬_丁": "乙",
                "戊_癸": "丁", "癸_戊": "丁"
            };

            const stemChongMap = {
                "甲": "庚", "乙": "辛", "丙": "壬", "丁": "癸", "戊": "甲",
                "己": "乙", "庚": "丙", "辛": "丁", "壬": "戊", "癸": "己"
            };

            const stemHePartnerMap = {};
            if (typeof tenkan_relationships !== "undefined" && tenkan_relationships["合"]) {
                for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                    stemHePartnerMap[pair[0]] = pair[1];
                    stemHePartnerMap[pair[1]] = pair[0];
                }
            }

            // 1. 檢查緊貼相鄰兩柱 (Distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const s1 = stems[i];
                const s2 = stems[j];
                if (!s1 || !s2) continue;

                // 相鄰同字天干 (如 丁丁 -> 壬)
                if (s1 === s2) {
                    const partnerStem = stemHePartnerMap[s1] || null;
                    const key = `same_neighbor_${i}_${j}_${s1}_${partnerStem}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        results.push({
                            type: 'same_neighbor',
                            indices: [i, j],
                            hiddenStem: partnerStem
                        });
                    }
                    continue; 
                }

                // 常規相鄰序數天干 (如 甲乙、乙丙) -> 普通相連 Bond
                const idx1 = tenkan_order.indexOf(s1);
                const idx2 = tenkan_order.indexOf(s2);
                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 10) % 10 === 1 || (idx1 - idx2 + 10) % 10 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenStem: null
                            });
                        }
                    }
                }
            }

            // 2. 檢查間隔天干對 (隔位才生暗合字，j > i + 1)
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const s1 = stems[i];
                    const s2 = stems[j];

                    // 兩干相同但「非緊貼」（隔位）時，依然引出暗合之字
                    if (s1 === s2 && j > i + 1 && stemHePartnerMap[s1]) {
                        const partnerStem = stemHePartnerMap[s1];
                        const key = `two_same_${i}_${j}_${partnerStem}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'two_same',
                                indices: [i, j],
                                hiddenStem: partnerStem
                            });
                        }
                        continue;
                    }

                    const idx1 = tenkan_order.indexOf(s1);
                    const idx2 = tenkan_order.indexOf(s2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        // 隔一位夾出中間天干 (Distance 2)
                        let missingStem = null;
                        if ((idx2 - idx1 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx1 + 1) % 10];
                        } else if ((idx1 - idx2 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx2 + 1) % 10];
                        }

                        if (missingStem) {
                            const key = `missing_${i}_${j}_${missingStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'missing_one',
                                    indices: [i, j],
                                    hiddenStem: missingStem
                                });
                            }
                        }

                        // 合化引出 (He-Yin)
                        const comboKey = `${s1}_${s2}`;
                        if (stemHeYinMap[comboKey]) {
                            const yinStem = stemHeYinMap[comboKey];
                            const key = `he_yin_${i}_${j}_${yinStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'he_yin',
                                    indices: [i, j],
                                    hiddenStem: yinStem
                                });
                            }
                        }
                    }
                }
            }

            // 3. 三同干沖出一殺 (必須三字緊貼相鄰，如 丙丙丙O)
            for (let i = 0; i < N - 2; i++) {  
                const j = i + 1; // 緊貼的第二個字
                const k = i + 2; // 緊貼的第三個字

                const s1 = stems[i];
                const s2 = stems[j];
                const s3 = stems[k];

                // 確保天干非空，且三個字相鄰且完全相同
                if (s1 && s1 === s2 && s2 === s3 && stemChongMap[s1]) {
                    const qishaStem = stemChongMap[s1];
                    const key = `three_same_${i}_${j}_${k}_${qishaStem}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        results.push({
                            type: 'three_same',
                            indices: [i, j, k],
                            hiddenStem: qishaStem
                        });
                    }
                }
            }

            return results;
        }

        function renderInvisibleStemRelationships(stems, headers) {
            const container = document.getElementById('invisibleStemRelContainer');
            if (!container) return;  

            let rels = findInvisibleStemRelationships(stems);

            if (headers) {
                rels = rels.filter(rel => !rel.indices.some(idx => headers[idx] === "命宮" || headers[idx] === "胎元" || headers[idx] === "胎息" || headers[idx] === "身宮"));
            }

            if (isSplitMode && headers) {
                const groupA = ["命宮", "胎元", "胎息", "身宮", "時", "日", "月", "年", "元運"];
                const groupB = ["大運", "流年", "流月", "流日", "流時"]; 
                rels = rels.filter(rel => {
                    const hasA = rel.indices.some(idx => groupA.includes(headers[idx]));
                    const hasB = rel.indices.some(idx => groupB.includes(headers[idx]));
                    return !(hasA && hasB);
                });
            }

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'block';

            const N = stems.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 45;

            const { packedRels, totalLayers } = packRelationships(rels, xCoords, 12);
            const totalHeight = totalLayers * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            if (isSplitMode && headers) {
                let targetIdx = headers.indexOf("元運");
                if (targetIdx === -1) {
                    targetIdx = headers.indexOf("年");
                }
                if (targetIdx !== -1 && targetIdx < N - 1) { 
                    const splitX = xCoords[targetIdx] + 49; 
                    const lineColor = isDarkMode() ? "#666" : "#aaa";
                    svgHtml += `<line x1="${splitX}" y1="0" x2="${splitX}" y2="${totalHeight}" stroke="${lineColor}" stroke-width="${1.5}" stroke-dasharray="4,4" />`;
                }
            }

            packedRels.forEach((rel, k) => {
                const yTop = rel.layer * layerHeight + 6;
                const yBar = yTop + 14;
                const yBottom = yTop + 38;

                const minX = rel.minX;
                const maxX = rel.maxX;
                const midX = (minX + maxX) / 2;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const leftStem = stems[sortedIndices[0]];
                const rightStem = stems[sortedIndices[sortedIndices.length - 1]];

                const cLeft = getRelColor(getElementColor(leftStem));
                const cRight = getRelColor(getElementColor(rightStem));

                const gradId = `invStemGrad_${k}`;

                svgHtml += `
                    <defs>
                        <linearGradient id="${gradId}" x1="${minX}" y1="0" x2="${maxX}" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cRight}" />
                            <stop offset="100%" stop-color="${cRight}" />
                        </linearGradient>
                    </defs>
                `;

                // ================= 【嚴格實線/虛線判定】 =================
                // 1. 相鄰同干緊貼 (如 丙丙)
                const isCase1 = (rel.type === 'same_neighbor');

                // 2. 嚴格十天干連茹相鄰 (如 丙丁、丁戊；丁己不是鄰居，不在此列！)
                const isCase2 = (rel.type === 'neighbor');

                // 3. 天干正合 (如 甲己、乙庚、丙辛、丁壬、戊癸，無論距離)
                const isCase3 = (rel.type === 'he_yin');

                // 僅此 3 種為粗實線，其餘（包含 丁己夾戊、丙戊夾丁、隔位丙O丙）一律為虛線
                const isBoldSolid = isCase1 || isCase2 || isCase3;

                let strokeWidth = isBoldSolid ? 3.5 : 2;
                if (isCase1) strokeWidth = 5;

                const dashAttr = isBoldSolid ? '' : 'stroke-dasharray="4,4"';
                // ========================================================

                const isSameNeighbor = (rel.type === 'same_neighbor');
                const isNeighbor = (rel.type === 'neighbor');
                const hasHiddenStem = Boolean(rel.hiddenStem && !isNeighbor);

                const strokeColor = isSameNeighbor ? cLeft : `url(#${gradId})`;

                if (!hasHiddenStem) {
                    // 純相鄰連茹 (如 丙丁、丁戊) -> 實線
                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} stroke-linecap="round" />`;

                    sortedIndices.forEach(idx => {
                        const x = rel.getX(idx);
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} stroke-linecap="round" />`;
                    });
                } else {
                    // 帶引出字的關係 (如 丁己夾戊、丙丙引辛、丙辛引癸)
                    const boxSize = 26;
                    const boxX = midX - boxSize / 2;
                    const boxY = yBar - boxSize / 2;

                    // 橫向連接線（丁己夾戊在此會帶入 dashAttr，變成虛線）
                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${boxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} />`;
                    svgHtml += `<line x1="${boxX + boxSize}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} />`;

                    // 中央方塊保持實線框，文字清晰
                    svgHtml += `<rect x="${boxX}" y="${boxY}" width="${boxSize}" height="${boxSize}" rx="4" ry="4" fill="var(--card-bg)" stroke="${strokeColor}" stroke-width="${isBoldSolid ? 2.5 : 1.8}" />`;

                    const hiddenCol = getRelColor(getElementColor(rel.hiddenStem));
                    let displayText = rel.hiddenStem;
                    let displayColor = hiddenCol;

                    if (!isHeHuaEnabled && rel.type === 'he_yin') {
                        displayText = "合";
                        displayColor = isDarkMode() ? "#e0e0e0" : "#222"; 
                    }

                    const clickHandler = (displayText === "合") 
                        ? "event.stopPropagation();" 
                        : `event.stopPropagation(); triggerArrows(this, '${rel.hiddenStem}')`;

                    svgHtml += `<text class="spawned-stem" x="${midX}" y="${yBar + 6}" font-size="16" font-weight="700" text-anchor="middle" fill="${displayColor}" onclick="${clickHandler}">${displayText}</text>`;
                    
                    // 垂直向下連到天干的線（虛線時同樣帶入 dashAttr）
                    sortedIndices.forEach(idx => { 
                        const x = rel.getX(idx);
                        const cap = isBoldSolid ? 'stroke-linecap="round"' : '';
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} ${cap} />`;
                    });
                }

                if (!isSameNeighbor) {
                    sortedIndices.forEach(idx => {
                        const x = rel.getX(idx);
                        const dotCol = getRelColor(getElementColor(stems[idx]));
                        if (hasHiddenStem) {
                            svgHtml += `<circle cx="${x}" cy="${yBottom}" r="3" fill="${dotCol}" />`;
                        } else {
                            svgHtml += `<circle cx="${x}" cy="${yBottom}" r="5" fill="${dotCol}" stroke="var(--card-bg)" stroke-width="1.5" />`;
                        }
                    });
                }
            });

            svgHtml += `</svg>`;
            container.innerHTML = svgHtml;
        }

        // --- INVISIBLE EARTHLY BRANCH RELATIONSHIPS (盲派 暗拱/暗夾 & 實線/虛線規則) --- ok 
        function findInvisibleBranchRelationships(branches) {  
            const results = [];  
            const N = branches.length;
            const seen = new Set();

            const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

            const liuHePairs = [
                ["子", "丑"], ["寅", "亥"], ["卯", "戌"],
                ["酉", "辰"], ["巳", "申"], ["午", "未"]
            ];

            function getLiuHePartner(b) {
                for (const pair of liuHePairs) {
                    if (pair[0] === b) return pair[1];
                    if (pair[1] === b) return pair[0];
                }
                return null;
            }

            function isLiuHe(b1, b2) {
                return liuHePairs.some(pair => 
                    (b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])
                );
            }

            // [1, 2, 3] 結構：始終由 1 和 3 拱出/夾出 2
            const sanHeGroups = [
                ["申", "子", "辰"], // 申(1) 辰(3) 生 子(2)
                ["巳", "酉", "丑"], // 巳(1) 丑(3) 生 酉(2)
                ["寅", "午", "戌"], // 寅(1) 戌(3) 生 午(2)
                ["亥", "卯", "未"]  // 亥(1) 未(3) 生 卯(2)
            ];

            const sanHuiGroups = [
                ["亥", "子", "丑"], // 亥(1) 丑(3) 生 子(2)
                ["申", "酉", "戌"], // 申(1) 戌(3) 生 酉(2)
                ["巳", "午", "未"], // 巳(1) 未(3) 生 午(2)
                ["寅", "卯", "辰"]  // 寅(1) 辰(3) 生 卯(2)
            ];

            // 檢查 [1, 3] 拱夾生出 [2]，或常規隔位夾字 (Distance 2)
            function getArchOrClampedBranch(b1, b2) {
                // 1. 三合 [1, 3] 暗拱 [2] (如 申辰拱子、寅戌拱午)
                for (const group of sanHeGroups) {
                    const first = group[0];
                    const middle = group[1];
                    const last = group[2];
                    if ((b1 === first && b2 === last) || (b1 === last && b2 === first)) {
                        return middle;
                    }
                }

                // 2. 三會 [1, 3] 暗夾 [2] (如 寅辰夾卯、亥丑夾子)
                for (const group of sanHuiGroups) {
                    const first = group[0];
                    const middle = group[1];
                    const last = group[2];
                    if ((b1 === first && b2 === last) || (b1 === last && b2 === first)) {
                        return middle;
                    }
                }

                // 3. 常規地支隔位夾字 (Neighbors' Neighbor，如 子寅夾丑)
                const idx1 = zhiOrder.indexOf(b1);
                const idx2 = zhiOrder.indexOf(b2);
                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 12) % 12 === 2) {
                        return zhiOrder[(idx1 + 1) % 12];
                    } else if ((idx1 - idx2 + 12) % 12 === 2) {
                        return zhiOrder[(idx2 + 1) % 12];
                    }
                }

                return null;
            }

            // 檢查三合 / 三會中 [1, 2] 或 [2, 3] 的半合半會（不生字，實線連接）
            function isHalfComboPair(b1, b2) {
                for (const group of [...sanHeGroups, ...sanHuiGroups]) {
                    const [first, middle, last] = group;
                    const is12 = (b1 === first && b2 === middle) || (b1 === middle && b2 === first);
                    const is23 = (b1 === middle && b2 === last) || (b1 === last && b2 === middle);
                    if (is12 || is23) return true;
                }
                return false;
            }

            // 遍歷所有支柱配對 (i < j)
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    if (!b1 || !b2) continue;

                    // 規則 1: 相同字成對 (子子OO 或 子O子O) -> 依據六合引出對應天干地支（生出字，虛線 normal）
                    if (b1 === b2) {
                        const partner = getLiuHePartner(b1);
                        if (partner) {
                            const key = `doubles_${i}_${j}_${partner}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'doubles',
                                    indices: [i, j],
                                    hiddenBranch: partner,
                                    color: getElementColor(partner)
                                });
                            }
                        }
                        continue;
                    }

                    // 規則 2: 異字六合 (子丑, 寅亥, 卯戌, 辰酉, 巳申, 午未) -> 粗實線，引出字為 "合"
                    if (isLiuHe(b1, b2)) {
                        const key = `liuhe_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'liuhe',
                                indices: [i, j],
                                hiddenBranch: '合'
                            });
                        }
                        continue;
                    }

                    // 規則 3: [1, 3] 拱出/夾出 [2]，或常規隔位夾出中間地支 -> normal 虛線 (Dotted)，生出字
                    const spawnedBranch = getArchOrClampedBranch(b1, b2);
                    if (spawnedBranch) {
                        const key = `arch_clamp_${i}_${j}_${spawnedBranch}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'clamping',
                                indices: [i, j],
                                hiddenBranch: spawnedBranch,
                                color: getElementColor(spawnedBranch)
                            });
                        }
                        continue;
                    }

                    // 規則 4: 三合 / 三會中的 [1, 2] 與 [2, 3] (如 申子, 子辰, 寅午, 午戌, 亥子, 寅卯...) -> 粗實線，不生字
                    if (isHalfComboPair(b1, b2)) {
                        const key = `half_combo_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'half_combo',
                                indices: [i, j],
                                hiddenBranch: null
                            });
                        }
                        continue;
                    }

                    // 規則 5: 緊貼相鄰序數地支連茹 (如 巳辰, 戌酉 等) -> 粗實線，不生字
                    if (j === i + 1) {
                        const idx1 = zhiOrder.indexOf(b1);
                        const idx2 = zhiOrder.indexOf(b2);
                        if (idx1 !== -1 && idx2 !== -1) {
                            if ((idx2 - idx1 + 12) % 12 === 1 || (idx1 - idx2 + 12) % 12 === 1) {
                                const key = `neighbor_${i}_${j}`;
                                if (!seen.has(key)) {
                                    seen.add(key);
                                    results.push({
                                        type: 'neighbor',
                                        indices: [i, j],
                                        hiddenBranch: null
                                    });
                                }
                                continue;
                            }
                        }
                    }
                }
            }

            return results;
        }

        function renderInvisibleBranchRelationships(branches, headers) {
            const container = document.getElementById('invisibleBranchRelContainer');

            let rels = findInvisibleBranchRelationships(branches);

                const groupB = ["大運", "流年", "流月", "流日", "流時"];
                rels = rels.filter(rel => {
                    const hasA = rel.indices.some(idx => groupA.includes(headers[idx]));
                    const hasB = rel.indices.some(idx => groupB.includes(headers[idx]));
                    return !(hasA && hasB);
                });

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;

            const N = branches.length;

            packedRels.forEach((rel, k) => {

                const yBar = yTop + 24;

                const minX = rel.minX;
                const maxX = rel.maxX;
                const midX = (minX + maxX) / 2;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const leftBranch = branches[sortedIndices[0]];
                const rightBranch = branches[sortedIndices[sortedIndices.length - 1]];

                const cLeft = getRelColor(getElementColor(leftBranch));
                const cRight = getRelColor(getElementColor(rightBranch));

                svgHtml += `
                    <defs>

                            <stop offset="0%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cRight}" />
                            <stop offset="100%" stop-color="${cRight}" />
                        </linearGradient>
                    </defs>
                `;

                // ================= 【實線 / 虛線 判定】 =================
                // 1. 六合 (如 子丑、卯戌) -> 粗實線
                const isCase1 = (rel.type === 'liuhe');
                // 2. 三合 / 三會中的 [1, 2] 與 [2, 3] (如 申子, 子辰, 寅午, 午戌) -> 粗實線
                const isCase2 = (rel.type === 'half_combo');
                // 3. 緊貼相鄰地支連茹 (如 巳辰、戌酉) -> 粗實線
                const isCase3 = (rel.type === 'neighbor');

                // doubles(同字成對生字) 和 clamping(暗拱/暗夾生字) 一律為 normal 虛線 (dotted)
                const isBoldSolid = isCase1 || isCase2 || isCase3;

                let strokeWidth = isBoldSolid ? 3.5 : 2;
                const dashAttr = isBoldSolid ? '' : 'stroke-dasharray="4,4"';
                // ========================================================

                const hasHiddenBranch = Boolean(rel.hiddenBranch);

                const strokeColor = (hasHiddenBranch && rel.color)

                if (!hasHiddenBranch) {

                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashAttr} stroke-linecap="round" />`;

                        svgHtml += `<text class="spawned-branch" x="${midX}" y="${yBar + 6}" font-size="16" font-weight="700" text-anchor="middle" fill="${branchTextColor}" onclick="event.stopPropagation(); triggerDizhiArrows(this, '${rel.hiddenBranch}'); drawXingArrows(this, '${rel.hiddenBranch}'); toggleBranchHiddenStems(this, '${rel.hiddenBranch}');">${rel.hiddenBranch}</text>`;
                    }
                } 

                sortedIndices.forEach(idx => {
                    const x = rel.getX(idx);
                    const dotCol = getRelColor(getElementColor(branches[idx]));
                    if (hasHiddenBranch) {
                        svgHtml += `<circle cx="${x}" cy="${yTop + 2}" r="3" fill="${dotCol}" />`;
                    } else {
                        svgHtml += `<circle cx="${x}" cy="${yTop + 2}" r="5" fill="${dotCol}" stroke="var(--card-bg)" stroke-width="1.5" />`;
                    }
                });
            }); 

            svgHtml += `</svg>`;
            container.innerHTML = svgHtml;

        function drawXAnimation(element) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return; 

            const canvasRect = canvas.getBoundingClientRect();
            const rect = element.getBoundingClientRect();

            // Exact center relative to the SVG canvas
            const cx = (rect.left - canvasRect.left) + (rect.width / 2);
            const cy = (rect.top - canvasRect.top) + (rect.height / 2);

            // Support both main pillar stems AND main pillar branches (90x90 squares)
            const isLarge = element.classList.contains('main-pillar-stem') || element.classList.contains('main-pillar-branch');
            const size = isLarge ? 22 : 10;

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line1.setAttribute("x1", cx - size);
            line1.setAttribute("y1", cy - size);
            line1.setAttribute("x2", cx + size);
            line1.setAttribute("y2", cy + size);
            line1.setAttribute("stroke", "#ff4d4f");
            line1.setAttribute("stroke-width", "3.5");
            line1.setAttribute("stroke-linecap", "round");

            const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line2.setAttribute("x1", cx + size);
            line2.setAttribute("y1", cy - size);
            line2.setAttribute("x2", cx - size);
            line2.setAttribute("y2", cy + size);
            line2.setAttribute("stroke", "#ff4d4f");
            line2.setAttribute("stroke-width", "3.5");
            line2.setAttribute("stroke-linecap", "round");

            g.appendChild(line1);
            g.appendChild(line2);
            canvas.appendChild(g);

            g.style.transformOrigin = `${cx}px ${cy}px`;
            g.animate([
                { transform: 'scale(0.3) rotate(-10deg)', opacity: 0 },
                { transform: 'scale(1.1) rotate(0deg)', opacity: 1, offset: 0.3 },
                { transform: 'scale(1.0) rotate(0deg)', opacity: 1, offset: 0.7 },
                { transform: 'scale(0.9) rotate(0deg)', opacity: 0 }
            ], {
                duration: 1200,
                easing: 'ease-out',
                fill: 'forwards'
            });

            setTimeout(() => g.remove(), 1250);
        }

        // BaZi Earthly Branch Six Clashes (地支六沖)
        const chongDict = {

        // Helper: Checks if an element is a bottom hidden stem (Rows 1 & 2) or an invisible branch popup stem
        function isBottomOrBranchHiddenStem(el) {
            if (!el) return false; 
            const isBottomStem = Boolean(el.closest && el.closest('[id^="rect_h_r"]'));
            const isPopupStem = Boolean(el.classList && (el.classList.contains('popup-stem') || el.closest('.branch-hidden-popup')));
            return isBottomStem || isPopupStem;

        function createArrow(fromElem, toElem, color, markerId, isBiDirectional = false, opacity = 1) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return false;  

            if ((fromElem && fromElem.textContent.trim() === '合') || (toElem && toElem.textContent.trim() === '合')) {
                return false;
            }

            const canvasRect = canvas.getBoundingClientRect();
            const startRect = fromElem.getBoundingClientRect();
            const endRect = toElem.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0 || endRect.width === 0 || endRect.height === 0) return false;

            // Calculate exact center relative to the SVG canvas coordinate space
            const startX = (startRect.left - canvasRect.left) + (startRect.width / 2);
            const startY = (startRect.top - canvasRect.top) + (startRect.height / 2);
            const endX = (endRect.left - canvasRect.left) + (endRect.width / 2);
            const endY = (endRect.top - canvasRect.top) + (endRect.height / 2);

            const isMainBranch = fromElem.classList.contains('main-pillar-branch') || fromElem.classList.contains('main-pillar-stem');
            const isTargetMain = toElem.classList.contains('main-pillar-branch') || toElem.classList.contains('main-pillar-stem');
            const startOffsetRadius = isMainBranch ? 35 : 12;
            const endOffsetRadius = isTargetMain ? 35 : 12;

            const dx = endX - startX;
            const dy = endY - startY;
            const distance = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            if (distance <= (startOffsetRadius + endOffsetRadius)) return false;

            const adjustedStartX = startX + Math.cos(angle) * startOffsetRadius;
            const adjustedStartY = startY + Math.sin(angle) * startOffsetRadius;
            const adjustedEndX = endX - Math.cos(angle) * endOffsetRadius;
            const adjustedEndY = endY - Math.sin(angle) * endOffsetRadius;

            const adjustedDistance = Math.hypot(adjustedEndX - adjustedStartX, adjustedEndY - adjustedStartY);

            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.style.opacity = opacity;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", adjustedStartX);
            line.setAttribute("y1", adjustedStartY);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "2.5");

            group.appendChild(line);
            canvas.appendChild(group);

            // Check if BOTH elements are bottom hidden stems or invisible branch popup stems
            const isDotted = isBottomOrBranchHiddenStem(fromElem) && isBottomOrBranchHiddenStem(toElem);

            if (isDotted) {
                // Apply dotted stroke pattern (5px dash, 4px gap)
                line.setAttribute("stroke-dasharray", "5,4");
                
                // Start line at origin (length 0)
                line.setAttribute("x2", adjustedStartX);
                line.setAttribute("y2", adjustedStartY);

                const duration = 600; // 600ms draw animation
                const startTime = performance.now();

                // Animate (x2, y2) extending smoothly toward target at 60fps
                function animateDottedLine(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Cubic ease-out
                    const ease = 1 - Math.pow(1 - progress, 3);

                    const curX2 = adjustedStartX + (adjustedEndX - adjustedStartX) * ease;
                    const curY2 = adjustedStartY + (adjustedEndY - adjustedStartY) * ease;

                    line.setAttribute("x2", curX2);
                    line.setAttribute("y2", curY2);

                    if (progress < 1) {
                        requestAnimationFrame(animateDottedLine);
                    } else {
                        // Reached destination: attach arrowheads
                        line.setAttribute("marker-end", `url(#${markerId})`);
                        if (isBiDirectional) {
                            line.setAttribute("marker-start", `url(#${markerId})`);
                        }
                    }
                }
                requestAnimationFrame(animateDottedLine);

            } else {
                // Standard solid line animation
                line.setAttribute("x2", adjustedEndX);
                line.setAttribute("y2", adjustedEndY);
                line.style.strokeDasharray = adjustedDistance;
                line.style.strokeDashoffset = adjustedDistance;

                const drawAnim = line.animate([
                    { strokeDashoffset: adjustedDistance },
                    { strokeDashoffset: 0 }
                ], { duration: 600, easing: 'ease-out', fill: 'forwards' });

                drawAnim.onfinish = () => {
                    line.setAttribute("marker-end", `url(#${markerId})`);
                    if (isBiDirectional) {
                        line.setAttribute("marker-start", `url(#${markerId})`);
                    }
                };
            }

            // Fade out after holding
            group.animate([
                { opacity: opacity },
                { opacity: 0 }
            ], { duration: 500, delay: 1500, easing: 'ease-out', fill: 'forwards' });

            setTimeout(() => group.remove(), 2100);
            return true;
        }

        function drawXingArrows(sourceElement, char) {
            if (typeof isZuoGongMode !== 'undefined' && isZuoGongMode) return 0;

            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;

            // 1. Find elements that the clicked character punishes (Outgoing)
            const targets = xingMap[char] || [];
            
            // 2. Find elements that punish the clicked character (Incoming)
            const sources = Object.keys(xingMap).filter(key => xingMap[key].includes(char));

            if (targets.length === 0 && sources.length === 0) { 
                return 0;
            }

            const querySelectors = '.bazi-square, .bazi-rect, .stem-char, text.spawned-branch, text.spawned-stem, .main-pillar-branch, .time-pillar-branch';
            const allNodes = document.querySelectorAll(querySelectors);
            
            let arrowsDrawnCount = 0;

            allNodes.forEach(node => {
                if (node === sourceElement) return; 
                
                const textContent = (node.textContent || node.innerText).trim();
                
                // Outgoing Relationship
                if (targets.some(t => textContent.includes(t))) {
                    if (createArrow(sourceElement, node, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }

                // Incoming Relationship
                if (sources.some(s => textContent.includes(s))) {
                    if (createArrow(node, sourceElement, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            return arrowsDrawnCount;
        } 

        function triggerDizhiArrows(clickedElement, sourceChar, suppressCross = false) { 
            if (typeof isZuoGongMode !== 'undefined' && isZuoGongMode) return 0;

            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;

            const targetChongChar = chongDict[sourceChar];
            
            // Select all Earthly Branch elements (main pillars + spawned/time pillars)
            const possibleTargets = document.querySelectorAll('.main-pillar-branch, #invisibleBranchRelContainer text.spawned-branch, .time-pillar-branch');
            let arrowsDrawnCount = 0;

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();

                // 沖 (Clash): Draw a bidirectional orange arrow between source and target
                if (targetChongChar && targetText === targetChongChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-chong", true)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // Draw X animation if no clash partner exists on screen (unless suppressed)
            if (arrowsDrawnCount === 0 && !suppressCross) {
                drawXAnimation(clickedElement);
            }

            return arrowsDrawnCount;
        }

        function triggerArrows(clickedElement, sourceChar, originBranchElem = null, suppressCross = false, arrowOpacity = 1) { 
            // --- UPDATE THIS BLOCK ---
            if (typeof isZuoGongMode !== 'undefined' && isZuoGongMode) {
                // 🚫 Ignore any clicks on bottom hidden stems
                if (clickedElement && (clickedElement.closest('.bazi-rect-hidden') || clickedElement.closest('[id^="rect_h_r"]'))) {
                    return 0;
                }

                if (typeof handleZuoGongClick === 'function') {
                    handleZuoGongClick(clickedElement, sourceChar);
                }
                return 0; // Disable all arrow rendering
            } 
            // ---------------------------------
            
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;  

            // Do nothing if the clicked element itself is "合"
            if (clickedElement && clickedElement.textContent.trim() === '合') {
                return 0;
            } 

            const targetPianCaiChar = pianCaiDict[sourceChar];
            const sourceQiShaChar = qiShaDict[sourceChar];

            // Check visibility states of containers
            const invBranchContainer = document.getElementById('invisibleBranchRelContainer');
            const isInvBranchContainerOpen = invBranchContainer && 
                !invBranchContainer.classList.contains('collapsed') && 
                invBranchContainer.style.display !== 'none';

            const invStemContainer = document.getElementById('invisibleStemRelContainer');
            const isInvStemContainerOpen = invStemContainer && 
                !invStemContainer.classList.contains('collapsed') && 
                invStemContainer.style.display !== 'none';

            // Identify which exact tier the clicked element belongs to:
            const isRow2BottomStem = clickedElement.closest('[id^="rect_h_r2"]') !== null;
            const isRow1BottomStem = clickedElement.closest('[id^="rect_h_r1"]') !== null;
            const isPopupStem = clickedElement.classList.contains('popup-stem');

            let targetSelector = '';

            if (isRow2BottomStem) {
                // Row 2 ("bottom two tenkans"): ONLY point arrows at other Row 2 stems!
                targetSelector = '[id^="rect_h_r2"] .stem-char';
            } else if (isRow1BottomStem) {
                // Row 1 ("bottom first level tenkans"): points to other Row 1 stems
                targetSelector = '[id^="rect_h_r1"] .stem-char';
            } else if (isPopupStem) {
                // Popup stem: can interact with Row 1 stems and other popup stems
                targetSelector = '[id^="rect_h_r1"] .stem-char, .popup-stem';
            } else {
                // Main pillar stems: only target invisible stems if its container is OPEN
                targetSelector = isInvStemContainerOpen 
                    ? '.main-pillar-stem, #invisibleStemRelContainer text.spawned-stem' 
                    : '.main-pillar-stem';
            }

            const possibleTargets = document.querySelectorAll(targetSelector);
            let arrowsDrawnCount = 0;

            // 1. Search strictly within the isolated target group
            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();
                if (targetText === '合') return;

                // 偏財: Clicked stem -> 偏財 stem (Orange arrow)
                if (targetPianCaiChar && targetText === targetPianCaiChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-piancai", false, arrowOpacity)) {
                        arrowsDrawnCount++;
                    }
                }

                // 七殺: 七殺 stem -> Clicked stem (Greenish-Yellow arrow)
                if (sourceQiShaChar && targetText === sourceQiShaChar) {
                    if (createArrow(target, clickedElement, "#adff2f", "arrowhead-qisha", false, arrowOpacity)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // 2. Search / Summon Invisible Branches:
            if ((isRow1BottomStem || isPopupStem) && isInvBranchContainerOpen) {
                const invisibleBranches = document.querySelectorAll('#invisibleBranchRelContainer text.spawned-branch');
                invisibleBranches.forEach(branchElem => {
                    if (branchElem === originBranchElem) return;

                    const bChar = branchElem.textContent.trim();
                    const primaryStem = getBranchPrimaryStem(bChar);
                    if (!primaryStem) return;

                    const isPianCai = (targetPianCaiChar && primaryStem === targetPianCaiChar);
                    const isQiSha = (sourceQiShaChar && primaryStem === sourceQiShaChar);

                    if (isPianCai || isQiSha) {
                        const popupData = spawnBranchHiddenPopup(branchElem, bChar);
                        if (popupData && popupData.stemElements[primaryStem]) {
                            const hElem = popupData.stemElements[primaryStem];

                            // 偏財: Clicked stem -> Popup stem (Orange)
                            if (isPianCai) {
                                if (createArrow(clickedElement, hElem, "orange", "arrowhead-piancai", false, arrowOpacity)) {
                                    arrowsDrawnCount++;
                                }
                            }

                            // 七殺: Popup stem -> Clicked stem (Greenish-Yellow)
                            if (isQiSha) {
                                if (createArrow(hElem, clickedElement, "#adff2f", "arrowhead-qisha", false, arrowOpacity)) {
                                    arrowsDrawnCount++;
                                }
                            }
                        }
                    }
                });
            }

            // 3. Show X animation if no connections
            if (arrowsDrawnCount === 0 && !suppressCross) {
                drawXAnimation(clickedElement);
            }

            return arrowsDrawnCount;
        }

                    }

                    // 4. Automatically trigger bottom tenkan words at 30% opacity (0.3)
                    let row1Arrows = 0;
                    let row2Arrows = 0;
                    const colIdx = this.getAttribute('data-col');

                    if (colIdx !== null) {
                        // Row 1: The first/primary hidden stem (本氣) -> 100% solid (opaque)
                        const r1 = document.getElementById(`rect_h_r1_c${colIdx}`);
                        if (r1) {
                            const r1Stems = r1.querySelectorAll('.stem-char');
                            r1Stems.forEach(stemSpan => {
                                const stemChar = stemSpan.textContent.trim();
                                if (stemChar && stemChar !== '合') {
                                    const count = triggerArrows(stemSpan, stemChar, null, true, 1.0); // <--- set to 1.0
                                    row1Arrows += (count || 0);
                                }
                            });
                        } 

                        // Row 2: The last two or one hidden stems (中氣 / 餘氣) -> 30% opacity
                        const r2 = document.getElementById(`rect_h_r2_c${colIdx}`);
                        if (r2) {
                            const r2Stems = r2.querySelectorAll('.stem-char');
                            r2Stems.forEach(stemSpan => {
                                const stemChar = stemSpan.textContent.trim();
                                if (stemChar && stemChar !== '合') {
                                    const count = triggerArrows(stemSpan, stemChar, null, true, 0.3);
                                    row2Arrows += (count || 0);
                                }
                            });
                        }
                    }

                    // 5. Cross (X) Decision Logic:
                    if (this.classList.contains('spawned-branch')) {
                        const totalInvisibleConnections = (chongCount || 0) + (xingCount || 0) + (popupArrows || 0);
                        if (totalInvisibleConnections === 0) {
                            drawXAnimation(this);
                        }
                    } else {
                        const hasSolidBranchConnection = (xingCount > 0) || (chongCount > 0) || (row1Arrows > 0);

                        if (!hasSolidBranchConnection) {
                            drawXAnimation(this);
                        }
                    }
                };
            });

            applyRenyuanHighlight();
        } 

        document.addEventListener("DOMContentLoaded", () => {
            const yearSelect = document.getElementById('yearSelect');

            const sexSelect = document.getElementById('sexSelect');

            } 

            const renyuanBtn = document.getElementById('renyuanBtn');

                renyuanBtn.addEventListener('click', () => {

                });
            }

            disableTimeBtn.addEventListener('click', () => {

                // Optional: Add a visual highlight to the button when time is disabled
                if (isTimeDisabled) {

            // Bind 命宮 Toggle Button
