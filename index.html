<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazi Calculator</title>
    <!-- Google Font: Noto Serif SC including weight 200, 400, 700, 900 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="paipan.js" defer></script> 
    <script src="constants.js" defer></script>
</head> 
<body>

    <div class="controls-bar">
        <button id="themeToggleBtn" class="btn-dayun btn-theme">☀️</button>
        <button id="nowBtn" class="btn-dayun">Now</button>
        <select id="yearSelect"></select> 年
        <select id="monthSelect"></select> 月
        <select id="daySelect"></select> 日
        <select id="hourSelect"></select> 時
        <select id="sexSelect">
            <option value="0">男</option>
            <option value="1">女</option>
        </select> 命
        <button id="disableTimeBtn" class="btn-dayun">Disable Time</button> 
        <button id="hehuaBtn" class="btn-dayun">Enable 合化</button> 
        <button id="splitBtn" class="btn-dayun">Combine</button>
        <button id="minggongBtn" class="btn-dayun">命宮</button>
        <button id="yuanyunBtn" class="btn-dayun">元運</button>
        <button id="dayunBtn" class="btn-dayun">大運</button>
        <button id="liunianBtn" class="btn-dayun" style="display: none;">流年</button>
        <button id="liuyueBtn" class="btn-dayun" style="display: none;">流月</button>
        <button id="liuriBtn" class="btn-dayun" style="display: none;">流日</button>
        <button id="liushiBtn" class="btn-dayun" style="display: none;">流時</button>
    </div>

    <!-- Scrollable 命宮 List -->
    <div class="dayun-scroll-container" id="minggongBar"></div>

    <!-- Scrollable 元運 List -->
    <div class="dayun-scroll-container" id="yuanyunBar"></div>

    <!-- Scrollable 大運 List -->
    <div class="dayun-scroll-container" id="dayunBar"></div>

    <!-- Scrollable 流年 List -->
    <div class="dayun-scroll-container" id="liunianBar"></div>

    <!-- Scrollable 流月 List -->
    <div class="dayun-scroll-container" id="liuyueBar"></div>

    <!-- Scrollable 流日 List -->
    <div class="dayun-scroll-container" id="liuriBar"></div>

    <!-- Scrollable 流時 List -->
    <div class="dayun-scroll-container" id="liushiBar"></div>

    <!-- Bazi Grid -->
    <div class="bazi-container" id="baziGrid"></div>
    <svg id="arrowCanvas">
        <defs>
            <marker id="arrowhead-piancai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="orange"/>
            </marker>
            <marker id="arrowhead-qisha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#adff2f"/>
            </marker>
            <marker id="arrowhead-chong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="orange"/>
            </marker>
            <marker id="arrowhead-xing" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="purple"/>
            </marker>
        </defs>
    </svg>

    <pre id="errorResult" style="color: red; margin-top: 10px; font-size: 13px;"></pre>

    <script>
        // Toggle state for 命宮
        let isMinggongActive = false;
        let isHeHuaEnabled = false;

        function calculateMinggong() {  
            if (!currentBaziData) return null;

            const bazi = currentBaziData.bazi || [
                currentBaziData.A, currentBaziData.B, // Year Stem, Branch 
                currentBaziData.C, currentBaziData.D, // Month Stem, Branch
                currentBaziData.E, currentBaziData.F, // Day Stem, Branch
                currentBaziData.G, currentBaziData.H  // Hour Stem, Branch
            ];

            const yearStem = bazi[0];
            const monthBranch = bazi[3];
            const hourBranch = bazi[7];

            // If time is disabled or hourBranch is missing, return null
            if (!yearStem || !monthBranch || !hourBranch) {
                return null;
            }

            const monthIdx = deizi_order.indexOf(monthBranch);
            const hourIdx = deizi_order.indexOf(hourBranch);

            if (monthIdx === -1 || hourIdx === -1) return null;

            // Formula: (5 - monthIdx - hourIdx + 24) % 12
            const branchIdx = (5 - monthIdx - hourIdx + 24) % 12;
            const Y = deizi_order[branchIdx];
            const X = 五虎遁歌訣[yearStem] ? 五虎遁歌訣[yearStem][Y] : null;

            if (!X || !Y) return null;

            return { stem: X, branch: Y };
        }

        function isDarkMode() {
            return document.body.getAttribute('data-theme') === 'dark';
        }

        function getOrdinalDay(day) {
            let s = ["th", "st", "nd", "rd"];
            let v = day % 100;
            return day + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        let currentBaziData = null; 
        let isTimeDisabled = false; 
        let selectedYuanyun = null;
        let selectedDayun = null;   
        let selectedLiunian = null; 
        let selectedLiuyue = null;
        let selectedLiuri = null;
        let selectedLiushi = null;
        let minggongBarVisible  = false;
        let yuanyunBarVisible = false;
        let dayunBarVisible = false; 
        let liunianBarVisible = false;
        let liuyueBarVisible = false;
        let liuriBarVisible = false;
        let liushiBarVisible = false;
        let isSplitMode = true; 
        // State tracker for collapsible relationship containers (true = collapsed initially)
        let relContainerStates = {
            'stemRelContainer': true,
            'invisibleStemRelContainer': true,
            'invisibleBranchRelContainer': true,
            'relContainer': true
        };

        // Function to handle the expanding/collapsing
        function toggleRelContainer(event, el) {
            // If it is currently expanded, only collapse if the click target is exactly the border/padding
            // This prevents collapsing when the user accidentally clicks on the SVG lines or text.
            if (!el.classList.contains('collapsed')) {
                if (event.target !== el) return;
            }
            
            el.classList.toggle('collapsed');
            relContainerStates[el.id] = el.classList.contains('collapsed');
        } 

        function getElement(char) {
            if (char === "水" || 水.includes(char)) return "水";
            if (char === "火" || 火.includes(char)) return "火";
            if (char === "金" || 金.includes(char)) return "金";
            if (char === "木" || 木.includes(char)) return "木";
            if (char === "土" || 土.includes(char)) return "土";
            return "";
        }

        function getElementColor(char) {
            const dark = isDarkMode();
            if (char === "水" || 水.includes(char)) return dark ? "#66b2ff" : "blue";
            if (char === "火" || 火.includes(char)) return dark ? "#ff6b6b" : "red";
            if (char === "金" || 金.includes(char)) return dark ? "#ffd700" : "#d4af37";
            if (char === "木" || 木.includes(char)) return dark ? "#5cdb95" : "green";
            if (char === "土" || 土.includes(char)) return dark ? "#cd853f" : "brown";
            return dark ? "#e0e0e0" : "#222";
        }

        function getRelColor(color) {
            const dark = isDarkMode();
            if (!dark) {
                if (color === "darkorange") return "#d35400";
                return color;
            }
            if (color === "orange") return "#ffaa33";
            if (color === "darkorange") return "#ff7700";
            if (color === "purple") return "#c77dff";
            if (color === "red") return "#ff6b6b";
            if (color === "brown") return "#cd853f";
            if (color === "blue") return "#66b2ff";
            if (color === "green") return "#5cdb95";
            if (color === "#d4af37") return "#ffd700";
            return color;
        }

        function formatColoredLabel(label, defaultColor) {
            let result = '';
            for (const char of label) {
                const el = getElement(char);
                if (el) {
                    const color = getElementColor(char);
                    result += `<tspan fill="${color}">${char}</tspan>`;
                } else {
                    result += `<tspan fill="${defaultColor}">${char}</tspan>`;
                }
            }
            return result;
        }

        function getBgColor(char) {
            const dark = isDarkMode();
            if (陰.includes(char)) return dark ? "#3a3a3a" : "#d5d5d5";
            return dark ? "#242424" : "#ffffff";
        }

        function calculateTenGod(targetChar, dayMasterChar) {
            const targetEl = getElement(targetChar);
            const dayMasterEl = getElement(dayMasterChar);
            if (!targetEl || !dayMasterEl) return ""; 

            const targetElIdx = five_elements.indexOf(targetEl);
            const relType = relations[dayMasterEl][targetElIdx];

            const sameGender = (陽.includes(targetChar) === 陽.includes(dayMasterChar));

            if (relType === "同我者") {
                return sameGender ? "比肩" : "劫財";
            } else if (relType === "我生者") {
                return sameGender ? "食神" : "傷官";
            } else if (relType === "我剋者") {
                return sameGender ? "偏財" : "正財";
            } else if (relType === "剋我者") {
                return sameGender ? "七殺" : "正官";
            } else if (relType === "生我者") {
                return sameGender ? "偏印" : "正印";
            }
            return "";
        }

        function calculateLifeStage(branchChar, stemChar) {
            const stemEl = getElement(stemChar);
            if (!stemEl) return "";
            const branchIdx = deizi_order.indexOf(branchChar);
            if (branchIdx === -1) return "";
            return tenkan_deizi_rel[stemEl][branchIdx] || "";
        }

        function formatHiddenStemLine(stemChar, dayMasterChar) {
            const god = calculateTenGod(stemChar, dayMasterChar);
            const col = getElementColor(stemChar);
            return `<div class="hidden-stem-line"><span class="stem-char" style="color:${col}">${stemChar}</span><span class="god-text">${god}</span></div>`;
        }

        function findStemRelationships(stems) {
            const results = [];
            const N = stems.length;

            for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        if ((s1 === pair[0] && s2 === pair[1]) || (s1 === pair[1] && s2 === pair[0])) {
                            results.push({
                                label: `${pair[0]}${pair[1]}合`,
                                color: getElementColor(elem),
                                indices: [i, j],
                                active: [true, true],
                                markerType: 'circle'
                            });
                        }
                    }
                }
            }

            for (const [key, pair] of Object.entries(tenkan_relationships["沖"])) {
                const targetStem = pair[0];
                const clasherStem = pair[1];

                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const s1 = stems[i];
                        const s2 = stems[j];

                        if (s1 === targetStem && s2 === clasherStem) {
                            results.push({
                                label: `${clasherStem}沖${targetStem}`,
                                color: "orange",
                                indices: [i, j],
                                active: [true, false],
                                markerType: 'arrow'
                            });
                        } else if (s1 === clasherStem && s2 === targetStem) {
                            results.push({
                                label: `${clasherStem}沖${targetStem}`,
                                color: "orange",
                                indices: [i, j],
                                active: [false, true],
                                markerType: 'arrow'
                            }); 
                        }
                    }
                }
            }

            return results;
        }

        function renderStemRelationships(stems) {
            const container = document.getElementById('stemRelContainer');
            if (!container) return;

            const rels = findStemRelationships(stems);

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'block';

            const N = stems.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 40;
            const totalHeight = rels.length * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            rels.forEach((rel, k) => {
                const yTop = k * layerHeight + 6;
                const yText = yTop + 13;
                const yBar = yTop + 18;
                const yBottom = yTop + 34;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const minX = xCoords[sortedIndices[0]];
                const maxX = xCoords[sortedIndices[sortedIndices.length - 1]];

                let strokeColor = getRelColor(rel.color);

                svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="2" />`;

                rel.indices.forEach((idx, arrIdx) => {
                    const x = xCoords[idx];
                    const isActive = rel.active[arrIdx];

                    if (isActive) {
                        if (rel.markerType === 'circle') {
                            const r = 3.5;
                            svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom - r}" stroke="${strokeColor}" stroke-width="2" />`;
                            svgHtml += `<circle cx="${x}" cy="${yBottom - r}" r="${r}" fill="${strokeColor}" />`;
                        } else {
                            svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom - 5}" stroke="${strokeColor}" stroke-width="2" />`;
                            svgHtml += `<polygon points="${x - 4},${yBottom - 5} ${x},${yBottom} ${x + 4},${yBottom - 5}" fill="${strokeColor}" />`;
                        }
                    } else {
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom}" stroke="${strokeColor}" stroke-width="2" />`;
                    }
                });

                const textX = (minX + maxX) / 2;
                const coloredText = formatColoredLabel(rel.label, strokeColor);
                svgHtml += `<text x="${textX}" y="${yText}" font-size="14" font-weight="700" text-anchor="middle">${coloredText}</text>`;
            });

            svgHtml += `</svg>`;
            container.innerHTML = svgHtml;
        }

        // --- INVISIBLE HEAVENLY STEM RELATIONSHIPS (盲派 暗天干) ---
        function findInvisibleStemRelationships(stems) {  
            const results = [];
            const N = stems.length;
            const seen = new Set();

            const stemHeYinMap = {
                "甲_己": "己", "己_甲": "己",
                "乙_庚": "辛", "庚_乙": "辛",
                "丙_辛": "癸", "辛_丙": "癸",
                "丁_壬": "乙", "壬_丁": "乙",
                "戊_癸": "丁", "癸_戊": "丁"
            };

            const stemChongMap = {
                "甲": "庚", "乙": "辛", "丙": "壬", "丁": "癸", "戊": "甲",
                "己": "乙", "庚": "丙", "辛": "丁", "壬": "戊", "癸": "己"
            };

            // Dynamically build a map for 合 partners from tenkan_relationships["合"]
            const stemHePartnerMap = {};
            if (typeof tenkan_relationships !== "undefined" && tenkan_relationships["合"]) {
                for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                    stemHePartnerMap[pair[0]] = pair[1];
                    stemHePartnerMap[pair[1]] = pair[0];
                }
            }

            // 1. Check adjacent/neighboring stems (distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const s1 = stems[i];
                const s2 = stems[j];
                const idx1 = tenkan_order.indexOf(s1);
                const idx2 = tenkan_order.indexOf(s2);

                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 10) % 10 === 1 || (idx1 - idx2 + 10) % 10 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenStem: null
                            });
                        }
                    }
                }
            }

            // 2. Check pairs of stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const s1 = stems[i];
                    const s2 = stems[j];

                    // Rule: Two identical Heavenly Stems spawn their 合 partner
                    if (s1 === s2 && stemHePartnerMap[s1]) {
                        const partnerStem = stemHePartnerMap[s1];
                        const key = `two_same_${i}_${j}_${partnerStem}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'two_same',
                                indices: [i, j],
                                hiddenStem: partnerStem
                            });
                        }
                    }

                    const idx1 = tenkan_order.indexOf(s1);
                    const idx2 = tenkan_order.indexOf(s2);

                    if (idx1 !== -1 && idx2 !== -1) {
                        // Missing stem in sequence (distance 2)
                        let missingStem = null;
                        if ((idx2 - idx1 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx1 + 1) % 10];
                        } else if ((idx1 - idx2 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx2 + 1) % 10];
                        }

                        if (missingStem) {
                            const key = `missing_${i}_${j}_${missingStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'missing_one',
                                    indices: [i, j],
                                    hiddenStem: missingStem
                                });
                            }
                        }

                        // He-Yin (合化引出) stems
                        const comboKey = `${s1}_${s2}`;
                        if (stemHeYinMap[comboKey]) {
                            const yinStem = stemHeYinMap[comboKey];
                            const key = `he_yin_${i}_${j}_${yinStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'he_yin',
                                    indices: [i, j],
                                    hiddenStem: yinStem
                                });
                            }
                        }
                    }
                }
            }

            // 3. Check three identical stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        const s3 = stems[k];

                        if (s1 === s2 && s2 === s3 && stemChongMap[s1]) {
                            const qishaStem = stemChongMap[s1];
                            const key = `three_same_${i}_${j}_${k}_${qishaStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'three_same',
                                    indices: [i, j, k],
                                    hiddenStem: qishaStem
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

        function renderInvisibleStemRelationships(stems, headers) {
            const container = document.getElementById('invisibleStemRelContainer');
            if (!container) return; 

            let rels = findInvisibleStemRelationships(stems);

            // Filter out any invisible stem relationship involving 命宮
            if (headers) {
                rels = rels.filter(rel => !rel.indices.some(idx => headers[idx] === "命宮"));
            }

            if (isSplitMode && headers) {
                const groupA = ["命宮", "時", "日", "月", "年", "元運"]; 
                const groupB = ["大運", "流年", "流月", "流日", "流時"];
                rels = rels.filter(rel => {
                    const hasA = rel.indices.some(idx => groupA.includes(headers[idx]));
                    const hasB = rel.indices.some(idx => groupB.includes(headers[idx]));
                    return !(hasA && hasB);
                });
            }

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'block';

            const N = stems.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 45;
            const totalHeight = rels.length * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            rels.forEach((rel, k) => {
                const yTop = k * layerHeight + 6;
                const yBar = yTop + 14;
                const yBottom = yTop + 38;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const minX = xCoords[sortedIndices[0]];
                const maxX = xCoords[sortedIndices[sortedIndices.length - 1]];
                const midX = (minX + maxX) / 2;

                const leftStem = stems[sortedIndices[0]];
                const rightStem = stems[sortedIndices[sortedIndices.length - 1]];

                const cLeft = getRelColor(getElementColor(leftStem));
                const cRight = getRelColor(getElementColor(rightStem));

                const gradId = `invStemGrad_${k}`;

                svgHtml += `
                    <defs>
                        <linearGradient id="${gradId}" x1="${minX}" y1="0" x2="${maxX}" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cLeft}" />
                            <stop offset="50%" stop-color="${cRight}" />
                            <stop offset="100%" stop-color="${cRight}" />
                        </linearGradient>
                    </defs>
                `;

                const strokeColor = `url(#${gradId})`;
                const hasHiddenStem = Boolean(rel.hiddenStem && rel.type !== 'neighbor' && rel.type !== 'bond');

                const strokeWidth = hasHiddenStem ? 2 : 3.5;
                const dotRadius = hasHiddenStem ? 3 : 5;

                if (!hasHiddenStem) {
                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;

                    sortedIndices.forEach(idx => {
                        const x = xCoords[idx];
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yBottom}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
                    });
                } else {
                    const boxSize = 26;
                    const boxX = midX - boxSize / 2;
                    const boxY = yBar - boxSize / 2;

                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${boxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                    svgHtml += `<line x1="${boxX + boxSize}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;

                    svgHtml += `<rect x="${boxX}" y="${boxY}" width="${boxSize}" height="${boxSize}" rx="4" ry="4" fill="var(--card-bg)" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;

                    const hiddenCol = getRelColor(getElementColor(rel.hiddenStem));

                    // Apply 合化 toggle logic
                    let displayText = rel.hiddenStem;
                    let displayColor = hiddenCol;

                    if (!isHeHuaEnabled && rel.type === 'he_yin') {
                        displayText = "合";
                        displayColor = isDarkMode() ? "#e0e0e0" : "#222"; 
                    }

                    // Disable triggerArrows when displaying "合"
                    const clickHandler = (displayText === "合") 
                        ? "event.stopPropagation();" 
                        : `event.stopPropagation(); triggerArrows(this, '${rel.hiddenStem}')`;

                    svgHtml += `<text class="spawned-stem" x="${midX}" y="${yBar + 6}" font-size="16" font-weight="700" text-anchor="middle" fill="${displayColor}" onclick="${clickHandler}">${displayText}</text>`;
                    
                    sortedIndices.forEach(idx => { 
                        const x = xCoords[idx];

        // --- INVISIBLE EARTHLY BRANCH RELATIONSHIPS (盲派 暗拱/暗夾) ---
        function findInvisibleBranchRelationships(branches) {
            const results = [];
            const N = branches.length;
            const seen = new Set();

            const sanHeGong = {
                "子": ["申", "辰"],
                "酉": ["巳", "丑"],
                "午": ["寅", "戌"],
                "卯": ["亥", "未"]
            };

            const sixRelPairs = [
                ["子", "丑"], ["寅", "亥"], ["卯", "戌"],
                ["酉", "辰"], ["巳", "申"], ["午", "未"]
            ];
            function getSixRelPartner(b) {
                for (const pair of sixRelPairs) {
                    if (pair[0] === b) return pair[1];
                    if (pair[1] === b) return pair[0];
                }
                return null;
            }

            const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    for (const [targetHidden, pair] of Object.entries(sanHeGong)) {
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }

                    if (b1 === b2) {
                        const partner = getSixRelPartner(b1);
                        if (partner) {
                            const key = `${i}_${j}_${partner}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: partner,
                                    color: getElementColor(partner)
                                });
                            }
                        }
                    }

                    const idx1 = zhiOrder.indexOf(b1);
                    const idx2 = zhiOrder.indexOf(b2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        if ((idx2 - idx1 + 12) % 12 === 2) {
                            const hiddenIdx = (idx1 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        } else if ((idx1 - idx2 + 12) % 12 === 2) {
                            const hiddenIdx = (idx2 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

        function renderInvisibleBranchRelationships(branches, headers) {

        function findBranchRelationships(branches) {
            const results = [];
            const N = branches.length;

            const categories = [
                { name: "會", dict: 三會 },
                { name: "合", dict: 三合 }
            ];

            for (const cat of categories) {
                for (const [elem, targetChars] of Object.entries(cat.dict)) {
                    const foundTriplets = [];
                    for (let i = 0; i < N; i++) {
                        for (let j = i + 1; j < N; j++) {
                            for (let k = j + 1; k < N; k++) {
                                const set = new Set([branches[i], branches[j], branches[k]]);
                                if (targetChars.every(c => set.has(c))) {
                                    foundTriplets.push([i, j, k]);
                                }
                            }
                        }
                    }

                    if (foundTriplets.length > 0) {
                        for (const triplet of foundTriplets) {
                            results.push({
                                label: `三${cat.name}${elem}局`,
                                color: getElementColor(elem),
                                indices: triplet,
                                active: [true, true, true],
                                markerType: 'circle'
                            });
                        }
                    } else {
                        for (let i = 0; i < N; i++) {
                            for (let j = i + 1; j < N; j++) {
                                const b1 = branches[i];
                                const b2 = branches[j];
                                if (b1 !== b2 && targetChars.includes(b1) && targetChars.includes(b2)) {
                                    results.push({
                                        label: `半${cat.name}${elem}局`,
                                        color: getElementColor(elem),
                                        indices: [i, j],
                                        active: [true, true],
                                        markerType: 'circle'
                                    });
                                }
                            }
                        }
                    }
                }
            }

            for (const [elem, pair] of Object.entries(six_rel["合"])) {
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const b1 = branches[i];
                        const b2 = branches[j];
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {
                            const isFireEarth = (elem === "火土");
                            results.push({
                                label: `${pair[0]}${pair[1]}化${elem}`,
                                color: isFireEarth ? "fireEarth" : getElementColor(elem),
                                isFireEarth: isFireEarth,
                                indices: [i, j],
                                active: [true, true],
                                markerType: 'circle'
                            });
                        }
                    }
                }
            }

            for (const [key, pair] of Object.entries(six_rel["沖"])) {
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const b1 = branches[i];
                        const b2 = branches[j];
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {
                            results.push({
                                label: `${pair[0]}${pair[1]}相沖`,
                                color: "darkorange",
                                indices: [i, j],
                                active: [true, true],
                                markerType: 'arrow'
                            });
                        }
                    }
                }
            }

            for (const [name, targetChars] of Object.entries(三刑)) {
                const foundTriplets = [];
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        for (let k = j + 1; k < N; k++) {
                            const set = new Set([branches[i], branches[j], branches[k]]);
                            if (targetChars.every(c => set.has(c))) {
                                foundTriplets.push([i, j, k]);
                            }
                        }
                    }
                }

                if (foundTriplets.length > 0) {
                    for (const triplet of foundTriplets) {
                        results.push({
                            label: `${name}(三刑)`,
                            color: "purple",
                            indices: triplet,
                            active: [true, true, true],
                            markerType: 'arrow'
                        });
                    }
                } else {
                    for (let i = 0; i < N; i++) {
                        for (let j = i + 1; j < N; j++) {
                            const b1 = branches[i];
                            const b2 = branches[j];
                            if (b1 !== b2 && targetChars.includes(b1) && targetChars.includes(b2)) {
                                let act1 = false;
                                let act2 = false;
                                if (punishMap[b1] === b2) {
                                    act2 = true;
                                } else if (punishMap[b2] === b1) {
                                    act1 = true;
                                } else {
                                    act1 = true;
                                    act2 = true;
                                }
                                results.push({
                                    label: name,
                                    color: "purple",
                                    indices: [i, j],
                                    active: [act1, act2],
                                    markerType: 'arrow'
                                });
                            }
                        }
                    }
                }
            }

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    if ((b1 === "子" && b2 === "卯") || (b1 === "卯" && b2 === "子")) {
                        results.push({
                            label: "無禮之刑",
                            color: "purple",
                            indices: [i, j],
                            active: [true, true],
                            markerType: 'arrow'
                        });

                }
            }

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    if (b1 === b2 && 自刑.includes(b1)) {

                            indices: [i, j],
                            active: [true, true],
                            markerType: 'arrow'
                        });
                    }
                }
            }

            return results;
        }

        function getLiunianList(dayunIdx) {
            if (!currentBaziData || !currentBaziData.big_start_time) return [];
            const times = currentBaziData.big_start_time;
            if (!times[dayunIdx]) return [];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            const tStart = times[dayunIdx];
            let curYear = tStart[0];
            const startAns = p.GetInfo(sex, curYear, 6, 1, 12, 0, 0);
            if (!startAns || !startAns.bazi) return [];

            let curStem = startAns.bazi[0];
            let curBranch = startAns.bazi[1];

            let endStem = null, endBranch = null;
            if (dayunIdx < times.length - 1 && times[dayunIdx + 1]) {
                const tEnd = times[dayunIdx + 1];
                const endAns = p.GetInfo(sex, tEnd[0], tEnd[1], tEnd[2], tEnd[3], 0, 0);
                if (endAns && endAns.bazi) {
                    endStem = endAns.bazi[0];
                    endBranch = endAns.bazi[1];
                }
            }

            const list = [];
            let sIdx = tenkan_order.indexOf(curStem);
            let bIdx = deizi_order.indexOf(curBranch);

            if (sIdx === -1 || bIdx === -1) return [];

            for (let i = 0; i < 15; i++) {
                const s = tenkan_order[(sIdx + i) % 10];
                const b = deizi_order[(bIdx + i) % 12];
                const y = curYear + i;

                list.push({ year: y, stem: s, branch: b });

                if (endStem && endBranch && s === endStem && b === endBranch) {
                    break;
                }
                if (!endStem && i === 9) {
                    break;
                }
            }
            return list;
        }

            const liunianList = getLiunianList(dayunIdx);
            if (!liunianList[liunianIdx]) return null;
            const target = liunianList[liunianIdx];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let d = new Date(target.year, 1, 1, 0, 0, 0);
            for (let h = 0; h < 30 * 24; h++) {
                let y = d.getFullYear();
                let m = d.getMonth() + 1;
                let day = d.getDate();
                let hr = d.getHours();

                let ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                if (ans && ans.bazi && ans.bazi[0] === target.stem && ans.bazi[1] === target.branch) {
                    return [y, m, day, hr];
                }
                d.setHours(d.getHours() + 1);
            }
            return [target.year, 2, 4, 0];
        }

        function getLiuyueList(dayunIdx, liunianIdx) {
            const startTime = getLiunianStartTime(dayunIdx, liunianIdx);
            if (!startTime) return [];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let curDate = new Date(startTime[0], startTime[1] - 1, startTime[2], startTime[3], 0, 0);

            let y = curDate.getFullYear();
            let m = curDate.getMonth() + 1;
            let day = curDate.getDate();
            let hr = curDate.getHours();

            let startAns = p.GetInfo(sex, y, m, day, hr, 0, 0);
            if (!startAns || !startAns.bazi) return [];

            const targetYearStem = startAns.bazi[0];
            let prevMonthStem = startAns.bazi[2];
            let prevMonthBranch = startAns.bazi[3];

            const list = [];

            function toOddHour(hour) {
                if (hour % 2 === 0) {
                    return hour === 0 ? 23 : hour - 1;
                }
                return hour;
            }

            const initHour = toOddHour(hr);
            const initTimeStr = String(initHour).padStart(2, '0') + ':00';
            list.push({
                date: `${monthNames[m - 1]} ${day}.`,
                timeStr: initTimeStr,
                stem: prevMonthStem,
                branch: prevMonthBranch,
                startDate: [y, m, day, hr]
            });

            let safetyCounter = 0;
            while (safetyCounter < 20) {
                safetyCounter++;

                if (curDate.getDate() > 9) {
                    curDate.setMonth(curDate.getMonth() + 1);
                    curDate.setDate(2);
                    curDate.setHours(0, 0, 0, 0);
                }

                let foundNextMonth = false;

                while (true) {
                    let cy = curDate.getFullYear();
                    let cm = curDate.getMonth() + 1;
                    let cd = curDate.getDate();
                    let ch = curDate.getHours();

                    let ans = p.GetInfo(sex, cy, cm, cd, ch, 0, 0);
                    if (!ans || !ans.bazi) {
                        foundNextMonth = false;
                        break;
                    }

                    if (ans.bazi[0] !== targetYearStem) {
                        return list;
                    }

                    if (ans.bazi[2] !== prevMonthStem || ans.bazi[3] !== prevMonthBranch) {
                        prevMonthStem = ans.bazi[2];
                        prevMonthBranch = ans.bazi[3];

                        const displayHour = toOddHour(ch);
                        const displayDate = (ch === 0) ? `${monthNames[cm - 1]} ${cd - 1}.` : `${monthNames[cm - 1]} ${cd}.`;
                        const changeTimeStr = String(displayHour).padStart(2, '0') + ':00';

                        p.GetInfo(sex, cy, cm, cd, ch, 0, 0);

                        list.push({
                            date: displayDate,
                            timeStr: changeTimeStr,
                            stem: prevMonthStem,
                            branch: prevMonthBranch,
                            startDate: [cy, cm, cd, ch]
                        });
                        foundNextMonth = true;
                        break;
                    }

                    curDate.setHours(curDate.getHours() + 1);

                    if (curDate.getDate() > 9) {
                        curDate.setMonth(curDate.getMonth() + 1);
                        curDate.setDate(2);
                        curDate.setHours(0, 0, 0, 0);
                    }
                }

                if (!foundNextMonth) break;
            }

            return list;
        }

        function selectLiuyue(index) {
            if (!selectedDayun || !selectedLiunian) return;
            const liuyueList = getLiuyueList(selectedDayun.index, selectedLiunian.index);

        function getLiuriList(dayunIdx, liunianIdx, liuyueIdx) {
            const liuyueList = getLiuyueList(dayunIdx, liunianIdx);
            if (!liuyueList[liuyueIdx]) return [];

            const monthItem = liuyueList[liuyueIdx];
            let startT = monthItem.startDate;
            if (!startT) return [];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let curDate = new Date(startT[0], startT[1] - 1, startT[2], startT[3], 0, 0);

            const initialMonthStem = monthItem.stem;
            const initialMonthBranch = monthItem.branch;

            let prevDayStem = null;
            let prevDayBranch = null;

            const list = [];
            let lastHeaderMonth = null;
            let lastHeaderDay = null;

            let safetyHours = 0;
            while (safetyHours < 40 * 24) {
                safetyHours += 2;

                let y = curDate.getFullYear();
                let m = curDate.getMonth() + 1;
                let day = curDate.getDate();
                let hr = curDate.getHours();

                let ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                if (!ans || !ans.bazi) break;

                if (ans.bazi[2] !== initialMonthStem || ans.bazi[3] !== initialMonthBranch) {
                    break;
                }

                let curDayStem = ans.bazi[4];
                let curDayBranch = ans.bazi[5];

                if (prevDayStem === null) {
                    prevDayStem = curDayStem;
                    prevDayBranch = curDayBranch;
                    lastHeaderMonth = m;
                    lastHeaderDay = day;

                    let oddHr = (hr % 2 === 0) ? (hr === 0 ? 23 : hr - 1) : hr;
                    let timeStr = String(oddHr).padStart(2, '0') + ':00';
                    let dateStr = `${monthNames[m - 1]} ${getOrdinalDay(day)}`;

                    list.push({
                        date: dateStr,
                        timeStr: timeStr,
                        stem: curDayStem,
                        branch: curDayBranch,
                        startDate: [y, m, day, hr]
                    });
                } else if (curDayStem !== prevDayStem || curDayBranch !== prevDayBranch) {
                    prevDayStem = curDayStem;
                    prevDayBranch = curDayBranch;

                    let oddHr = (hr % 2 === 0) ? (hr === 0 ? 23 : hr - 1) : hr;
                    let timeStr = String(oddHr).padStart(2, '0') + ':00';
                    let dateStr = "";

                    if (m !== lastHeaderMonth) {
                        dateStr = `${monthNames[m - 1]} ${getOrdinalDay(day)}`;
                        lastHeaderMonth = m;
                        lastHeaderDay = day;
                    } else if (day !== lastHeaderDay) {
                        dateStr = `${getOrdinalDay(day)}`;
                        lastHeaderDay = day;
                    }

                    list.push({
                        date: dateStr,
                        timeStr: timeStr,
                        stem: curDayStem,
                        branch: curDayBranch,
                        startDate: [y, m, day, hr]
                    });
                }

                curDate.setHours(curDate.getHours() + 2);
            }

            return list;
        }

        function selectLiuri(index) {
            if (!selectedDayun || !selectedLiunian || !selectedLiuyue) return;
            const liuriList = getLiuriList(selectedDayun.index, selectedLiunian.index, selectedLiuyue.index);

        function getLiushiList(dayunIdx, liunianIdx, liuyueIdx, liuriIdx) {
            const liuriList = getLiuriList(dayunIdx, liunianIdx, liuyueIdx);
            if (!liuriList[liuriIdx]) return [];

            const dayItem = liuriList[liuriIdx];
            let startT = dayItem.startDate;
            if (!startT) return [];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let curDate = new Date(startT[0], startT[1] - 1, startT[2], startT[3], 0, 0);

            let startHr = curDate.getHours();
            if (startHr % 2 === 0) {
                let oddHr = (startHr === 0) ? 23 : startHr - 1;
                if (oddHr === 23) {
                    curDate.setDate(curDate.getDate() - 1);
                }
                curDate.setHours(oddHr);
            }

            const targetDayStem = dayItem.stem;
            const targetDayBranch = dayItem.branch;

            const list = [];
            let prevDay = null;

            for (let i = 0; i < 12; i++) {
                let y = curDate.getFullYear();
                let m = curDate.getMonth() + 1;
                let day = curDate.getDate();
                let hr = curDate.getHours();

                let ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                if (!ans || !ans.bazi) break;

                if (ans.bazi[4] !== targetDayStem || ans.bazi[5] !== targetDayBranch) {
                    if (i === 0) {
                        curDate = new Date(startT[0], startT[1] - 1, startT[2], startT[3], 0, 0);
                        y = curDate.getFullYear();
                        m = curDate.getMonth() + 1;
                        day = curDate.getDate();
                        hr = curDate.getHours();
                        ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                        if (!ans || !ans.bazi || ans.bazi[4] !== targetDayStem || ans.bazi[5] !== targetDayBranch) {
                            break;
                        }
                    } else {
                        break;
                    }
                }

                let timeStem = ans.bazi[6];
                let timeBranch = ans.bazi[7];

                let timeStr = String(hr).padStart(2, '0') + ':00';
                let dateStr = "";

                if (prevDay !== null && day !== prevDay) {
                    dateStr = `${monthNames[m - 1]} ${getOrdinalDay(day)}`;
                }
                prevDay = day;

                list.push({
                    date: dateStr,
                    timeStr: timeStr,
                    stem: timeStem,
                    branch: timeBranch,
                    startDate: [y, m, day, hr]
                });

                curDate.setHours(curDate.getHours() + 2);
            }

            return list;
        }

        function selectLiushi(index) {

            const liushiList = getLiushiList(selectedDayun.index, selectedLiunian.index, selectedLiuyue.index, selectedLiuri.index);
            if (!liushiList[index]) return;

        function selectNow() {
            if (!currentBaziData || !currentBaziData.bigList || currentBaziData.bigList.length === 0) return;

            const now = new Date();

            dayunBarVisible = true;
            renderDayunBar();

            const times = currentBaziData.big_start_time || [];
            let dayunIdx = -1;
            for (let i = 0; i < times.length; i++) {
                const t = times[i];
                if (t && t.length >= 4) {
                    const d = new Date(t[0], t[1] - 1, t[2], t[3]);
                    if (now >= d) {
                        dayunIdx = i;
                    } else {
                        break;
                    }
                }
            }

            if (dayunIdx === -1) dayunIdx = 0;
            selectDayun(dayunIdx);

            const liunianList = getLiunianList(dayunIdx);
            let liunianIdx = -1;
            for (let j = 0; j < liunianList.length; j++) {
                const st = getLiunianStartTime(dayunIdx, j);
                if (st) {
                    const d = new Date(st[0], st[1] - 1, st[2], st[3]);
                    if (now >= d) {
                        liunianIdx = j;
                    } else {
                        break;
                    }
                }
            }

            if (liunianIdx === -1) liunianIdx = 0;
            selectLiunian(liunianIdx);

            const liuyueList = getLiuyueList(dayunIdx, liunianIdx);
            let liuyueIdx = -1;
            for (let k = 0; k < liuyueList.length; k++) {
                const st = liuyueList[k].startDate;
                if (st) {
                    const d = new Date(st[0], st[1] - 1, st[2], st[3]);
                    if (now >= d) {
                        liuyueIdx = k;
                    } else {
                        break;
                    }
                }
            }

            if (liuyueIdx === -1) liuyueIdx = 0;
            selectLiuyue(liuyueIdx);

            const liuriList = getLiuriList(dayunIdx, liunianIdx, liuyueIdx);
            let liuriIdx = -1;
            for (let l = 0; l < liuriList.length; l++) {
                const st = liuriList[l].startDate;
                if (st) {
                    const d = new Date(st[0], st[1] - 1, st[2], st[3]);
                    if (now >= d) {
                        liuriIdx = l;
                    } else {
                        break;
                    }
                }
            }

            if (liuriIdx === -1) liuriIdx = 0;
            selectLiuri(liuriIdx);

            const liushiList = getLiushiList(dayunIdx, liunianIdx, liuyueIdx, liuriIdx);
            let liushiIdx = -1;
            for (let m = 0; m < liushiList.length; m++) {
                const st = liushiList[m].startDate;
                if (st) {
                    const d = new Date(st[0], st[1] - 1, st[2], st[3]);
                    if (now >= d) {
                        liushiIdx = m;
                    } else {
                        break;
                    }
                }
            }

            if (liushiIdx === -1) liushiIdx = 0;
            selectLiushi(liushiIdx);
        }

        function getFilteredYuanYunOptions() {
            const yearSelect = document.getElementById('yearSelect');
            const yr = parseInt(yearSelect.value, 10);

            // Dynamically find the active 60-year cycle start year
            let activeCycleYear = -Infinity;
            yuanYunOptions.forEach(item => {
                const itemY = parseInt(item.year, 10);
                if (itemY <= yr && itemY > activeCycleYear) {
                    activeCycleYear = itemY;
                }
            });

            // Fallback in case a year before 1564 is selected
            if (activeCycleYear === -Infinity) {
                activeCycleYear = parseInt(yuanYunOptions[0].year, 10);
            }

            // Return all options from the active cycle onwards
            return yuanYunOptions.filter(item => parseInt(item.year, 10) >= activeCycleYear);
        }

        function drawXAnimation(element) {

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line1.setAttribute("x1", cx - size);
            line1.setAttribute("y1", cy - size);
            line1.setAttribute("x2", cx + size);
            line1.setAttribute("y2", cy + size);
            line1.setAttribute("stroke", "#ff4d4f");
            line1.setAttribute("stroke-width", "3.5");
            line1.setAttribute("stroke-linecap", "round");

            const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line2.setAttribute("x1", cx + size);
            line2.setAttribute("y1", cy - size);
            line2.setAttribute("x2", cx - size);
            line2.setAttribute("y2", cy + size);
            line2.setAttribute("stroke", "#ff4d4f");
            line2.setAttribute("stroke-width", "3.5");
            line2.setAttribute("stroke-linecap", "round");

            g.appendChild(line1);
            g.appendChild(line2);
            canvas.appendChild(g);

            g.style.transformOrigin = `${cx}px ${cy}px`;
            g.animate([
                { transform: 'scale(0.3) rotate(-10deg)', opacity: 0 },

                { transform: 'scale(1.0) rotate(0deg)', opacity: 1, offset: 0.7 },
                { transform: 'scale(0.9) rotate(0deg)', opacity: 0 }

            });

        function createArrow(fromElem, toElem, color, markerId, isBiDirectional = false) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return false;

            // Prevent any arrow from pointing to or originating from "合"
            if ((fromElem && fromElem.textContent.trim() === '合') || (toElem && toElem.textContent.trim() === '合')) {
                return false;
            }

            const startRect = fromElem.getBoundingClientRect();
            const endRect = toElem.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0 || endRect.width === 0 || endRect.height === 0) return false;

            const startX = startRect.left + (startRect.width / 2);
            const startY = startRect.top + (startRect.height / 2);
            const endX = endRect.left + (endRect.width / 2);
            const endY = endRect.top + (endRect.height / 2);

            const isMainBranch = fromElem.classList.contains('main-pillar-branch') || fromElem.classList.contains('main-pillar-stem');
            const startOffsetRadius = isMainBranch ? 35 : 12;
            const endOffsetRadius = toElem.classList.contains('main-pillar-branch') || toElem.classList.contains('main-pillar-stem') ? 35 : 12;

            const dx = endX - startX;
            const dy = endY - startY;
            const distance = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            if (distance <= (startOffsetRadius + endOffsetRadius)) return false;

            const adjustedStartX = startX + Math.cos(angle) * startOffsetRadius;
            const adjustedStartY = startY + Math.sin(angle) * startOffsetRadius;
            const adjustedEndX = endX - Math.cos(angle) * endOffsetRadius;
            const adjustedEndY = endY - Math.sin(angle) * endOffsetRadius;

            const adjustedDistance = Math.hypot(adjustedEndX - adjustedStartX, adjustedEndY - adjustedStartY);

            // 1. Wrap in a <g> container
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", adjustedStartX);
            line.setAttribute("y1", adjustedStartY);
            line.setAttribute("x2", adjustedEndX);
            line.setAttribute("y2", adjustedEndY);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "2.5");
            
            line.style.strokeDasharray = adjustedDistance;
            line.style.strokeDashoffset = adjustedDistance;

            group.appendChild(line);
            canvas.appendChild(group);

            // 2. Animate line drawing
            const drawAnim = line.animate([
                { strokeDashoffset: adjustedDistance },
                { strokeDashoffset: 0 }
            ], { duration: 600, easing: 'ease-out', fill: 'forwards' });

            // 3. Dynamically attach arrowhead once draw finishes
            drawAnim.onfinish = () => {
                line.setAttribute("marker-end", `url(#${markerId})`);
                if (isBiDirectional) {
                    line.setAttribute("marker-start", `url(#${markerId})`);
                }
            };

            // 4. Animate opacity on the GROUP (<g>) so line and marker fade out together
            group.animate([
                { opacity: 1 },
                { opacity: 0 }
            ], { duration: 500, delay: 1500, easing: 'ease-out', fill: 'forwards' });

            // 5. Remove the entire group node from DOM
            setTimeout(() => group.remove(), 2100);
            return true;
        } 

        function drawXingArrows(sourceElement, char) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            // 1. Find elements that the clicked character punishes (Outgoing)
            const targets = xingMap[char] || [];
            
            // 2. Find elements that punish the clicked character (Incoming)
            const sources = Object.keys(xingMap).filter(key => xingMap[key].includes(char));

            // Exit if the character doesn't trigger any 刑 relationship
            if (targets.length === 0 && sources.length === 0) { 
                return;
            }

            // Target elements in the Bazi grid and toggled SVG sections
            const querySelectors = '.bazi-square, .bazi-rect, .stem-char, text.spawned-branch, text.spawned-stem, .main-pillar-branch, .time-pillar-branch';
            const allNodes = document.querySelectorAll(querySelectors);
            
            let arrowsDrawnCount = 0;

            allNodes.forEach(node => {
                // Prevent drawing an arrow to the exact same element clicked
                if (node === sourceElement) return; 
                
                const textContent = (node.textContent || node.innerText).trim();
                
                // Outgoing Relationship: Draw arrow from clicked element to node
                if (targets.some(t => textContent.includes(t))) {
                    if (createArrow(sourceElement, node, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }

                // Incoming Relationship: Draw arrow from node to clicked element
                if (sources.some(s => textContent.includes(s))) {
                    if (createArrow(node, sourceElement, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }
            });
        } // ok 

        function triggerDizhiArrows(clickedElement, sourceChar) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            const targetChongChar = chongDict[sourceChar];
            
            // Select all Earthly Branch elements (main pillars + spawned/time pillars)
            const possibleTargets = document.querySelectorAll('.main-pillar-branch, #invisibleBranchRelContainer text.spawned-branch, .time-pillar-branch');
            let arrowsDrawnCount = 0;

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();

                // 沖 (Clash): Draw a bidirectional orange arrow between source and target
                if (targetChongChar && targetText === targetChongChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-chong", true)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // Draw X animation if no clash partner exists on screen
            if (arrowsDrawnCount === 0) {
                drawXAnimation(clickedElement);
            }
        }

        function triggerArrows(clickedElement, sourceChar) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            // Do nothing if the clicked element itself is "合"
            if (clickedElement && clickedElement.textContent.trim() === '合') {

            const sourceQiShaChar = qiShaDict[sourceChar];

                    }

                        arrowsDrawnCount++;
                    }
                }
            });

            if (arrowsDrawnCount === 0) {
                drawXAnimation(clickedElement);
            }
        }
