    <script>
        /**
         * Headlessly calculates and logs 24 Solar Terms and Moon Phases to Console
         * @param {number} targetYear 
         */ 
        function logSunAndMoonToConsole(targetYear) {
            if (typeof submitYear !== 'function') {
                console.warn("sunMoon_c.js is not loaded yet.");
                return;
            }

            const hiddenYearInput = document.getElementById('year');
            const yContent = document.getElementById('ycontent');
            if (!hiddenYearInput || !yContent) return;

            // 1. Set the year and trigger the astronomical calculator
            hiddenYearInput.value = targetYear;
            try {
                submitYear(2); // 2 = Simplified Chinese
            } catch (e) {
                console.error("Astronomical calculation error:", e);
                return;
            }

            // 2. Parse the generated tables from memory
            const tables = yContent.querySelectorAll('table');
            if (tables.length < 2) return;

            // --- Table 1: 月相 (Moon Phases) ---
            const moonPhases = [];
            const moonRows = tables[0].querySelectorAll('tr');
            const moonHeaders = ['朔 (新月)', '上弦', '望 (满月)', '下弦'];

            for (let i = 1; i < moonRows.length; i++) {
                const cells = moonRows[i].children;
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    // Skip empty/colspan placeholder cells
                    if (cell.hasAttribute('colspan')) continue;

                    const text = cell.innerText.trim();
                    if (text) {
                        const parts = text.split('\n');
                        moonPhases.push({
                            '月相': moonHeaders[c] || '月相',
                            '公历时刻': parts[0].replace(/,/g, ''),
                            '交食备注': parts[1] || '无'
                        });
                    }
                }
            }

            // --- Table 2: 二十四节气 (24 Solar Terms) ---
            const solarTerms = [];
            const solarRows = tables[1].querySelectorAll('tr');

            for (let i = 1; i < solarRows.length; i++) {
                const tds = solarRows[i].querySelectorAll('td');
                // Left Column: tds[0] = Name, tds[1] = Time
                if (tds[0] && tds[1] && tds[0].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[0].innerText.trim(),
                        '时刻 (UTC+8)': tds[1].innerText.trim()
                    });
                }
                // Right Column: tds[3] = Name, tds[4] = Time
                if (tds[3] && tds[4] && tds[3].innerText.trim()) {
                    solarTerms.push({
                        '节气': tds[3].innerText.trim(),
                        '时刻 (UTC+8)': tds[4].innerText.trim()
                    });
                }
            }

            // 3. Print out to DevTools Console
            console.group(`🌟 公元 ${targetYear} 年 月相与二十四节气时刻表`);
            
            console.log(`%c【二十四节气】 (${targetYear})`, "color: #2b8a3e; font-weight: bold; font-size: 13px;");
            console.table(solarTerms);

            console.log(`%c【月相与日月食】 (${targetYear})`, "color: #1971c2; font-weight: bold; font-size: 13px;");
            console.table(moonPhases);

            console.groupEnd();
        }

        // Toggle state for 命宮
        let isMinggongActive = false; 
        let isHeHuaEnabled = false; 

        // --- ADD THESE NEW VARIABLES AND FUNCTIONS FOR 胎元 ---
        let isTaiyuanActive = false;
        let taiyuanBarVisible = false;

        // Active popups map so we can reset timers if summoned repeatedly
        const activeBranchPopups = new Map();

        // Helper: Get ONLY the first (primary / 本氣) hidden stem of a branch
        function getBranchPrimaryStem(branchChar) {
            const stems = deizi_hidden_tenkan[branchChar];
            return (stems && stems.length > 0) ? stems[0] : null;
        } 

        function spawnBranchHiddenPopup(branchElem, branchChar) {
            const primaryStem = getBranchPrimaryStem(branchChar);
            if (!branchElem || !primaryStem) return null; 

            // 1. Prevent spawning if the invisible branch container is collapsed or hidden
            const container = branchElem.closest('.bazi-rel-container');
            if (container && (container.classList.contains('collapsed') || container.style.display === 'none')) {
                return null;
            }

            // 2. Prevent spawning if the branch element is not rendered on screen (avoid (0,0) top-left bug)
            const rect = branchElem.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) {
                return null;
            }

            // If already active, refresh the 3-second timer
            if (activeBranchPopups.has(branchElem)) {
                const existing = activeBranchPopups.get(branchElem);
                clearTimeout(existing.timer);
                clearTimeout(existing.fadeTimer);
                existing.popup.classList.remove('fading');
                
                existing.fadeTimer = setTimeout(() => existing.popup.classList.add('fading'), 2600);
                existing.timer = setTimeout(() => {
                    existing.popup.remove();
                    activeBranchPopups.delete(branchElem);
                }, 3000);
                return existing;
            }

            const popup = document.createElement('div');
            popup.className = 'branch-hidden-popup';
            popup.style.left = `${rect.left + rect.width / 2}px`;
            popup.style.top = `${rect.bottom + 6}px`;
            popup.style.transform = 'translateX(-50%)';

            const divider = document.createElement('div');
            divider.className = 'popup-divider';
            popup.appendChild(divider);

            const stemList = document.createElement('div');
            stemList.className = 'popup-stems';

            const stemElements = {};

            // ONLY display the single first hidden stem!
            const span = document.createElement('span');
            span.className = 'stem-char popup-stem';
            span.style.color = getElementColor(primaryStem);
            span.textContent = primaryStem;
            span.onclick = function(e) {
                e.stopPropagation();
                triggerArrows(this, primaryStem, branchElem);
            };
            stemList.appendChild(span);
            stemElements[primaryStem] = span;

            popup.appendChild(stemList);
            document.body.appendChild(popup);

            // 3-second timer with smooth fade out
            const fadeTimer = setTimeout(() => popup.classList.add('fading'), 2600);
            const timer = setTimeout(() => {
                popup.remove();
                activeBranchPopups.delete(branchElem);
            }, 3000);

            const popupData = { popup, stemElements, primaryStem, timer, fadeTimer };
            activeBranchPopups.set(branchElem, popupData);

            return popupData;
        }

        function toggleBranchHiddenStems(branchElem, branchChar) {
            const invBranchContainer = document.getElementById('invisibleBranchRelContainer');
            if (invBranchContainer && (invBranchContainer.classList.contains('collapsed') || invBranchContainer.style.display === 'none')) {
                return 0;  
            }

            const popupData = spawnBranchHiddenPopup(branchElem, branchChar);
            if (!popupData) return 0; 

            const primaryStem = popupData.primaryStem;
            const hElem = popupData.stemElements[primaryStem];
            if (!hElem) return 0;

            const targetPianCai = pianCaiDict[primaryStem];
            const sourceQiSha = qiShaDict[primaryStem];
            let popupArrowsCount = 0;

            // 1. Search Bottom Tenkans (ONLY Row 1 / First-level tenkans, NEVER Row 2!)
            const bottomStems = document.querySelectorAll('[id^="rect_h_r1"] .stem-char');
            bottomStems.forEach(bElem => {
                const bChar = bElem.textContent.trim();
                if (bChar === '合') return;

                // 偏財: Popup stem -> Bottom Row 1 stem (Orange)
                if (targetPianCai && bChar === targetPianCai) {
                    if (createArrow(hElem, bElem, "orange", "arrowhead-piancai")) {
                        popupArrowsCount++;
                    }
                }
                // 七殺: Bottom Row 1 stem -> Popup stem (Greenish-Yellow)
                if (sourceQiSha && bChar === sourceQiSha) {
                    if (createArrow(bElem, hElem, "#adff2f", "arrowhead-qisha")) {
                        popupArrowsCount++;
                    }
                }
            });

            // 2. Search OTHER Invisible Branches (Popup <-> Popup interaction!)
            const allInvisibleBranches = document.querySelectorAll('#invisibleBranchRelContainer text.spawned-branch');
            allInvisibleBranches.forEach(otherBranchElem => {
                if (otherBranchElem === branchElem) return; // Don't self-connect

                const otherBChar = otherBranchElem.textContent.trim();
                const otherPrimaryStem = getBranchPrimaryStem(otherBChar);
                if (!otherPrimaryStem) return;

                const isPianCai = (targetPianCai && otherPrimaryStem === targetPianCai);
                const isQiSha = (sourceQiSha && otherPrimaryStem === sourceQiSha);

                if (isPianCai || isQiSha) {
                    // Summon the other popup!
                    const otherPopup = spawnBranchHiddenPopup(otherBranchElem, otherBChar);
                    if (otherPopup && otherPopup.stemElements[otherPrimaryStem]) {
                        const otherHElem = otherPopup.stemElements[otherPrimaryStem];

                        // 偏財: this popup -> other popup (Orange)
                        if (isPianCai) {
                            if (createArrow(hElem, otherHElem, "orange", "arrowhead-piancai")) {
                                popupArrowsCount++;
                            }
                        }
                        // 七殺: other popup -> this popup (Greenish-Yellow)
                        if (isQiSha) {
                            if (createArrow(otherHElem, hElem, "#adff2f", "arrowhead-qisha")) {
                                popupArrowsCount++;
                            }
                        }
                    }
                }
            });

            return popupArrowsCount;
        }

        function calculateTaiyuan() {  
            if (!currentBaziData) return null;

            const monthStem = currentBaziData.C;
            const monthBranch = currentBaziData.D;

            // Return null if month data is somehow missing
            if (!monthStem || !monthBranch) return null;

            const stemIdx = tenkan_order.indexOf(monthStem);
            const branchIdx = deizi_order.indexOf(monthBranch);

            if (stemIdx === -1 || branchIdx === -1) return null;

            // Heavenly Stem + 1, Earthly Branch + 3
            const tStem = tenkan_order[(stemIdx + 1) % 10];
            const tBranch = deizi_order[(branchIdx + 3) % 12];

            return { stem: tStem, branch: tBranch };
        }

        function removeTaiyuan() {
            isTaiyuanActive = false;
            renderTaiyuanBar();
            renderGrid();
        }

        function renderTaiyuanBar() {
            const bar = document.getElementById('taiyuanBar');
            if (!bar) return;

            if (!taiyuanBarVisible) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML = '';

            const ty = calculateTaiyuan();
            if (!ty) {
                bar.innerHTML = '<div style="padding: 6px; color: var(--sub-text-color);">無胎元資料</div>';
                return;
            }

            const card = document.createElement('div');
            card.className = `dayun-card ${isTaiyuanActive ? 'selected-taiyuan' : ''}`; 
            card.onclick = () => {
                isTaiyuanActive = !isTaiyuanActive;
                renderTaiyuanBar();
                renderGrid();
            };

            const header = document.createElement('div');
            header.className = 'dayun-year';
            header.innerText = '胎元';

            const stemSquare = document.createElement('div');
            stemSquare.className = 'dayun-square';
            stemSquare.style.color = getElementColor(ty.stem);
            stemSquare.style.backgroundColor = getBgColor(ty.stem);
            stemSquare.innerText = ty.stem;

            const branchSquare = document.createElement('div');
            branchSquare.className = 'dayun-square';
            branchSquare.style.color = getElementColor(ty.branch);
            branchSquare.style.backgroundColor = getBgColor(ty.branch);
            branchSquare.innerText = ty.branch;

            card.appendChild(header);
            card.appendChild(stemSquare);
            card.appendChild(branchSquare);
            bar.appendChild(card);
        }
        // --- END NEW 胎元 CODE ---

        //
        let isTaixiActive = false;
        let taixiBarVisible = false;

        function calculateTaixi() {
            if (!currentBaziData) return null;

            const dayStem = currentBaziData.E;
            const dayBranch = currentBaziData.F;

            if (!dayStem || !dayBranch) return null;

            const taixiStemMap = {
                '甲': '己', '己': '甲',
                '乙': '庚', '庚': '乙',
                '丙': '辛', '辛': '丙',
                '丁': '壬', '壬': '丁',
                '戊': '癸', '癸': '戊'
            };
            
            const taixiBranchMap = {
                '子': '丑', '丑': '子',
                '寅': '亥', '亥': '寅',
                '卯': '戌', '戌': '卯',
                '辰': '酉', '酉': '辰',
                '巳': '申', '申': '巳',
                '午': '未', '未': '午'
            };

            return { stem: taixiStemMap[dayStem], branch: taixiBranchMap[dayBranch] };
        }

        //

        //
        let isShengongActive = false;
        let shengongBarVisible = false;

        function calculateShengong(bazi) { 
            let yearStem, monthBranch, hourBranch;

            // 1. Extract values from passed array or global currentBaziData
            if (Array.isArray(bazi) && bazi.length >= 8) {
                yearStem = bazi[0];
                monthBranch = bazi[3];
                hourBranch = bazi[7];
            } else if (typeof currentBaziData !== 'undefined' && currentBaziData) {
                yearStem = currentBaziData.A;
                monthBranch = currentBaziData.D;
                hourBranch = currentBaziData.H;
            } else {
                return null;
            }

            if (!yearStem || !monthBranch || !hourBranch) return null;

            const monthBranchIdx = deizi_order.indexOf(monthBranch);
            const hourBranchIdx = deizi_order.indexOf(hourBranch);

            if (monthBranchIdx === -1 || hourBranchIdx === -1) return null;

            // 2. Find corresponding month palace (子上起正月: 寅 -> 子, 卯 -> 丑, 辰 -> 寅... i.e. index - 2)
            let currMonthIdx = (monthBranchIdx - 2 + 12) % 12;

            // 3. Dynamically find '酉' index and step until hour reaches '酉'
            const youIdx = deizi_order.indexOf("酉");
            let currHourIdx = hourBranchIdx;


            // Step hour forward (+1) and corresponding month backward (-1) until hour reaches '酉'
            while (currHourIdx !== youIdx) {
                currHourIdx = (currHourIdx + 1) % 12;
                currMonthIdx = (currMonthIdx - 1 + 12) % 12;
            }

            const calculatedWord = deizi_order[currMonthIdx];

            // 4. Derive Heavenly Stem using 五虎遁歌訣
            let calculatedStem = null;
            if (typeof 五虎遁歌訣 !== 'undefined' && 五虎遁歌訣[yearStem]) {
                calculatedStem = 五虎遁歌訣[yearStem][calculatedWord] || null;
            }

            return { stem: calculatedStem, branch: calculatedWord };
        }

        /**
         * 解析時刻字串為 Date 物件
         */
        function parseSolarTermDate(timeStr, fallbackYear) {
            if (!timeStr) return null;
            const match = timeStr.match(/(?:\((\d{4})\)\s*)?(\d{1,2})月(\d{1,2})日(?:,\s*(\d{1,2}):(\d{1,2}))?/);
            if (!match) return null;
            const y = match[1] ? parseInt(match[1], 10) : fallbackYear;
            const m = parseInt(match[2], 10);
            const d = parseInt(match[3], 10);
            const hr = match[4] ? parseInt(match[4], 10) : 0;
            const min = match[5] ? parseInt(match[5], 10) : 0;
            return new Date(y, m - 1, d, hr, min);
        }

        /**
         * 根據實際出生的年月日時分，與 24 節氣對比：
         * 1. 判定處於哪兩個中氣之間 (區間)
         * 2. 判定是否已過該區間內的中間節氣 (Middle Qi)
         * 3. 查表得出地支 Y
         */
        function getMinggongBranchByZhongQi(year, month, day, hour, hourBranch) {
            const hourIdx = deizi_order.indexOf(hourBranch);
            if (hourIdx === -1) return null;

            const yContent = document.getElementById('ycontent');
            if (!yContent) return null;
            const tables = yContent.querySelectorAll('table');
            if (tables.length < 2) return null;

            const rows = tables[1].querySelectorAll('tr');
            if (rows.length < 13) return null;

            // 當前排盤時間
            const birthDate = new Date(year, month - 1, day, hour, 0);

            let selectedKey = "冬至_大寒";
            let hasPassedMiddleQi = false;
            let middleQiName = "小寒";

            // 構建 12 個區間的開始、中間(Middle Qi)、結束時間

                if (startDate && endDate && birthDate >= startDate && birthDate < endDate) {

        // --- NEW ACCURATE CODE ---
        function calculateMinggong() {   
            if (!currentBaziData) return null;

            const X = (Y && 五虎遁歌訣[yearStem]) ? 五虎遁歌訣[yearStem][Y] : null;

        // --- INVISIBLE HEAVENLY STEM RELATIONSHIPS (盲派 暗天干) ---
        function findInvisibleStemRelationships(stems) {  
            const results = [];  
            const N = stems.length;
            const seen = new Set();

            const stemHeYinMap = {
                "甲_己": "己", "己_甲": "己",
                "乙_庚": "辛", "庚_乙": "辛",
                "丙_辛": "癸", "辛_丙": "癸",
                "丁_壬": "乙", "壬_丁": "乙",
                "戊_癸": "丁", "癸_戊": "丁"
            };

            const stemChongMap = {
                "甲": "庚", "乙": "辛", "丙": "壬", "丁": "癸", "戊": "甲",
                "己": "乙", "庚": "丙", "辛": "丁", "壬": "戊", "癸": "己"
            };

            const stemHePartnerMap = {};
            if (typeof tenkan_relationships !== "undefined" && tenkan_relationships["合"]) {
                for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                    stemHePartnerMap[pair[0]] = pair[1];
                    stemHePartnerMap[pair[1]] = pair[0];
                }
            }

            // 1. 檢查緊貼相鄰兩柱 (Distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const s1 = stems[i];
                const s2 = stems[j];
                if (!s1 || !s2) continue;

                // 相鄰同字天干 (如 丁丁 -> 壬)
                if (s1 === s2) {
                    const partnerStem = stemHePartnerMap[s1] || null;
                    const key = `same_neighbor_${i}_${j}_${s1}_${partnerStem}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        results.push({
                            type: 'same_neighbor',
                            indices: [i, j],
                            hiddenStem: partnerStem
                        });
                    }
                    continue; 
                }

                // 常規相鄰序數天干 (如 甲乙、乙丙) -> 普通相連 Bond
                const idx1 = tenkan_order.indexOf(s1);
                const idx2 = tenkan_order.indexOf(s2);
                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 10) % 10 === 1 || (idx1 - idx2 + 10) % 10 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenStem: null
                            });
                        }
                    }
                }
            }

            // 2. 檢查間隔天干對 (隔位才生暗合字，j > i + 1)
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const s1 = stems[i];
                    const s2 = stems[j];

                    // 兩干相同但「非緊貼」（隔位）時，依然引出暗合之字
                    if (s1 === s2 && j > i + 1 && stemHePartnerMap[s1]) {
                        const partnerStem = stemHePartnerMap[s1];
                        const key = `two_same_${i}_${j}_${partnerStem}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'two_same',
                                indices: [i, j],
                                hiddenStem: partnerStem
                            });
                        }
                        continue;
                    }

                    const idx1 = tenkan_order.indexOf(s1);
                    const idx2 = tenkan_order.indexOf(s2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        // 隔一位夾出中間天干 (Distance 2)
                        let missingStem = null;
                        if ((idx2 - idx1 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx1 + 1) % 10];
                        } else if ((idx1 - idx2 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx2 + 1) % 10];
                        }

                        if (missingStem) {
                            const key = `missing_${i}_${j}_${missingStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'missing_one',
                                    indices: [i, j],
                                    hiddenStem: missingStem
                                });
                            }
                        }

                        // 合化引出 (He-Yin)
                        const comboKey = `${s1}_${s2}`;
                        if (stemHeYinMap[comboKey]) {
                            const yinStem = stemHeYinMap[comboKey];
                            const key = `he_yin_${i}_${j}_${yinStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'he_yin',
                                    indices: [i, j],
                                    hiddenStem: yinStem
                                });
                            }
                        }
                    }
                }
            }

            // 3. 三同干沖出一殺
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        const s3 = stems[k];

                        if (s1 === s2 && s2 === s3 && stemChongMap[s1]) {
                            const qishaStem = stemChongMap[s1];
                            const key = `three_same_${i}_${j}_${k}_${qishaStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'three_same',
                                    indices: [i, j, k],
                                    hiddenStem: qishaStem
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

                            <stop offset="50%" stop-color="${cRight}" />

                const isSameNeighbor = (rel.type === 'same_neighbor');

        // --- INVISIBLE EARTHLY BRANCH RELATIONSHIPS (盲派 暗拱/暗夾) ---
        function findInvisibleBranchRelationships(branches) {
            const results = [];  
            const N = branches.length;
            const seen = new Set();

            const sanHeGong = {
                "子": ["申", "辰"],
                "酉": ["巳", "丑"],
                "午": ["寅", "戌"],
                "卯": ["亥", "未"]
            };

            const sixRelPairs = [
                ["子", "丑"], ["寅", "亥"], ["卯", "戌"],
                ["酉", "辰"], ["巳", "申"], ["午", "未"]
            ];
            function getSixRelPartner(b) {
                for (const pair of sixRelPairs) {
                    if (pair[0] === b) return pair[1];
                    if (pair[1] === b) return pair[0];
                }
                return null;
            }

            const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

            // 1. 檢查緊貼相鄰兩柱 (Distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const b1 = branches[i];
                const b2 = branches[j];
                if (!b1 || !b2) continue;

                // 相鄰同字地支 (如 未未 -> 午)
                if (b1 === b2) {
                    const partner = getSixRelPartner(b1);
                    const key = `same_neighbor_${i}_${j}_${b1}_${partner}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        results.push({
                            type: 'same_neighbor',
                            indices: [i, j],
                            hiddenBranch: partner,
                            color: partner ? getElementColor(partner) : null
                        });
                    }
                    continue;
                }

                // 常規相鄰序數地支 (如 丑寅、卯辰) -> 普通相連 Bond
                const idx1 = zhiOrder.indexOf(b1);
                const idx2 = zhiOrder.indexOf(b2);
                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 12) % 12 === 1 || (idx1 - idx2 + 12) % 12 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenBranch: null
                            });
                        }
                    }
                }
            }

            // 2. 檢查間隔地支對
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    // 三合暗拱
                    for (const [targetHidden, pair] of Object.entries(sanHeGong)) {
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }

                    // 兩地支相同但「非緊貼」（隔位，j > i + 1）時，暗拱六合之支
                    if (b1 === b2 && j > i + 1) {
                        const partner = getSixRelPartner(b1);
                        if (partner) {
                            const key = `${i}_${j}_${partner}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: partner,
                                    color: getElementColor(partner)
                                });
                            }
                        }
                    }

                    // 暗夾中間地支 (Distance 2)
                    const idx1 = zhiOrder.indexOf(b1);
                    const idx2 = zhiOrder.indexOf(b2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        if ((idx2 - idx1 + 12) % 12 === 2) {
                            const hiddenIdx = (idx1 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        } else if ((idx1 - idx2 + 12) % 12 === 2) {
                            const hiddenIdx = (idx2 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;

                    sortedIndices.forEach(idx => {
                        const x = rel.getX(idx);
                        svgHtml += `<line x1="${x}" y1="${yTop + 2}" x2="${x}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
                    });
                } else {
                    const boxSize = 26;
                    const boxX = midX - boxSize / 2;
                    const boxY = yBar - boxSize / 2;

                    const cap = isSameNeighbor ? 'stroke-linecap="round"' : '';
                    svgHtml += `<line x1="${minX}" y1="${yTop + 2}" x2="${minX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${cap} />`;
                    svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${boxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                    svgHtml += `<line x1="${boxX + boxSize}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                    svgHtml += `<line x1="${maxX}" y1="${yBar}" x2="${maxX}" y2="${yTop + 2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${cap} />`;

                    svgHtml += `<rect x="${boxX}" y="${boxY}" width="${boxSize}" height="${boxSize}" rx="4" ry="4" fill="var(--card-bg)" stroke="${strokeColor}" stroke-width="${isSameNeighbor ? 2.5 : strokeWidth}" />`;

                    const branchTextColor = rel.color ? getRelColor(rel.color) : strokeColor;

                    svgHtml += `<text class="spawned-branch" x="${midX}" y="${yBar + 6}" font-size="16" font-weight="700" text-anchor="middle" fill="${branchTextColor}" onclick="event.stopPropagation(); triggerDizhiArrows(this, '${rel.hiddenBranch}'); drawXingArrows(this, '${rel.hiddenBranch}'); toggleBranchHiddenStems(this, '${rel.hiddenBranch}');">${rel.hiddenBranch}</text>`;
                } 

                if (!isSameNeighbor) {
                    sortedIndices.forEach(idx => {
                        const x = rel.getX(idx);
                        const dotCol = getRelColor(getElementColor(branches[idx]));
                        if (hasHiddenBranch) {

                        }
                    });
                }
            }); 

            svgHtml += `</svg>`;
            container.innerHTML = svgHtml;
        }

            line1.setAttribute("x1", cx - size);
            line1.setAttribute("y1", cy - size);
            line1.setAttribute("x2", cx + size);
            line1.setAttribute("y2", cy + size);
            line1.setAttribute("stroke", "#ff4d4f");
            line1.setAttribute("stroke-width", "3.5");
            line1.setAttribute("stroke-linecap", "round");

            const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line2.setAttribute("x1", cx + size);
            line2.setAttribute("y1", cy - size);
            line2.setAttribute("x2", cx - size);
            line2.setAttribute("y2", cy + size);
            line2.setAttribute("stroke", "#ff4d4f");
            line2.setAttribute("stroke-width", "3.5");

            });

        // BaZi Earthly Branch Six Clashes (地支六沖)
        const chongDict = {
            '子': '午', '午': '子',
            '丑': '未', '未': '丑',
            '寅': '申', '申': '寅',
            '卯': '酉', '酉': '卯',

        };

        function createArrow(fromElem, toElem, color, markerId, isBiDirectional = false, opacity = 1) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return false; 

            // Prevent any arrow from pointing to or originating from "合"
            if ((fromElem && fromElem.textContent.trim() === '合') || (toElem && toElem.textContent.trim() === '合')) {
                return false;
            }

            const startRect = fromElem.getBoundingClientRect();
            const endRect = toElem.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0 || endRect.width === 0 || endRect.height === 0) return false;

            const startX = startRect.left + (startRect.width / 2);
            const startY = startRect.top + (startRect.height / 2);
            const endX = endRect.left + (endRect.width / 2);
            const endY = endRect.top + (endRect.height / 2);

            const isMainBranch = fromElem.classList.contains('main-pillar-branch') || fromElem.classList.contains('main-pillar-stem');
            const startOffsetRadius = isMainBranch ? 35 : 12;
            const endOffsetRadius = toElem.classList.contains('main-pillar-branch') || toElem.classList.contains('main-pillar-stem') ? 35 : 12;

            const dx = endX - startX;
            const dy = endY - startY;
            const distance = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            if (distance <= (startOffsetRadius + endOffsetRadius)) return false;

            const adjustedStartX = startX + Math.cos(angle) * startOffsetRadius;
            const adjustedStartY = startY + Math.sin(angle) * startOffsetRadius;
            const adjustedEndX = endX - Math.cos(angle) * endOffsetRadius;
            const adjustedEndY = endY - Math.sin(angle) * endOffsetRadius;

            const adjustedDistance = Math.hypot(adjustedEndX - adjustedStartX, adjustedEndY - adjustedStartY);

            // 1. Wrap in a <g> container with initial opacity
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.style.opacity = opacity;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", adjustedStartX);
            line.setAttribute("y1", adjustedStartY);
            line.setAttribute("x2", adjustedEndX);
            line.setAttribute("y2", adjustedEndY);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "2.5");
            
            line.style.strokeDasharray = adjustedDistance;
            line.style.strokeDashoffset = adjustedDistance;

            group.appendChild(line);
            canvas.appendChild(group);

            // 2. Animate line drawing
            const drawAnim = line.animate([
                { strokeDashoffset: adjustedDistance },
                { strokeDashoffset: 0 }
            ], { duration: 600, easing: 'ease-out', fill: 'forwards' });

            // 3. Dynamically attach arrowhead once draw finishes
            drawAnim.onfinish = () => {
                line.setAttribute("marker-end", `url(#${markerId})`);
                if (isBiDirectional) {
                    line.setAttribute("marker-start", `url(#${markerId})`);
                }
            };

            // 4. Animate opacity on the GROUP (<g>) starting from the designated opacity
            group.animate([
                { opacity: opacity },
                { opacity: 0 }
            ], { duration: 500, delay: 1500, easing: 'ease-out', fill: 'forwards' });

            // 5. Remove the entire group node from DOM
            setTimeout(() => group.remove(), 2100);
            return true;
        }

        function drawXingArrows(sourceElement, char) {
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;

            // 1. Find elements that the clicked character punishes (Outgoing)
            const targets = xingMap[char] || [];
            
            // 2. Find elements that punish the clicked character (Incoming)
            const sources = Object.keys(xingMap).filter(key => xingMap[key].includes(char));

            if (targets.length === 0 && sources.length === 0) { 
                return 0;
            }

            const querySelectors = '.bazi-square, .bazi-rect, .stem-char, text.spawned-branch, text.spawned-stem, .main-pillar-branch, .time-pillar-branch';
            const allNodes = document.querySelectorAll(querySelectors);
            
            let arrowsDrawnCount = 0;

            allNodes.forEach(node => {
                if (node === sourceElement) return; 
                
                const textContent = (node.textContent || node.innerText).trim();
                
                // Outgoing Relationship
                if (targets.some(t => textContent.includes(t))) {
                    if (createArrow(sourceElement, node, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }

                // Incoming Relationship
                if (sources.some(s => textContent.includes(s))) {
                    if (createArrow(node, sourceElement, "purple", "arrowhead-xing", false)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            return arrowsDrawnCount;
        } 

        function triggerDizhiArrows(clickedElement, sourceChar, suppressCross = false) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;

            const targetChongChar = chongDict[sourceChar];
            
            // Select all Earthly Branch elements (main pillars + spawned/time pillars)
            const possibleTargets = document.querySelectorAll('.main-pillar-branch, #invisibleBranchRelContainer text.spawned-branch, .time-pillar-branch');
            let arrowsDrawnCount = 0;

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();

                // 沖 (Clash): Draw a bidirectional orange arrow between source and target
                if (targetChongChar && targetText === targetChongChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-chong", true)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // Draw X animation if no clash partner exists on screen (unless suppressed)
            if (arrowsDrawnCount === 0 && !suppressCross) {
                drawXAnimation(clickedElement);
            }

            return arrowsDrawnCount;
        }

        function triggerArrows(clickedElement, sourceChar, originBranchElem = null, suppressCross = false, arrowOpacity = 1) { 
            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return 0;  

            // Do nothing if the clicked element itself is "合"
            if (clickedElement && clickedElement.textContent.trim() === '合') {
                return 0;
            } 

            const targetPianCaiChar = pianCaiDict[sourceChar];
            const sourceQiShaChar = qiShaDict[sourceChar];

            // Check visibility states of containers
            const invBranchContainer = document.getElementById('invisibleBranchRelContainer');
            const isInvBranchContainerOpen = invBranchContainer && 
                !invBranchContainer.classList.contains('collapsed') && 
                invBranchContainer.style.display !== 'none';

            const invStemContainer = document.getElementById('invisibleStemRelContainer');
            const isInvStemContainerOpen = invStemContainer && 
                !invStemContainer.classList.contains('collapsed') && 
                invStemContainer.style.display !== 'none';

            // Identify which exact tier the clicked element belongs to:
            const isRow2BottomStem = clickedElement.closest('[id^="rect_h_r2"]') !== null;
            const isRow1BottomStem = clickedElement.closest('[id^="rect_h_r1"]') !== null;
            const isPopupStem = clickedElement.classList.contains('popup-stem');

            let targetSelector = '';

            if (isRow2BottomStem) {
                // Row 2 ("bottom two tenkans"): ONLY point arrows at other Row 2 stems!
                targetSelector = '[id^="rect_h_r2"] .stem-char';
            } else if (isRow1BottomStem) {
                // Row 1 ("bottom first level tenkans"): points to other Row 1 stems
                targetSelector = '[id^="rect_h_r1"] .stem-char';
            } else if (isPopupStem) {
                // Popup stem: can interact with Row 1 stems and other popup stems
                targetSelector = '[id^="rect_h_r1"] .stem-char, .popup-stem';
            } else {
                // Main pillar stems: only target invisible stems if its container is OPEN
                targetSelector = isInvStemContainerOpen 
                    ? '.main-pillar-stem, #invisibleStemRelContainer text.spawned-stem' 
                    : '.main-pillar-stem';
            }

            const possibleTargets = document.querySelectorAll(targetSelector);
            let arrowsDrawnCount = 0;

            // 1. Search strictly within the isolated target group
            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const targetText = target.textContent.trim();
                if (targetText === '合') return;

                // 偏財: Clicked stem -> 偏財 stem (Orange arrow)
                if (targetPianCaiChar && targetText === targetPianCaiChar) {
                    if (createArrow(clickedElement, target, "orange", "arrowhead-piancai", false, arrowOpacity)) {
                        arrowsDrawnCount++;
                    }
                }

                // 七殺: 七殺 stem -> Clicked stem (Greenish-Yellow arrow)
                if (sourceQiShaChar && targetText === sourceQiShaChar) {
                    if (createArrow(target, clickedElement, "#adff2f", "arrowhead-qisha", false, arrowOpacity)) {
                        arrowsDrawnCount++;
                    }
                }
            });

            // 2. Search / Summon Invisible Branches:
            if ((isRow1BottomStem || isPopupStem) && isInvBranchContainerOpen) {
                const invisibleBranches = document.querySelectorAll('#invisibleBranchRelContainer text.spawned-branch');
                invisibleBranches.forEach(branchElem => {
                    if (branchElem === originBranchElem) return;

                    const bChar = branchElem.textContent.trim();
                    const primaryStem = getBranchPrimaryStem(bChar);
                    if (!primaryStem) return;

                    const isPianCai = (targetPianCaiChar && primaryStem === targetPianCaiChar);
                    const isQiSha = (sourceQiShaChar && primaryStem === sourceQiShaChar);

                    if (isPianCai || isQiSha) {
                        const popupData = spawnBranchHiddenPopup(branchElem, bChar);
                        if (popupData && popupData.stemElements[primaryStem]) {
                            const hElem = popupData.stemElements[primaryStem];

                            // 偏財: Clicked stem -> Popup stem (Orange)
                            if (isPianCai) {
                                if (createArrow(clickedElement, hElem, "orange", "arrowhead-piancai", false, arrowOpacity)) {
                                    arrowsDrawnCount++;
                                }
                            }

                            // 七殺: Popup stem -> Clicked stem (Greenish-Yellow)
                            if (isQiSha) {
                                if (createArrow(hElem, clickedElement, "#adff2f", "arrowhead-qisha", false, arrowOpacity)) {
                                    arrowsDrawnCount++;
                                }
                            }
                        }
                    }
                });
            }

            // 3. Show X animation if no connections
            if (arrowsDrawnCount === 0 && !suppressCross) {
                drawXAnimation(clickedElement);
            }

            return arrowsDrawnCount;
        }

                    // 5. Cross (X) Decision Logic:
                    if (this.classList.contains('spawned-branch')) {
                        const totalInvisibleConnections = (chongCount || 0) + (xingCount || 0) + (popupArrows || 0);
                        if (totalInvisibleConnections === 0) {
                            drawXAnimation(this);
                        }
                    } else {
                        const hasSolidBranchConnection = (xingCount > 0) || (chongCount > 0) || (row1Arrows > 0);

                        if (!hasSolidBranchConnection) {
                            drawXAnimation(this);
                        }
                    }
                };
            });
        } 

        document.addEventListener("DOMContentLoaded", () => {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const hourSelect = document.getElementById('hourSelect');
            const sexSelect = document.getElementById('sexSelect');
            const splitBtn = document.getElementById('splitBtn'); 

            disableTimeBtn.addEventListener('click', () => {
                isTimeDisabled = !isTimeDisabled;
                disableTimeBtn.textContent = isTimeDisabled ? 'Enable Time' : 'Disable Time';
                
                // Optional: Add a visual highlight to the button when time is disabled
                if (isTimeDisabled) {
                    disableTimeBtn.style.backgroundColor = 'var(--card-hover)';
                    disableTimeBtn.style.borderColor = 'gray'; 
                } else {
                    disableTimeBtn.style.backgroundColor = '';
                    disableTimeBtn.style.borderColor = '';
                }
                
                renderGrid();
            });

            // Bind all input selectors to trigger grid & 命宮 recalculation
            ['yearSelect', 'monthSelect', 'daySelect', 'hourSelect', 'sexSelect'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => {
                        // Update currentBaziData here via paipan calculation logic
                        renderGrid();
                    });
                }
            });

            // Bind 命宮 Toggle Button
            const minggongBtn = document.getElementById('minggongBtn');
            if (minggongBtn) {
                minggongBtn.addEventListener('click', () => {
                    minggongBarVisible = !minggongBarVisible;
                    renderMinggongBar();
                    renderGrid();
                });
            }

            const taiyuanBtn = document.getElementById('taiyuanBtn');
            if (taiyuanBtn) {
                taiyuanBtn.addEventListener('click', () => {
                    taiyuanBarVisible = !taiyuanBarVisible;
                    renderTaiyuanBar();
                    renderGrid();
                }); 
            } 

            const taixiBtn = document.getElementById('taixiBtn');
            if (taixiBtn) {
                taixiBtn.addEventListener('click', () => {
                    taixiBarVisible = !taixiBarVisible;
                    renderTaixiBar();
                    renderGrid();
                });  
            } 

            const shengongBtn = document.getElementById('shengongBtn'); 
            if (shengongBtn) {
                shengongBtn.addEventListener('click', () => {
                    shengongBarVisible = !shengongBarVisible;
                    renderShengongBar();
                    renderGrid();
                }); 
            }

            document.getElementById('hehuaBtn').addEventListener('click', function() {
                isHeHuaEnabled = !isHeHuaEnabled;
                this.innerText = isHeHuaEnabled ? "Disable 合化" : "Enable 合化";
                renderGrid(); 
            });

            const yuanyunBtn = document.getElementById('yuanyunBtn');
            const dayunBtn = document.getElementById('dayunBtn');
            const liunianBtn = document.getElementById('liunianBtn');
            const liuyueBtn = document.getElementById('liuyueBtn');
            const liuriBtn = document.getElementById('liuriBtn');
            const liushiBtn = document.getElementById('liushiBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const nowBtn = document.getElementById('nowBtn');
            const errorResult = document.getElementById('errorResult');

            function setTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.textContent = '🌙';
                } else {
                    themeToggleBtn.textContent = '☀️';
                }
                localStorage.setItem('theme', theme);
                renderYuanyunBar();
                renderDayunBar();
                renderLiunianBar();
                renderLiuyueBar();
                renderLiuriBar();
                renderLiushiBar();
                renderGrid();
            }

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
            });

            splitBtn.addEventListener('click', () => {
                isSplitMode = !isSplitMode;
                splitBtn.textContent = isSplitMode ? 'Combine' : 'Split';
                renderGrid();
            });

            nowBtn.addEventListener('click', selectNow);

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentDate = now.getDate();
            const currentHour = now.getHours();

            const savedTheme = localStorage.getItem('theme');
            if (currentHour >= 23) {
                setTheme('dark');
            } else if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme('light');
            }

            for (let y = 1600; y <= 2100; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            } 

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            for (let h = 0; h < 24; h++) {
                let opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h < 10 ? '0' + h : h;
                if (h === currentHour) opt.selected = true;
                hourSelect.appendChild(opt);
            }

            sexSelect.value = "0";

            function calculate() {
                try {
                    errorResult.textContent = "";
                    selectedYuanyun = null;
                    selectedDayun = null;   
                    selectedLiunian = null; 
                    selectedLiuyue = null;  
                    selectedLiuri = null;   
                    selectedLiushi = null;  
                    yuanyunBarVisible = false;
                    liunianBarVisible = false;
                    liuyueBarVisible = false;
                    liuriBarVisible = false;
                    liushiBarVisible = false;
                    liunianBtn.style.display = 'none';
                    liuyueBtn.style.display = 'none';
                    liuriBtn.style.display = 'none';
                    liushiBtn.style.display = 'none';

                    var p = new paipan();
                    p.zwz = false;
                    
                    const yr = parseInt(yearSelect.value, 10);
                    const mth = parseInt(monthSelect.value, 10);
                    const dy = parseInt(daySelect.value, 10);
                    const hr = parseInt(hourSelect.value, 10);
                    var sex = parseInt(sexSelect.value, 10); 

                    logSunAndMoonToConsole(yr); 

                    var ans = p.GetInfo(sex, yr, mth, dy, hr, 0, 0); 
                    console.log(ans); 
                    
                    if (ans && ans.bazi && ans.bazi.length >= 8) {
                        const bigList = [];
                        if (ans.big) {
                            const times = ans.big_start_time || [];
                            for (let i = 0; i < ans.big.length; i += 2) {
                                const idx = i / 2;
                                const stem = ans.big[i];
                                const branch = ans.big[i + 1];
                                let year = "";
                                if (times[idx] && times[idx].length > 0) {
                                    year = times[idx][0];
                                }
                                bigList.push({ stem, branch, year });
                            }
                        }

                        currentBaziData = {
                            A: ans.bazi[0],
                            B: ans.bazi[1],
                            C: ans.bazi[2],
                            D: ans.bazi[3],
                            E: ans.bazi[4],
                            F: ans.bazi[5],
                            G: ans.bazi[6],
                            H: ans.bazi[7],
                            bigList: bigList,
                            big_start_time: ans.big_start_time
                        };

                        renderYuanyunBar();
                        renderDayunBar();
                        renderLiunianBar();
                        renderLiuyueBar();
                        renderLiuriBar();
                        renderLiushiBar();
                        renderGrid();
                    }
                } catch (e) {
                    console.error(e);
                    errorResult.textContent = "Error: " + e.message;
                }
            }

            function updateDays(targetDay) {
                const year = parseInt(yearSelect.value, 10);
                const month = parseInt(monthSelect.value, 10);
                const daysInMonth = new Date(year, month, 0).getDate();

                const currentDay = targetDay || parseInt(daySelect.value, 10) || currentDate;

                daySelect.innerHTML = '';
                for (let d = 1; d <= daysInMonth; d++) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    if (d === currentDay || (d === daysInMonth && currentDay > daysInMonth)) {
                        opt.selected = true;
                    }
                    daySelect.appendChild(opt);
                }
            }

            yearSelect.addEventListener('change', () => { updateDays(); calculate(); });
            monthSelect.addEventListener('change', () => { updateDays(); calculate(); });
            daySelect.addEventListener('change', calculate);
            hourSelect.addEventListener('change', calculate);
            sexSelect.addEventListener('change', calculate);

            yuanyunBtn.addEventListener('click', () => {
                yuanyunBarVisible = !yuanyunBarVisible;
                renderYuanyunBar(); 
            });

            dayunBtn.addEventListener('click', () => {
                dayunBarVisible = !dayunBarVisible;
                renderDayunBar();
            });

            liunianBtn.addEventListener('click', () => {
                liunianBarVisible = !liunianBarVisible;
                renderLiunianBar();
            });

            liuyueBtn.addEventListener('click', () => {
                liuyueBarVisible = !liuyueBarVisible;
                renderLiuyueBar();
            });

            liuriBtn.addEventListener('click', () => {
                liuriBarVisible = !liuriBarVisible;
                renderLiuriBar();
            });

            liushiBtn.addEventListener('click', () => {
                liushiBarVisible = !liushiBarVisible;
                renderLiushiBar();
            }); 

            updateDays(currentDate);
            calculate();
        }); 
    </script>
</body>
