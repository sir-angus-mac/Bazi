<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazi Calculator</title>
    <!-- Google Font: Noto Serif SC including weight 200, 400, 700, 900 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <script src="paipan.js" defer></script> 
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --sub-text-color: #444444;
            --muted-text-color: #8c8c8c;
            --border-color: #222222;
            --card-bg: #ffffff;
            --card-hover: #eeeeee;
            --sub-rect-bg: #e0e0e0;
            --sub-rect-text: #666666;
            --sub-rect-border: #777777;
            --container-bg: #f9f9f9;
            --shadow: rgba(0, 0, 0, 0.05);

            /* Selected card highlight backgrounds */
            --sel-dayun-bg: #e6f2ff;
            --sel-liunian-bg: #fef5e7;
            --sel-liuyue-bg: #f3ebf9;
            --sel-liuri-bg: #e8f8f0;
            --sel-liushi-bg: #e0f7fa;
            --sel-yuanyun-bg: #fff0f5;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sub-text-color: #aaaaaa;
            --muted-text-color: #777777;
            --border-color: #555555;
            --card-bg: #1e1e1e;
            --card-hover: #2d2d2d;
            --sub-rect-bg: #2a2a2a;
            --sub-rect-text: #aaaaaa;
            --sub-rect-border: #555555;
            --container-bg: #181818;
            --shadow: rgba(0, 0, 0, 0.4);

            /* Selected card highlight backgrounds */
            --sel-dayun-bg: #003366;
            --sel-liunian-bg: #4a2800;
            --sel-liuyue-bg: #321452;
            --sel-liuri-bg: #0a3a18;
            --sel-liushi-bg: #00363d;
            --sel-yuanyun-bg: #4a0033;
        }

        body {
            font-family: 'Noto Serif SC', "Microsoft YaHei", "SimSun", serif;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.2s, color 0.2s;
        }

        /* Standard UI Controls (Scaled Smaller) */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .controls-bar select {
            font-size: 13px;
            padding: 2px 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .btn-dayun {
            font-size: 13px;
            padding: 3px 8px;
            cursor: pointer;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            user-select: none;
        }
        .btn-dayun:hover {
            background-color: var(--card-hover);
        }
        .btn-theme {
            font-size: 14px;
            padding: 2px 8px;
        }

        /* Bazi Grid Components */
        .bazi-container {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 8px;
            margin-top: 18px;
            align-items: start;
        }
        .bazi-header {
            width: 90px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 200;
            color: var(--sub-text-color);
            user-select: none;
            line-height: 1;
        }
        .bazi-rect {
            width: 90px;
            min-height: 42px;
            border: 2px solid var(--border-color);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 400;
            white-space: nowrap;
            background-color: var(--card-bg);
            box-shadow: 0 3px 5px var(--shadow);
            user-select: none;
            color: var(--text-color);
            text-align: center;
            box-sizing: border-box;
            padding: 3px 0;
        }
        .bazi-rect-sub {
            background-color: var(--sub-rect-bg);
            color: var(--sub-rect-text);
            border-color: var(--sub-rect-border);
        }
        .bazi-rect-hidden {
            padding: 4px 0;
        }
        .bazi-rel-container {
            grid-column: span 4;
            width: 100%;
            display: none;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            box-shadow: 0 3px 5px var(--shadow);
            box-sizing: border-box;
            padding: 4px 0;
            user-select: none;
            cursor: pointer; /* Indicates the border is clickable */
            transition: background-color 0.2s, border-color 0.2s;
        }

        .bazi-rel-container svg {
            cursor: default; /* Keeps the regular cursor when hovering over the SVG elements */
        }

        /* Collapsed state styling */
        .bazi-rel-container.collapsed {
            height: 14px;
            padding: 0;
            border: none;
            background-color: transparent;
            box-shadow: none;
            position: relative;
        }

        /* The dotted line effect */
        .bazi-rel-container.collapsed::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 0;
            right: 0;
            border-top: 3px dotted var(--border-color);
        }

        /* Hide the SVG when collapsed */
        .bazi-rel-container.collapsed svg {
            display: none;
        } 
        .hidden-stem-line {
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 4px;
            line-height: 1.15;
        }
        .stem-char {
            font-size: 22px;
            font-weight: 400;
        }
        .god-text {
            font-size: 22px;
            font-weight: 400;
            color: var(--text-color);
        }
        .bazi-square {
            width: 90px;
            height: 90px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 200;
            line-height: 1;
            background-color: var(--card-bg);
            box-shadow: 0 3px 5px var(--shadow);
            user-select: none;
            box-sizing: border-box;
        } 

        /* Scrollable Horizontal UIs */
        .dayun-scroll-container {
            display: none;
            flex-direction: row;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 12px;
            margin-top: 15px;
            max-width: 840px;
            box-sizing: border-box;
            border: 3px solid var(--border-color);
            background-color: var(--container-bg);
            user-select: none;
            white-space: nowrap;
        }
        .dayun-card { 
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            border: 2px solid transparent;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .dayun-card:hover {
            background-color: var(--card-hover);
        }
        .dayun-card.selected {
            border-color: #007bff;
            background-color: var(--sel-dayun-bg);
        }
        .dayun-card.selected-yuanyun {
            border-color: #e83e8c;
            background-color: var(--sel-yuanyun-bg);
        }
        .dayun-card.selected-liunian {
            border-color: #e67e22;
            background-color: var(--sel-liunian-bg);
        }
        .dayun-card.selected-liuyue {
            border-color: #6f42c1;
            background-color: var(--sel-liuyue-bg);
        }
        .dayun-card.selected-liuri {
            border-color: #28a745;
            background-color: var(--sel-liuri-bg);
        }
        .dayun-card.selected-liushi {
            border-color: #17a2b8;
            background-color: var(--sel-liushi-bg);
        }
        .dayun-year {
            font-size: 18px;
            font-weight: bold;
            color: var(--sub-text-color);
            min-height: 22px;
        }
        .dayun-time {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted-text-color);
            margin-top: 1px;
        }
        .dayun-square {
            width: 55px;
            height: 55px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 400;
            background-color: var(--card-bg);
            box-sizing: border-box;
        } 

        #invisibleStemRelContainer text.spawned-stem {
            cursor: pointer;
            pointer-events: auto;
        }

        #arrowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        } 
    </style>
</head>
<body>

    <div class="controls-bar">
        <button id="themeToggleBtn" class="btn-dayun btn-theme">☀️</button>
        <button id="nowBtn" class="btn-dayun">Now</button>
        <select id="yearSelect"></select> 年
        <select id="monthSelect"></select> 月
        <select id="daySelect"></select> 日
        <select id="hourSelect"></select> 時
        <select id="sexSelect">
            <option value="0">男</option>
            <option value="1">女</option>
        </select> 命
        <button id="disableTimeBtn" class="btn-dayun">Disable Time</button> 
        <button id="splitBtn" class="btn-dayun">Split</button>
        <button id="yuanyunBtn" class="btn-dayun">元運</button>
        <button id="dayunBtn" class="btn-dayun">大運</button>
        <button id="liunianBtn" class="btn-dayun" style="display: none;">流年</button>
        <button id="liuyueBtn" class="btn-dayun" style="display: none;">流月</button>
        <button id="liuriBtn" class="btn-dayun" style="display: none;">流日</button>
        <button id="liushiBtn" class="btn-dayun" style="display: none;">流時</button>
    </div>

    <!-- Scrollable 元運 List -->
    <div class="dayun-scroll-container" id="yuanyunBar"></div>

    <!-- Scrollable 大運 List -->
    <div class="dayun-scroll-container" id="dayunBar"></div>

    <!-- Scrollable 流年 List -->
    <div class="dayun-scroll-container" id="liunianBar"></div>

    <!-- Scrollable 流月 List -->
    <div class="dayun-scroll-container" id="liuyueBar"></div>

    <!-- Scrollable 流日 List -->
    <div class="dayun-scroll-container" id="liuriBar"></div>

    <!-- Scrollable 流時 List -->
    <div class="dayun-scroll-container" id="liushiBar"></div>

    <!-- Bazi Grid -->
    <div class="bazi-container" id="baziGrid"></div>
    <svg id="arrowCanvas">
        <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4757"/>
            </marker>
        </defs>
    </svg>

    <pre id="errorResult" style="color: red; margin-top: 10px; font-size: 13px;"></pre>

    <script>
        const 水 = ["壬", "癸", "子", "亥"];
        const 火 = ["丙", "丁", "午", "巳"];
        const 金 = ["庚", "辛", "申", "酉"];
        const 木 = ["甲", "乙", "寅", "卯"];
        const 土 = ["戊", "己", "辰", "戌", "丑", "未"];

        const 陽 = ["甲", "丙", "戊", "庚", "壬", "亥", "寅", "辰", "巳", "申", "戌"];
        const 陰 = ["乙", "丁", "己", "辛", "癸", "丑", "卯", "午", "未", "酉", "子"];

        const five_elements = ["水", "火", "金", "木", "土"];
        const relations = {
            "水" : ["同我者", "我剋者", "生我者", "我生者", "剋我者"], 
            "火" : ["剋我者", "同我者", "我剋者", "生我者", "我生者"], 
            "金" : ["我生者", "剋我者", "同我者", "我剋者", "生我者"], 
            "木" : ["生我者", "我生者", "剋我者", "同我者", "我剋者"], 
            "土" : ["我剋者", "生我者", "我生者", "剋我者", "同我者"]
        }; 
        const ten_gods = ["比肩", "劫財", "七殺", "正官", "偏印", "正印", "食神", "傷官", "偏財", "正財"];

        const tenkan_order = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const deizi_order = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const yuanYunOptions = [
            { year: "1864", stem: "己", branch: "未" }, 
            { year: "1924", stem: "庚", branch: "申" },
            { year: "1984", stem: "辛", branch: "酉" },
            { year: "2044", stem: "壬", branch: "戌" }
        ]; 

        const tenkan_deizi_rel = {
            "木": ["沐浴","冠帶","臨官","帝旺","衰","病","死","墓庫","絕","胎","養","長生"], 
            "火": ["胎","養","長生","沐浴","冠帶","臨官","帝旺","衰","病","死","墓庫","絕"],
            "土": ["胎","養","長生","沐浴","冠帶","臨官","帝旺","衰","病","死","墓庫","絕"],
            "金": ["死","墓庫","絕","胎","養","長生","沐浴","冠帶","臨官","帝旺","衰","病"],
            "水": ["帝旺","衰","病","死","墓庫","絕","胎","養","長生","沐浴","冠帶","臨官"]
        };

        const deizi_hidden_tenkan = {
            "寅" : ["甲", "丙", "戊"],
            "卯" : ["乙"],
            "辰" : ["戊", "乙", "癸"],
            "巳" : ["丙", "戊", "庚"],
            "午" : ["丁", "己" ],
            "未" : ["己", "丁", "乙"], 
            "申" : ["庚", "壬", "戊"],
            "酉" : ["辛"],
            "戌" : ["戊", "辛", "丁"], 
            "亥" : ["壬", "甲"],
            "子" : ["癸"],
            "丑" : ["己", "癸", "辛"]
        };

        const tenkan_relationships = {
            "合": {
                "土": ["甲", "己"], 
                "金": ["乙", "庚"], 
                "水": ["丙", "辛"],
                "木": ["丁", "壬"],
                "火": ["戊", "癸"]
            },
            "沖": {
                "1": ["甲", "庚"], 
                "2": ["乙", "辛"], 
                "3": ["丙", "壬"],
                "4": ["丁", "癸"], 
                "5": ["戊", "甲"], 
                "6": ["己", "乙"], 
                "7": ["庚", "丙"],
                "8": ["辛", "丁"], 
                "9": ["壬", "戊"], 
                "10": ["癸", "己"]
            }
        };

        const 三合 = { 
            "水" : ["申", "子", "辰"],
            "金" : ["巳", "酉", "丑"],
            "火" : ["寅", "午", "戌"],
            "木" : ["亥", "卯", "未"] 
        };

        const 三會 = { 
            "水" : ["亥", "子", "丑"],
            "金" : ["申", "酉", "戌"],
            "火" : ["巳", "午", "未"],
            "木" : ["寅", "卯", "辰"] 
        };

        const 三刑 = {
            "恃勢之刑" : ["未", "丑", "戌"],
            "無恩之刑" : ["申", "寅", "巳"]
        };

        const 無禮之刑 = ["子", "卯"];
        const 自刑 = ["辰", "午", "酉", "亥"];

        const six_rel = {
            "合": { 
                "土": ["子", "丑"],
                "木": ["寅", "亥"],
                "火": ["卯", "戌"],
                "金": ["酉", "辰"],
                "水": ["巳", "申"],
                "火土": ["午", "未"],
            }, 
            "沖": { 
                "0": ["子", "午"],
                "1": ["丑", "未"],
                "2": ["寅", "申"],
                "3": ["卯", "酉"],
                "4": ["辰", "戌"],
                "5": ["巳", "亥"], 
            } 
        };

        const punishMap = {
            "戌": "未", "丑": "戌", "未": "丑",
            "寅": "巳", "巳": "申", "申": "寅"
        };

        function isDarkMode() {
            return document.body.getAttribute('data-theme') === 'dark';
        }

        function getOrdinalDay(day) {
            let s = ["th", "st", "nd", "rd"];
            let v = day % 100;
            return day + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        let currentBaziData = null; 
        let isTimeDisabled = false; 
        let selectedYuanyun = null;
        let selectedDayun = null;   
        let selectedLiunian = null; 
        let selectedLiuyue = null;
        let selectedLiuri = null;
        let selectedLiushi = null;
        let yuanyunBarVisible = false;
        let dayunBarVisible = false; 
        let liunianBarVisible = false;
        let liuyueBarVisible = false;
        let liuriBarVisible = false;
        let liushiBarVisible = false;
        let isSplitMode = false;
        // State tracker for collapsible relationship containers (true = collapsed initially)
        let relContainerStates = {
            'stemRelContainer': true,
            'invisibleStemRelContainer': true,
            'invisibleBranchRelContainer': true,
            'relContainer': true
        };

        // Function to handle the expanding/collapsing
        function toggleRelContainer(event, el) {
            // If it is currently expanded, only collapse if the click target is exactly the border/padding
            // This prevents collapsing when the user accidentally clicks on the SVG lines or text.
            if (!el.classList.contains('collapsed')) {
                if (event.target !== el) return;
            }
            
            el.classList.toggle('collapsed');
            relContainerStates[el.id] = el.classList.contains('collapsed');
        } 

        function getElement(char) {
            if (char === "水" || 水.includes(char)) return "水";
            if (char === "火" || 火.includes(char)) return "火";
            if (char === "金" || 金.includes(char)) return "金";
            if (char === "木" || 木.includes(char)) return "木";
            if (char === "土" || 土.includes(char)) return "土";
            return "";
        }

        function getElementColor(char) {
            const dark = isDarkMode();
            if (char === "水" || 水.includes(char)) return dark ? "#66b2ff" : "blue";
            if (char === "火" || 火.includes(char)) return dark ? "#ff6b6b" : "red";
            if (char === "金" || 金.includes(char)) return dark ? "#ffd700" : "#d4af37";
            if (char === "木" || 木.includes(char)) return dark ? "#5cdb95" : "green";
            if (char === "土" || 土.includes(char)) return dark ? "#cd853f" : "brown";
            return dark ? "#e0e0e0" : "#222";
        }

        function getRelColor(color) {
            const dark = isDarkMode();
            if (!dark) {
                if (color === "darkorange") return "#d35400";
                return color;
            }
            if (color === "orange") return "#ffaa33";
            if (color === "darkorange") return "#ff7700";
            if (color === "purple") return "#c77dff";
            if (color === "red") return "#ff6b6b";
            if (color === "brown") return "#cd853f";
            if (color === "blue") return "#66b2ff";
            if (color === "green") return "#5cdb95";
            if (color === "#d4af37") return "#ffd700";
            return color;
        }

        function formatColoredLabel(label, defaultColor) {
            let result = '';
            for (const char of label) {
                const el = getElement(char);
                if (el) {
                    const color = getElementColor(char);
                    result += `<tspan fill="${color}">${char}</tspan>`;
                } else {
                    result += `<tspan fill="${defaultColor}">${char}</tspan>`;
                }
            }
            return result;
        }

        function getBgColor(char) {
            const dark = isDarkMode();
            if (陰.includes(char)) return dark ? "#3a3a3a" : "#d5d5d5";
            return dark ? "#242424" : "#ffffff";
        }

        function calculateTenGod(targetChar, dayMasterChar) {
            const targetEl = getElement(targetChar);
            const dayMasterEl = getElement(dayMasterChar);
            if (!targetEl || !dayMasterEl) return "";

            const targetElIdx = five_elements.indexOf(targetEl);
            const relType = relations[dayMasterEl][targetElIdx];

            const sameGender = (陽.includes(targetChar) === 陽.includes(dayMasterChar));

            if (relType === "同我者") {
                return sameGender ? "比肩" : "劫財";
            } else if (relType === "我生者") {
                return sameGender ? "食神" : "傷官";
            } else if (relType === "我剋者") {
                return sameGender ? "偏財" : "正財";
            } else if (relType === "剋我者") {
                return sameGender ? "七殺" : "正官";
            } else if (relType === "生我者") {
                return sameGender ? "偏印" : "正印";
            }
            return "";
        }

        function calculateLifeStage(branchChar, stemChar) {
            const stemEl = getElement(stemChar);
            if (!stemEl) return "";
            const branchIdx = deizi_order.indexOf(branchChar);
            if (branchIdx === -1) return "";
            return tenkan_deizi_rel[stemEl][branchIdx] || "";
        }

        function formatHiddenStemLine(stemChar, dayMasterChar) {
            const god = calculateTenGod(stemChar, dayMasterChar);
            const col = getElementColor(stemChar);
            return `<div class="hidden-stem-line"><span class="stem-char" style="color:${col}">${stemChar}</span><span class="god-text">${god}</span></div>`;
        }

        function findStemRelationships(stems) {
            const results = [];
            const N = stems.length;

            for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        if ((s1 === pair[0] && s2 === pair[1]) || (s1 === pair[1] && s2 === pair[0])) {
                            results.push({
                                label: `${pair[0]}${pair[1]}合`,
                                color: getElementColor(elem),
                                indices: [i, j],
                                active: [true, true],
                                markerType: 'circle'
                            });
                        }
                    }
                }
            }

            for (const [key, pair] of Object.entries(tenkan_relationships["沖"])) {
                const targetStem = pair[0];
                const clasherStem = pair[1];

        // --- INVISIBLE HEAVENLY STEM RELATIONSHIPS (盲派 暗天干) ---
        function findInvisibleStemRelationships(stems) {  
            const results = [];
            const N = stems.length;
            const seen = new Set();

            const stemHeYinMap = {
                "甲_己": "己", "己_甲": "己",
                "乙_庚": "辛", "庚_乙": "辛",
                "丙_辛": "癸", "辛_丙": "癸",
                "丁_壬": "乙", "壬_丁": "乙",
                "戊_癸": "丁", "癸_戊": "丁"
            };

            const stemChongMap = {
                "甲": "庚", "乙": "辛", "丙": "壬", "丁": "癸", "戊": "甲",
                "己": "乙", "庚": "丙", "辛": "丁", "壬": "戊", "癸": "己"
            };

            // Dynamically build a map for 合 partners from tenkan_relationships["合"]
            const stemHePartnerMap = {};
            if (typeof tenkan_relationships !== "undefined" && tenkan_relationships["合"]) {
                for (const [elem, pair] of Object.entries(tenkan_relationships["合"])) {
                    stemHePartnerMap[pair[0]] = pair[1];
                    stemHePartnerMap[pair[1]] = pair[0];
                }
            }

            // 1. Check adjacent/neighboring stems (distance 1)
            for (let i = 0; i < N - 1; i++) {
                const j = i + 1;
                const s1 = stems[i];
                const s2 = stems[j];
                const idx1 = tenkan_order.indexOf(s1);
                const idx2 = tenkan_order.indexOf(s2);

                if (idx1 !== -1 && idx2 !== -1) {
                    if ((idx2 - idx1 + 10) % 10 === 1 || (idx1 - idx2 + 10) % 10 === 1) {
                        const key = `neighbor_${i}_${j}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'neighbor',
                                indices: [i, j],
                                hiddenStem: null
                            });
                        }
                    }
                }
            }

            // 2. Check pairs of stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const s1 = stems[i];
                    const s2 = stems[j];

                    // Rule: Two identical Heavenly Stems spawn their 合 partner
                    if (s1 === s2 && stemHePartnerMap[s1]) {
                        const partnerStem = stemHePartnerMap[s1];
                        const key = `two_same_${i}_${j}_${partnerStem}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            results.push({
                                type: 'two_same',
                                indices: [i, j],
                                hiddenStem: partnerStem
                            });
                        }
                    }

                    const idx1 = tenkan_order.indexOf(s1);
                    const idx2 = tenkan_order.indexOf(s2);

                    if (idx1 !== -1 && idx2 !== -1) {
                        // Missing stem in sequence (distance 2)
                        let missingStem = null;
                        if ((idx2 - idx1 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx1 + 1) % 10];
                        } else if ((idx1 - idx2 + 10) % 10 === 2) {
                            missingStem = tenkan_order[(idx2 + 1) % 10];
                        }

                        if (missingStem) {
                            const key = `missing_${i}_${j}_${missingStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'missing_one',
                                    indices: [i, j],
                                    hiddenStem: missingStem
                                });
                            }
                        }

                        // He-Yin (合化引出) stems
                        const comboKey = `${s1}_${s2}`;
                        if (stemHeYinMap[comboKey]) {
                            const yinStem = stemHeYinMap[comboKey];
                            const key = `he_yin_${i}_${j}_${yinStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'he_yin',
                                    indices: [i, j],
                                    hiddenStem: yinStem
                                });
                            }
                        }
                    }
                }
            }

            // 3. Check three identical stems
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        const s1 = stems[i];
                        const s2 = stems[j];
                        const s3 = stems[k];

                        if (s1 === s2 && s2 === s3 && stemChongMap[s1]) {
                            const qishaStem = stemChongMap[s1];
                            const key = `three_same_${i}_${j}_${k}_${qishaStem}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    type: 'three_same',
                                    indices: [i, j, k],
                                    hiddenStem: qishaStem
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

        // --- INVISIBLE EARTHLY BRANCH RELATIONSHIPS (盲派 暗拱/暗夾) ---
        function findInvisibleBranchRelationships(branches) {
            const results = [];
            const N = branches.length;
            const seen = new Set();

            const sanHeGong = {
                "子": ["申", "辰"],
                "酉": ["巳", "丑"],
                "午": ["寅", "戌"],
                "卯": ["亥", "未"]
            };

                ["子", "丑"], ["寅", "亥"], ["卯", "戌"],
                ["酉", "辰"], ["巳", "申"], ["午", "未"]
            ];
            function getSixRelPartner(b) {
                for (const pair of sixRelPairs) {
                    if (pair[0] === b) return pair[1];
                    if (pair[1] === b) return pair[0];
                }
                return null;
            }

            const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    for (const [targetHidden, pair] of Object.entries(sanHeGong)) {
                        if ((b1 === pair[0] && b2 === pair[1]) || (b1 === pair[1] && b2 === pair[0])) {

                                });

                    if (b1 === b2) {
                        const partner = getSixRelPartner(b1);
                        if (partner) {
                            const key = `${i}_${j}_${partner}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],

                                    color: getElementColor(partner)
                                });
                            }

                    const idx1 = zhiOrder.indexOf(b1);
                    const idx2 = zhiOrder.indexOf(b2);
                    if (idx1 !== -1 && idx2 !== -1) {
                        if ((idx2 - idx1 + 12) % 12 === 2) {
                            const hiddenIdx = (idx1 + 1) % 12;
                            const targetHidden = zhiOrder[hiddenIdx];
                            const key = `${i}_${j}_${targetHidden}`;
                            if (!seen.has(key)) {
                                seen.add(key);
                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        } else if ((idx1 - idx2 + 12) % 12 === 2) {
                            const hiddenIdx = (idx2 + 1) % 12;

                            const key = `${i}_${j}_${targetHidden}`;

                                results.push({
                                    indices: [i, j],
                                    hiddenBranch: targetHidden,
                                    color: getElementColor(targetHidden)
                                });
                            }
                        }
                    }
                }
            }

            return results;
        }

                        });
                    }
                }
            }

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    if (b1 === b2 && 自刑.includes(b1)) {
                        results.push({
                            label: `${b1}${b2}自刑`,
                            color: "purple",
                            indices: [i, j],
                            active: [true, true],
                            markerType: 'arrow'
                        });
                    }
                }
            }

            return results;
        }

        function renderRelationships(branches) {
            const container = document.getElementById('relContainer');
            if (!container) return;

            const rels = findBranchRelationships(branches);

            if (rels.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'block';

            const N = branches.length;
            const xCoords = Array.from({length: N}, (_, i) => 45 + i * 98);
            const viewBoxWidth = N * 90 + (N - 1) * 8;
            const layerHeight = 40;
            const totalHeight = rels.length * layerHeight + 8;

            let svgHtml = `<svg width="100%" height="${totalHeight}" viewBox="0 0 ${viewBoxWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">`;

            rels.forEach((rel, k) => {
                const yTop = k * layerHeight + 6;
                const yBar = yTop + 12;
                const yText = yBar + 16;

                const sortedIndices = [...rel.indices].sort((a, b) => a - b);
                const minX = xCoords[sortedIndices[0]];
                const maxX = xCoords[sortedIndices[sortedIndices.length - 1]];

                let strokeColor = getRelColor(rel.color);
                let textFillColor = getRelColor(rel.color);

                if (rel.isFireEarth) {
                    const gradId = `fireEarthGrad_${k}`;
                    const textGradId = `fireEarthTextGrad_${k}`;
                    const cRed = getRelColor("red");
                    const cBrown = getRelColor("brown");

                    svgHtml += `
                        <defs>
                            <linearGradient id="${gradId}" x1="${minX}" y1="0" x2="${maxX}" y2="0" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="${cRed}" />
                                <stop offset="50%" stop-color="${cRed}" />
                                <stop offset="50%" stop-color="${cBrown}" />
                                <stop offset="100%" stop-color="${cBrown}" />
                            </linearGradient>
                            <linearGradient id="${textGradId}" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="${cRed}" />
                                <stop offset="50%" stop-color="${cRed}" />
                                <stop offset="50%" stop-color="${cBrown}" />
                                <stop offset="100%" stop-color="${cBrown}" />
                            </linearGradient>
                        </defs>
                    `;
                    strokeColor = `url(#${gradId})`;
                    textFillColor = `url(#${textGradId})`;
                }

                svgHtml += `<line x1="${minX}" y1="${yBar}" x2="${maxX}" y2="${yBar}" stroke="${strokeColor}" stroke-width="2" />`;

                rel.indices.forEach((idx, arrIdx) => {
                    const x = xCoords[idx];
                    const isActive = rel.active[arrIdx];

                    let itemColor = strokeColor;
                    if (rel.isFireEarth) {
                        itemColor = (idx === sortedIndices[0]) ? getRelColor("red") : getRelColor("brown");
                    }

                    if (isActive) {
                        if (rel.markerType === 'circle') {
                            const r = 3.5;
                            svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yTop + r}" stroke="${itemColor}" stroke-width="2" />`;
                            svgHtml += `<circle cx="${x}" cy="${yTop + r}" r="${r}" fill="${itemColor}" />`;
                        } else {
                            svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yTop + 5}" stroke="${itemColor}" stroke-width="2" />`;
                            svgHtml += `<polygon points="${x - 4},${yTop + 5} ${x},${yTop} ${x + 4},${yTop + 5}" fill="${itemColor}" />`;
                        }
                    } else {
                        svgHtml += `<line x1="${x}" y1="${yBar}" x2="${x}" y2="${yTop}" stroke="${itemColor}" stroke-width="2" />`;
                    }
                });

                const textX = (minX + maxX) / 2;
                const coloredText = formatColoredLabel(rel.label, textFillColor);
                svgHtml += `<text x="${textX}" y="${yText}" font-size="14" font-weight="700" text-anchor="middle">${coloredText}</text>`;
            });

            svgHtml += `</svg>`;
            container.innerHTML = svgHtml;
        }

        function getLiunianList(dayunIdx) {
            if (!currentBaziData || !currentBaziData.big_start_time) return [];

            var p = new paipan();

            const tStart = times[dayunIdx];
            const startAns = p.GetInfo(sex, tStart[0], tStart[1], tStart[2], tStart[3], 0, 0);
            if (!startAns || !startAns.bazi) return [];

            let curStem = startAns.bazi[0];
            let curBranch = startAns.bazi[1];
            let curYear = tStart[0];

            let endStem = null, endBranch = null;
            if (dayunIdx < times.length - 1 && times[dayunIdx + 1]) {
                const tEnd = times[dayunIdx + 1];
                const endAns = p.GetInfo(sex, tEnd[0], tEnd[1], tEnd[2], tEnd[3], 0, 0);
                if (endAns && endAns.bazi) {

                }
            }

            const list = [];
            let sIdx = tenkan_order.indexOf(curStem);
            let bIdx = deizi_order.indexOf(curBranch);

            if (sIdx === -1 || bIdx === -1) return [];

            for (let i = 0; i < 15; i++) {
                const s = tenkan_order[(sIdx + i) % 10];
                const b = deizi_order[(bIdx + i) % 12];
                const y = curYear + i;

                list.push({ year: y, stem: s, branch: b });

                if (endStem && endBranch && s === endStem && b === endBranch) {
                    break;
                }
                if (!endStem && i === 9) {
                    break;
                }
            }
            return list;

        function getLiunianStartTime(dayunIdx, liunianIdx) {
            if (liunianIdx === 0) {
                if (currentBaziData && currentBaziData.big_start_time && currentBaziData.big_start_time[dayunIdx]) {
                    return currentBaziData.big_start_time[dayunIdx];
                }
            }
            const liunianList = getLiunianList(dayunIdx);
            if (!liunianList[liunianIdx]) return null;
            const target = liunianList[liunianIdx];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let d = new Date(target.year, 1, 1, 0, 0, 0);
            for (let h = 0; h < 30 * 24; h++) {
                let y = d.getFullYear();
                let m = d.getMonth() + 1;
                let day = d.getDate();
                let hr = d.getHours();

                let ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                if (ans && ans.bazi && ans.bazi[0] === target.stem && ans.bazi[1] === target.branch) {
                    return [y, m, day, hr];
                }
                d.setHours(d.getHours() + 1);
            }
            return [target.year, 2, 4, 0];
        }

        function getLiuyueList(dayunIdx, liunianIdx) {
            const startTime = getLiunianStartTime(dayunIdx, liunianIdx);
            if (!startTime) return [];

            var p = new paipan();
            p.zwz = false;
            var sex = parseInt(document.getElementById('sexSelect').value, 10);

            let curDate = new Date(startTime[0], startTime[1] - 1, startTime[2], startTime[3], 0, 0);

            let y = curDate.getFullYear();
            let m = curDate.getMonth() + 1;
            let day = curDate.getDate();
            let hr = curDate.getHours();

            let startAns = p.GetInfo(sex, y, m, day, hr, 0, 0);
            if (!startAns || !startAns.bazi) return [];

            const targetYearStem = startAns.bazi[0];
            let prevMonthStem = startAns.bazi[2];
            let prevMonthBranch = startAns.bazi[3];

            const list = [];

            function toOddHour(hour) {
                if (hour % 2 === 0) {
                    return hour === 0 ? 23 : hour - 1;
                }
                return hour;
            }

            const initHour = toOddHour(hr);
            const initTimeStr = String(initHour).padStart(2, '0') + ':00';
            list.push({
                date: `${monthNames[m - 1]} ${day}.`,
                timeStr: initTimeStr,
                stem: prevMonthStem,
                branch: prevMonthBranch,
                startDate: [y, m, day, hr]
            });

            let safetyCounter = 0;
            while (safetyCounter < 20) {
                safetyCounter++;

                if (curDate.getDate() > 9) {
                    curDate.setMonth(curDate.getMonth() + 1);
                    curDate.setDate(2);
                    curDate.setHours(0, 0, 0, 0);
                }

                let foundNextMonth = false;

                while (true) {
                    let cy = curDate.getFullYear();
                    let cm = curDate.getMonth() + 1;
                    let cd = curDate.getDate();
                    let ch = curDate.getHours();

                    let ans = p.GetInfo(sex, cy, cm, cd, ch, 0, 0);
                    if (!ans || !ans.bazi) {
                        foundNextMonth = false;
                        break;
                    }

                    if (ans.bazi[0] !== targetYearStem) {
                        return list;
                    }

                    if (ans.bazi[2] !== prevMonthStem || ans.bazi[3] !== prevMonthBranch) {
                        prevMonthStem = ans.bazi[2];
                        prevMonthBranch = ans.bazi[3];

                        const displayHour = toOddHour(ch);
                        const displayDate = (ch === 0) ? `${monthNames[cm - 1]} ${cd - 1}.` : `${monthNames[cm - 1]} ${cd}.`;
                        const changeTimeStr = String(displayHour).padStart(2, '0') + ':00';

                        p.GetInfo(sex, cy, cm, cd, ch, 0, 0);

                        list.push({
                            date: displayDate,
                            timeStr: changeTimeStr,
                            stem: prevMonthStem,
                            branch: prevMonthBranch,
                            startDate: [cy, cm, cd, ch]
                        });
                        foundNextMonth = true;
                        break;
                    }

                    curDate.setHours(curDate.getHours() + 1);

                    if (curDate.getDate() > 9) {
                        curDate.setMonth(curDate.getMonth() + 1);
                        curDate.setDate(2);
                        curDate.setHours(0, 0, 0, 0);
                    }
                }

                if (!foundNextMonth) break;
            }

            return list;
        }

            let prevDayStem = null;
            let prevDayBranch = null;

            const list = [];
            let lastHeaderMonth = null;
            let lastHeaderDay = null;

            let safetyHours = 0;
            while (safetyHours < 40 * 24) {
                safetyHours += 2;

                let y = curDate.getFullYear();

                    break;
                }

                let curDayStem = ans.bazi[4];
                let curDayBranch = ans.bazi[5];

                if (prevDayStem === null) {
                    prevDayStem = curDayStem;
                    prevDayBranch = curDayBranch;
                    lastHeaderMonth = m;
                    lastHeaderDay = day;

                    let oddHr = (hr % 2 === 0) ? (hr === 0 ? 23 : hr - 1) : hr;

                    let dateStr = `${monthNames[m - 1]} ${getOrdinalDay(day)}`;

                    list.push({
                        date: dateStr,
                        timeStr: timeStr,
                        stem: curDayStem,
                        branch: curDayBranch,
                        startDate: [y, m, day, hr]
                    });
                } else if (curDayStem !== prevDayStem || curDayBranch !== prevDayBranch) {
                    prevDayStem = curDayStem;
                    prevDayBranch = curDayBranch;

                    let oddHr = (hr % 2 === 0) ? (hr === 0 ? 23 : hr - 1) : hr;
                    let timeStr = String(oddHr).padStart(2, '0') + ':00';
                    let dateStr = "";

                    if (m !== lastHeaderMonth) {
                        dateStr = `${monthNames[m - 1]} ${getOrdinalDay(day)}`;
                        lastHeaderMonth = m;
                        lastHeaderDay = day;
                    } else if (day !== lastHeaderDay) {
                        dateStr = `${getOrdinalDay(day)}`;
                        lastHeaderDay = day;
                    }

                    list.push({
                        date: dateStr,
                        timeStr: timeStr,
                        stem: curDayStem,
                        branch: curDayBranch,
                        startDate: [y, m, day, hr]
                    });
                }

                curDate.setHours(curDate.getHours() + 2);
            }

            return list;
        }

                    curDate.setDate(curDate.getDate() - 1);
                }
                curDate.setHours(oddHr);
            }

            const targetDayStem = dayItem.stem;
            const targetDayBranch = dayItem.branch;

            const list = [];
            let prevDay = null;

            for (let i = 0; i < 12; i++) {
                let y = curDate.getFullYear();

                let day = curDate.getDate();
                let hr = curDate.getHours();

                if (ans.bazi[4] !== targetDayStem || ans.bazi[5] !== targetDayBranch) {
                    if (i === 0) {
                        curDate = new Date(startT[0], startT[1] - 1, startT[2], startT[3], 0, 0);
                        y = curDate.getFullYear();
                        m = curDate.getMonth() + 1;
                        day = curDate.getDate();
                        hr = curDate.getHours();
                        ans = p.GetInfo(sex, y, m, day, hr, 0, 0);
                        if (!ans || !ans.bazi || ans.bazi[4] !== targetDayStem || ans.bazi[5] !== targetDayBranch) {
                            break;
                        }
                    } else {
                        break;
                    }
                }

                let timeStem = ans.bazi[6];
                let timeBranch = ans.bazi[7];

                let timeStr = String(hr).padStart(2, '0') + ':00';
                let dateStr = "";

                if (prevDay !== null && day !== prevDay) {

                list.push({

                });

                curDate.setHours(curDate.getHours() + 2);
            }

            return list;

            const times = currentBaziData.big_start_time || [];
            let dayunIdx = -1;

        // BaZi Pian Cai (Indirect Wealth) Mapping: Same Polarity Element Controlled
        const pianCaiDict = {
            '甲': '戊', '乙': '己',
            '丙': '庚', '丁': '辛',
            '戊': '壬', '己': '癸',
            '庚': '甲', '辛': '乙',
            '壬': '丙', '癸': '丁'
        };

        function triggerArrows(clickedElement, sourceChar) { 
            const targetChar = pianCaiDict[sourceChar];  
            if (!targetChar) return;

            const canvas = document.getElementById('arrowCanvas');
            if (!canvas) return;

            const startRect = clickedElement.getBoundingClientRect();
            const startX = startRect.left + (startRect.width / 2);
            const startY = startRect.top + (startRect.height / 2);
            const startOffsetRadius = clickedElement.classList.contains('main-pillar-stem') ? 35 : 12;

            const possibleTargets = document.querySelectorAll('.main-pillar-stem, #invisibleStemRelContainer text.spawned-stem'); 

            possibleTargets.forEach(target => {
                if (target === clickedElement) return;

                const endRect = target.getBoundingClientRect();
                if (endRect.width === 0 || endRect.height === 0) return;

                if (target.textContent.trim() === targetChar) {
                    const endX = endRect.left + (endRect.width / 2);
                    const endY = endRect.top + (endRect.height / 2);

                    const dx = endX - startX;
                    const dy = endY - startY;
                    const distance = Math.hypot(dx, dy);
                    const angle = Math.atan2(dy, dx);
                    
                    const endOffsetRadius = target.classList.contains('main-pillar-stem') ? 35 : 12; 
                    
                    if (distance > (startOffsetRadius + endOffsetRadius)) {
                        const adjustedStartX = startX + Math.cos(angle) * startOffsetRadius;
                        const adjustedStartY = startY + Math.sin(angle) * startOffsetRadius;

                        const adjustedEndX = endX - Math.cos(angle) * endOffsetRadius;
                        const adjustedEndY = endY - Math.sin(angle) * endOffsetRadius;

                        const adjustedDistance = Math.hypot(adjustedEndX - adjustedStartX, adjustedEndY - adjustedStartY);

                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", adjustedStartX);
                        line.setAttribute("y1", adjustedStartY);
                        line.setAttribute("x2", adjustedEndX);
                        line.setAttribute("y2", adjustedEndY);
                        line.setAttribute("stroke", "orange");
                        line.setAttribute("stroke-width", "2.5");
                        line.setAttribute("marker-end", "url(#arrowhead)");
                        
                        line.style.strokeDasharray = adjustedDistance;
                        line.style.strokeDashoffset = adjustedDistance;
                        
                        canvas.appendChild(line);
                        
                        line.animate([
                            { strokeDashoffset: adjustedDistance },
                            { strokeDashoffset: 0 }
                        ], { duration: 600, easing: 'ease-out', fill: 'forwards' });

                        line.animate([
                            { opacity: 1 },
                            { opacity: 0 }
                        ], { duration: 500, delay: 1500, easing: 'ease-out', fill: 'forwards' });
                        
                        setTimeout(() => line.remove(), 2100);
                    }
                }
            });
        }

                } else if (idx === liushiColIdx) {
                    extraStyle = ' border-color:#17a2b8; cursor:pointer;';
                    clickAttr = ' onclick="removeLiushi()"';
                }
                html += `<div class="bazi-rect${extraClass}" style="${extraStyle}"${clickAttr}>${ls}</div>`;
            });

            // Rows 10 & 11: Hidden Stems
            for (let row = 1; row <= 2; row++) {
                hiddenStemsData.forEach((item, idx) => {
                    let extraStyle = '';
                    let clickAttr = '';
                    if (idx === yuanyunColIdx) {
                        extraStyle = ' border-color:#e83e8c; cursor:pointer;';
                        clickAttr = ' onclick="removeYuanyun()"';
                    } else if (idx === dayunColIdx) {
                        extraStyle = ' border-color:#007bff; cursor:pointer;';
                        clickAttr = ' onclick="removeDayun()"';
                    } else if (idx === liunianColIdx) {
                        extraStyle = ' border-color:#e67e22; cursor:pointer;';
                        clickAttr = ' onclick="removeLiunian()"';
                    } else if (idx === liuyueColIdx) {
                        extraStyle = ' border-color:#6f42c1; cursor:pointer;';
                        clickAttr = ' onclick="removeLiuyue()"';
                    } else if (idx === liuriColIdx) {
                        extraStyle = ' border-color:#28a745; cursor:pointer;';
                        clickAttr = ' onclick="removeLiuri()"';
                    } else if (idx === liushiColIdx) {
                        extraStyle = ' border-color:#17a2b8; cursor:pointer;';
                        clickAttr = ' onclick="removeLiushi()"';
                    }
                    html += `<div class="bazi-rect bazi-rect-hidden" id="rect_h_r${row}_c${idx}" style="${extraStyle}"${clickAttr}></div>`;
                });
            }

            baziGrid.innerHTML = html;

            hiddenStemsData.forEach((item, idx) => {
                const el1 = document.getElementById(`rect_h_r1_c${idx}`);
                const el2 = document.getElementById(`rect_h_r2_c${idx}`);
                const hStems = deizi_hidden_tenkan[item.branch] || [];

                if (hStems.length === 0) {
                    if (el1) el1.style.visibility = "hidden";
                    if (el2) el2.style.visibility = "hidden";
                } else {
                    if (el1) {
                        el1.innerHTML = formatHiddenStemLine(hStems[0], item.dm);
                        el1.style.visibility = "visible";
                    }
                    if (el2) {
                        if (hStems.length === 1) {
                            el2.style.visibility = "hidden";
                        } else if (hStems.length === 2) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm);
                            el2.style.visibility = "visible";
                        } else if (hStems.length >= 3) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm) + formatHiddenStemLine(hStems[2], item.dm);
                            el2.style.visibility = "visible";
                        }
                    }
                }
            });

            renderStemRelationships(stems);
            renderInvisibleStemRelationships(stems, headers);
            renderInvisibleBranchRelationships(branches, headers);
            renderRelationships(branches);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const hourSelect = document.getElementById('hourSelect');
            const sexSelect = document.getElementById('sexSelect');
            const splitBtn = document.getElementById('splitBtn'); 

            disableTimeBtn.addEventListener('click', () => {
                isTimeDisabled = !isTimeDisabled;
                disableTimeBtn.textContent = isTimeDisabled ? 'Enable Time' : 'Disable Time';
                
                // Optional: Add a visual highlight to the button when time is disabled
                if (isTimeDisabled) {
                    disableTimeBtn.style.backgroundColor = 'var(--card-hover)';
                    disableTimeBtn.style.borderColor = 'gray'; 
                } else {
                    disableTimeBtn.style.backgroundColor = '';
                    disableTimeBtn.style.borderColor = '';
                }
                
                renderGrid();
            });
            
            const yuanyunBtn = document.getElementById('yuanyunBtn');
            const dayunBtn = document.getElementById('dayunBtn');
            const liunianBtn = document.getElementById('liunianBtn');
            const liuyueBtn = document.getElementById('liuyueBtn');
            const liuriBtn = document.getElementById('liuriBtn');
            const liushiBtn = document.getElementById('liushiBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const nowBtn = document.getElementById('nowBtn');
            const errorResult = document.getElementById('errorResult');

            function setTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.textContent = '🌙';
                } else {
                    themeToggleBtn.textContent = '☀️';
                }
                localStorage.setItem('theme', theme);
                renderYuanyunBar();
                renderDayunBar();
                renderLiunianBar();
                renderLiuyueBar();
                renderLiuriBar();
                renderLiushiBar();
                renderGrid();
            }

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
            });

            splitBtn.addEventListener('click', () => {
                isSplitMode = !isSplitMode;
                splitBtn.textContent = isSplitMode ? 'Combine' : 'Split';
                renderGrid();
            });

            nowBtn.addEventListener('click', selectNow);

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentDate = now.getDate();
            const currentHour = now.getHours();

            const savedTheme = localStorage.getItem('theme');
            if (currentHour >= 23) {
                setTheme('dark');
            } else if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme('light');
            }

            for (let y = 1900; y <= 2100; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            for (let h = 0; h < 24; h++) {
                let opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h < 10 ? '0' + h : h;
                if (h === currentHour) opt.selected = true;
                hourSelect.appendChild(opt);
            }

            sexSelect.value = "0";

            function calculate() {
                try {
                    errorResult.textContent = "";
                    selectedYuanyun = null;
                    selectedDayun = null;   
                    selectedLiunian = null; 
                    selectedLiuyue = null;  
                    selectedLiuri = null;   
                    selectedLiushi = null;  
                    yuanyunBarVisible = false;
                    liunianBarVisible = false;
                    liuyueBarVisible = false;
                    liuriBarVisible = false;
                    liushiBarVisible = false;
                    liunianBtn.style.display = 'none';
                    liuyueBtn.style.display = 'none';
                    liuriBtn.style.display = 'none';
                    liushiBtn.style.display = 'none';

                    var p = new paipan();
                    p.zwz = false;
                    
                    const yr = parseInt(yearSelect.value, 10);
                    const mth = parseInt(monthSelect.value, 10);
                    const dy = parseInt(daySelect.value, 10);
                    const hr = parseInt(hourSelect.value, 10);
                    var sex = parseInt(sexSelect.value, 10); 

                    var ans = p.GetInfo(sex, yr, mth, dy, hr, 0, 0); 
                    
                    if (ans && ans.bazi && ans.bazi.length >= 8) {
                        const bigList = [];
                        if (ans.big) {
                            const times = ans.big_start_time || [];
                            for (let i = 0; i < ans.big.length; i += 2) {
                                const idx = i / 2;
                                const stem = ans.big[i];
                                const branch = ans.big[i + 1];
                                let year = "";
                                if (times[idx] && times[idx].length > 0) {
                                    year = times[idx][0];
                                }
                                bigList.push({ stem, branch, year });
                            }
                        }

                        currentBaziData = {
                            A: ans.bazi[0],
                            B: ans.bazi[1],
                            C: ans.bazi[2],
                            D: ans.bazi[3],
                            E: ans.bazi[4],
                            F: ans.bazi[5],
                            G: ans.bazi[6],
                            H: ans.bazi[7],
                            bigList: bigList,
                            big_start_time: ans.big_start_time
                        };

                        renderYuanyunBar();
                        renderDayunBar();
                        renderLiunianBar();
                        renderLiuyueBar();
                        renderLiuriBar();
                        renderLiushiBar();
                        renderGrid();
                    }
                } catch (e) {
                    console.error(e);
                    errorResult.textContent = "Error: " + e.message;
                }
            }

            function updateDays(targetDay) {
                const year = parseInt(yearSelect.value, 10);
                const month = parseInt(monthSelect.value, 10);
                const daysInMonth = new Date(year, month, 0).getDate();

                const currentDay = targetDay || parseInt(daySelect.value, 10) || currentDate;

                daySelect.innerHTML = '';
                for (let d = 1; d <= daysInMonth; d++) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    if (d === currentDay || (d === daysInMonth && currentDay > daysInMonth)) {
                        opt.selected = true;
                    }
                    daySelect.appendChild(opt);
                }
            }

            yearSelect.addEventListener('change', () => { updateDays(); calculate(); });
            monthSelect.addEventListener('change', () => { updateDays(); calculate(); });
            daySelect.addEventListener('change', calculate);
            hourSelect.addEventListener('change', calculate);
            sexSelect.addEventListener('change', calculate);

            yuanyunBtn.addEventListener('click', () => {
                yuanyunBarVisible = !yuanyunBarVisible;
                if (!yuanyunBarVisible) {
                    selectedYuanyun = null;
                    renderGrid();
                }
                renderYuanyunBar();
            });

            dayunBtn.addEventListener('click', () => {
                dayunBarVisible = !dayunBarVisible;
                if (!dayunBarVisible) {
                    removeDayun();
                } else {
                    renderDayunBar();
                }
            });

            liunianBtn.addEventListener('click', () => {
                liunianBarVisible = !liunianBarVisible;
                if (!liunianBarVisible) {
                    removeLiunian();
                } else {
                    renderLiunianBar();
                }
            });

            liuyueBtn.addEventListener('click', () => {
                liuyueBarVisible = !liuyueBarVisible;
                if (!liuyueBarVisible) {
                    removeLiuyue();
                } else {
                    renderLiuyueBar();
                }
            });

            liuriBtn.addEventListener('click', () => {
                liuriBarVisible = !liuriBarVisible;
                if (!liuriBarVisible) {
                    removeLiuri();
                } else {
                    renderLiuriBar();
                }
            });

            liushiBtn.addEventListener('click', () => {
                liushiBarVisible = !liushiBarVisible;
                if (!liushiBarVisible) {
                    removeLiushi();
                } else {
                    renderLiushiBar();
                }
            });

            updateDays(currentDate);
            calculate();
        }); // good ok ! 
    </script>
</body>
</html>
