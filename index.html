                } else if (idx === dayunColIdx) {
                    extraStyle = ' border-color:#007bff; cursor:pointer;';
                    clickAttr = ' onclick="removeDayun()"';
                } else if (idx === liunianColIdx) {
                    extraStyle = ' border-color:#e67e22; cursor:pointer;';
                    clickAttr = ' onclick="removeLiunian()"';
                } else if (idx === liuyueColIdx) {
                    extraStyle = ' border-color:#6f42c1; cursor:pointer;';
                    clickAttr = ' onclick="removeLiuyue()"';
                } else if (idx === liuriColIdx) {
                    extraStyle = ' border-color:#28a745; cursor:pointer;';
                    clickAttr = ' onclick="removeLiuri()"';
                } else if (idx === liushiColIdx) {
                    extraStyle = ' border-color:#d90f63; cursor:pointer;';
                    clickAttr = ' onclick="removeLiushi()"';
                }
                html += `<div class="bazi-rect${extraClass}" style="${extraStyle}"${clickAttr}>${ls}</div>`;
            });

            // Rows 10 & 11: Hidden Stems
            for (let row = 1; row <= 2; row++) {
                hiddenStemsData.forEach((item, idx) => {
                    let extraStyle = '';
                    let clickAttr = '';
                    if (idx === minggongColIdx) {
                        extraStyle = ' border-color:#6c757d; cursor:pointer;';
                        clickAttr = ' onclick="removeMinggong()"';
                    } else if (idx === yuanyunColIdx) {
                        extraStyle = ' border-color:#17a2b8; cursor:pointer;';
                        clickAttr = ' onclick="removeYuanyun()"';   
                    } else if (idx === dayunColIdx) {
                        extraStyle = ' border-color:#007bff; cursor:pointer;';
                        clickAttr = ' onclick="removeDayun()"';
                    } else if (idx === liunianColIdx) {
                        extraStyle = ' border-color:#e67e22; cursor:pointer;';
                        clickAttr = ' onclick="removeLiunian()"';
                    } else if (idx === liuyueColIdx) {
                        extraStyle = ' border-color:#6f42c1; cursor:pointer;';
                        clickAttr = ' onclick="removeLiuyue()"';
                    } else if (idx === liuriColIdx) {
                        extraStyle = ' border-color:#28a745; cursor:pointer;';
                        clickAttr = ' onclick="removeLiuri()"';
                    } else if (idx === liushiColIdx) {
                        extraStyle = ' border-color:#d90f63; cursor:pointer;';
                        clickAttr = ' onclick="removeLiushi()"';
                    }
                    html += `<div class="bazi-rect bazi-rect-hidden" id="rect_h_r${row}_c${idx}" style="${extraStyle}"${clickAttr}></div>`;
                });
            }

            baziGrid.innerHTML = html;

            hiddenStemsData.forEach((item, idx) => {
                const el1 = document.getElementById(`rect_h_r1_c${idx}`);
                const el2 = document.getElementById(`rect_h_r2_c${idx}`);
                const hStems = deizi_hidden_tenkan[item.branch] || [];  

                if (hStems.length === 0) {
                    if (el1) el1.style.visibility = "hidden";
                    if (el2) el2.style.visibility = "hidden";
                } else {
                    if (el1) {
                        el1.innerHTML = formatHiddenStemLine(hStems[0], item.dm);
                        el1.style.visibility = "visible";
                    }
                    if (el2) {
                        if (hStems.length === 1) {
                            el2.style.visibility = "hidden";
                        } else if (hStems.length === 2) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm);
                            el2.style.visibility = "visible";
                        } else if (hStems.length >= 3) {
                            el2.innerHTML = formatHiddenStemLine(hStems[1], item.dm) + formatHiddenStemLine(hStems[2], item.dm);
                            el2.style.visibility = "visible";
                        }
                    }
                }
            });

            renderStemRelationships(stems);
            renderInvisibleStemRelationships(stems, headers);
            renderInvisibleBranchRelationships(branches, headers); 
            renderRelationships(branches);

            document.querySelectorAll('.main-pillar-branch, .time-pillar-branch, text.spawned-branch').forEach(branchElem => {
                branchElem.onclick = function(event) {
                    event.stopPropagation();
                    const branchChar = this.textContent.trim();
                    triggerDizhiArrows(this, branchChar);
                    drawXingArrows(this, branchChar); 
                };
            }); 
        } 

        document.addEventListener("DOMContentLoaded", () => {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const hourSelect = document.getElementById('hourSelect');
            const sexSelect = document.getElementById('sexSelect');
            const splitBtn = document.getElementById('splitBtn'); 

            disableTimeBtn.addEventListener('click', () => {
                isTimeDisabled = !isTimeDisabled;
                disableTimeBtn.textContent = isTimeDisabled ? 'Enable Time' : 'Disable Time';
                
                // Optional: Add a visual highlight to the button when time is disabled
                if (isTimeDisabled) {
                    disableTimeBtn.style.backgroundColor = 'var(--card-hover)';
                    disableTimeBtn.style.borderColor = 'gray'; 
                } else {
                    disableTimeBtn.style.backgroundColor = '';
                    disableTimeBtn.style.borderColor = '';
                }
                
                renderGrid();
            });

            // Bind all input selectors to trigger grid & 命宮 recalculation
            ['yearSelect', 'monthSelect', 'daySelect', 'hourSelect', 'sexSelect'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => {
                        // Update currentBaziData here via paipan calculation logic
                        updateBaziData(); 
                        renderGrid();
                    });
                }
            });

            // Bind 命宮 Toggle Button
            const minggongBtn = document.getElementById('minggongBtn');
            if (minggongBtn) {
                minggongBtn.addEventListener('click', () => {
                    minggongBarVisible = !minggongBarVisible;
                    renderMinggongBar();
                    renderGrid();
                });
            }

            document.getElementById('hehuaBtn').addEventListener('click', function() {
                isHeHuaEnabled = !isHeHuaEnabled;
                this.innerText = isHeHuaEnabled ? "Disable 合化" : "Enable 合化";
                renderGrid(); 
            });

            const yuanyunBtn = document.getElementById('yuanyunBtn');
            const dayunBtn = document.getElementById('dayunBtn');
            const liunianBtn = document.getElementById('liunianBtn');
            const liuyueBtn = document.getElementById('liuyueBtn');
            const liuriBtn = document.getElementById('liuriBtn');
            const liushiBtn = document.getElementById('liushiBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const nowBtn = document.getElementById('nowBtn');
            const errorResult = document.getElementById('errorResult');

            function setTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.textContent = '🌙';
                } else {
                    themeToggleBtn.textContent = '☀️';
                }
                localStorage.setItem('theme', theme);
                renderYuanyunBar();
                renderDayunBar();
                renderLiunianBar();
                renderLiuyueBar();
                renderLiuriBar();
                renderLiushiBar();
                renderGrid();
            }

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
            });

            splitBtn.addEventListener('click', () => {
                isSplitMode = !isSplitMode;
                splitBtn.textContent = isSplitMode ? 'Combine' : 'Split';
                renderGrid();
            });

            nowBtn.addEventListener('click', selectNow);

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentDate = now.getDate();
            const currentHour = now.getHours();

            const savedTheme = localStorage.getItem('theme');
            if (currentHour >= 23) {
                setTheme('dark');
            } else if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme('light');
            }

            for (let y = 1600; y <= 2100; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            } 

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            for (let h = 0; h < 24; h++) {
                let opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h < 10 ? '0' + h : h;
                if (h === currentHour) opt.selected = true;
                hourSelect.appendChild(opt);
            }

            sexSelect.value = "0";

            function calculate() {
                try {
                    errorResult.textContent = "";
                    selectedYuanyun = null;
                    selectedDayun = null;   
                    selectedLiunian = null; 
                    selectedLiuyue = null;  
                    selectedLiuri = null;   
                    selectedLiushi = null;  
                    yuanyunBarVisible = false;
                    liunianBarVisible = false;
                    liuyueBarVisible = false;
                    liuriBarVisible = false;
                    liushiBarVisible = false;
                    liunianBtn.style.display = 'none';
                    liuyueBtn.style.display = 'none';
                    liuriBtn.style.display = 'none';
                    liushiBtn.style.display = 'none';

                    var p = new paipan();
                    p.zwz = false;
                    
                    const yr = parseInt(yearSelect.value, 10);
                    const mth = parseInt(monthSelect.value, 10);
                    const dy = parseInt(daySelect.value, 10);
                    const hr = parseInt(hourSelect.value, 10);
                    var sex = parseInt(sexSelect.value, 10); 

                    var ans = p.GetInfo(sex, yr, mth, dy, hr, 0, 0); 
                    console.log(ans); 
                    
                    if (ans && ans.bazi && ans.bazi.length >= 8) {
                        const bigList = [];
                        if (ans.big) {
                            const times = ans.big_start_time || [];
                            for (let i = 0; i < ans.big.length; i += 2) {
                                const idx = i / 2;
                                const stem = ans.big[i];
                                const branch = ans.big[i + 1];
                                let year = "";
                                if (times[idx] && times[idx].length > 0) {
                                    year = times[idx][0];
                                }
                                bigList.push({ stem, branch, year });
                            }
                        }

                        currentBaziData = {
                            A: ans.bazi[0],
                            B: ans.bazi[1],
                            C: ans.bazi[2],
                            D: ans.bazi[3],
                            E: ans.bazi[4],
                            F: ans.bazi[5],
                            G: ans.bazi[6],
                            H: ans.bazi[7],
                            bigList: bigList,
                            big_start_time: ans.big_start_time
                        };

                        renderYuanyunBar();
                        renderDayunBar();
                        renderLiunianBar();
                        renderLiuyueBar();
                        renderLiuriBar();
                        renderLiushiBar();
                        renderGrid();
                    }
                } catch (e) {
                    console.error(e);
                    errorResult.textContent = "Error: " + e.message;
                }
            }

            function updateDays(targetDay) {
                const year = parseInt(yearSelect.value, 10);
                const month = parseInt(monthSelect.value, 10);
                const daysInMonth = new Date(year, month, 0).getDate();

                const currentDay = targetDay || parseInt(daySelect.value, 10) || currentDate;

                daySelect.innerHTML = '';
                for (let d = 1; d <= daysInMonth; d++) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    if (d === currentDay || (d === daysInMonth && currentDay > daysInMonth)) {
                        opt.selected = true;
                    }
                    daySelect.appendChild(opt);
                }
            }

            yearSelect.addEventListener('change', () => { updateDays(); calculate(); });
            monthSelect.addEventListener('change', () => { updateDays(); calculate(); });
            daySelect.addEventListener('change', calculate);
            hourSelect.addEventListener('change', calculate);
            sexSelect.addEventListener('change', calculate);

            yuanyunBtn.addEventListener('click', () => {
                yuanyunBarVisible = !yuanyunBarVisible;
                renderYuanyunBar(); 
            });

            dayunBtn.addEventListener('click', () => {
                dayunBarVisible = !dayunBarVisible;
                renderDayunBar();
            });

            liunianBtn.addEventListener('click', () => {
                liunianBarVisible = !liunianBarVisible;
                renderLiunianBar();
            });

            liuyueBtn.addEventListener('click', () => {
                liuyueBarVisible = !liuyueBarVisible;
                renderLiuyueBar();
            });

            liuriBtn.addEventListener('click', () => {
                liuriBarVisible = !liuriBarVisible;
                renderLiuriBar();
            });

            liushiBtn.addEventListener('click', () => {
                liushiBarVisible = !liushiBarVisible;
                renderLiushiBar();
            });

            updateDays(currentDate);
            calculate();
        }); 
    </script>
</body>
</html>
